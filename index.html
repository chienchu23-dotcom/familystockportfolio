                                          mainTimeRange === range 
                                          ? 'bg-blue-500 text-white shadow-md transform scale-105' 
                                          : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'
                                      }`}
                                  >
                                      {range === '1Y' ? '1年' : range.replace('M', '月')}
                                  </button>
                              ))}
                          </div>
                      </div>
                      <div className="h-72 w-full text-xs">
                        <ResponsiveContainer width="100%" height="100%">
                          <AreaChart data={trendData} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                            <defs>
                                <linearGradient id="colorValue" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#3B82F6" stopOpacity={0.1}/>
                                    <stop offset="95%" stopColor="#3B82F6" stopOpacity={0}/>
                                </linearGradient>
                            </defs>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0"/>
                            <XAxis 
                                dataKey="date" 
                                axisLine={false} 
                                tickLine={false} 
                                tick={{fill: '#64748B', fontSize: 11}} 
                                tickFormatter={formatAxisDate}
                                minTickGap={30}
                            />
                            <YAxis 
                                hide={false} 
                                axisLine={false} 
                                tickLine={false} 
                                tick={{fill: '#64748B', fontSize: 11}}
                                tickFormatter={formatAxisValue}
                                domain={['auto', 'auto']}
                                width={45}
                            />
                            <RechartsTooltip 
                                formatter={(value, name) => [formatCurrency(value), name]} 
                                labelFormatter={formatAxisDate}
                                contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                            />
                            <Legend verticalAlign="top" height={36}/>
                            <Brush 
                                dataKey="date" 
                                height={30} 
                                stroke="#cbd5e1" 
                                tickFormatter={formatAxisDate}
                                fill="#f8fafc"
                            />
                            {members.map((member, index) => (
                                <Area 
                                    key={member.id}
                                    type="monotone" 
                                    dataKey={member.id} 
                                    name={member.name} 
                                    stackId="1" 
                                    stroke={COLORS[index % COLORS.length]} 
                                    fill={COLORS[index % COLORS.length]} 
                                    fillOpacity={0.6}
                                />
                            ))}
                          </AreaChart>
                        </ResponsiveContainer>
                      </div>
                    </Card>

                    {/* Inventory List */}
                    <Card className="overflow-hidden">
                       <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2"><Layers size={18} className="text-blue-500"/> 持股明細</h3>
                          <div className="flex bg-slate-200 p-0.5 rounded-lg">
                             <button onClick={() => { setHoldingViewMode('summary'); setListFilter({ memberId: null, symbol: null }); }} className={`px-3 py-1 text-xs font-medium rounded-md transition-all ${holdingViewMode === 'summary' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>彙整</button>
                             <button onClick={() => setHoldingViewMode('detail')} className={`px-3 py-1 text-xs font-medium rounded-md transition-all ${holdingViewMode === 'detail' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>明細</button>
                          </div>
                       </div>
                       
                       {holdingViewMode === 'summary' ? (
                         <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                               <thead className="bg-slate-50 text-slate-500 font-medium">
                                  <tr>
                                     <th className="p-3 pl-4">成員</th>
                                     <th className="p-3">標的</th>
                                     <th className="p-3 text-right">股數</th>
                                     <th className="p-3 text-right">均價</th>
                                     <th className="p-3 text-right">現價</th>
                                     <th className="p-3 text-right">市值</th>
                                     <th className="p-3 text-right">未實現損益</th>
                                     <th className="p-3 text-right">已實現</th>
                                     <th className="p-3 text-center">操作</th>
                                  </tr>
                               </thead>
                               <tbody className="divide-y divide-slate-100">
                                  {aggregatedHoldings.map((h, i) => (
                                     <tr 
                                        key={i} 
                                        onClick={() => handleDrillDown(h.memberId, h.symbol)}
                                        className="hover:bg-slate-50/80 transition-colors cursor-pointer group"
                                     >
                                        <td className="p-3 pl-4 font-medium text-slate-700">{h.memberName}</td>
                                        <td className="p-3">
                                           <div className="font-bold text-slate-800">{h.name}</div>
                                           <div className="text-xs text-slate-400">{h.symbol}</div>
                                        </td>
                                        <td className="p-3 text-right">{formatNumber(h.shares)}</td>
                                        <td className="p-3 text-right text-slate-500">{formatNumber(h.avgCost.toFixed(1))}</td>
                                        <td className="p-3 text-right">
                                           <div className="font-medium">{h.currentPrice || '-'}</div>
                                           {h.dailyChangePercent !== 0 && (
                                              <div className={`text-xs ${h.dailyChangePercent > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{h.dailyChangePercent > 0 ? '+' : ''}{h.dailyChangePercent.toFixed(2)}%</div>
                                           )}
                                        </td>
                                        <td className="p-3 text-right font-medium text-slate-800">{formatNumber(h.marketValue)}</td>
                                        <td className={`p-3 text-right font-medium ${h.unrealizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                           {formatNumber(h.unrealizedProfit)}
                                           <div className="text-xs opacity-75">{h.unrealizedProfitPercent.toFixed(1)}%</div>
                                        </td>
                                        <td className={`p-3 text-right ${h.realizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatNumber(h.realizedProfit)}</td>
                                        <td className="p-3 text-center">
                                           <button 
                                              onClick={(e) => { e.stopPropagation(); handleAuthRequired(() => handleDrillDown(h.memberId, h.symbol)); }} 
                                              className="text-blue-600 hover:text-blue-800 text-xs font-bold border border-blue-200 hover:bg-blue-50 px-2 py-1 rounded transition-colors"
                                           >
                                              編輯明細
                                           </button>
                                        </td>
                                     </tr>
                                  ))}
                               </tbody>
                            </table>
                            {aggregatedHoldings.length === 0 && <div className="p-8 text-center text-slate-400">目前沒有持股資料</div>}
                         </div>
                       ) : (
                         <div className="overflow-x-auto">
                            { (listFilter.memberId || listFilter.symbol) && (
                               <div className="bg-blue-50 px-4 py-2 flex justify-between items-center text-xs text-blue-700 border-b border-blue-100">
                                  <span className="flex items-center gap-1">
                                    <Filter size={12}/> 
                                    目前顯示: <b>{members.find(m => m.id === listFilter.memberId)?.name}</b> 的 <b>{listFilter.symbol}</b> 交易紀錄
                                  </span>
                                  <button onClick={() => setListFilter({ memberId: null, symbol: null })} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 hover:underline">
                                    <XCircle size={12}/> 顯示全部
                                  </button>
                               </div>
                            )}
                            <table className="w-full text-sm text-left">
                               <thead className="bg-slate-50 text-slate-500 font-medium">
                                  <tr>
                                     <th className="p-3 pl-4">日期</th>
                                     <th className="p-3">成員</th>
                                     <th className="p-3">動作</th>
                                     <th className="p-3">標的</th>
                                     <th className="p-3 text-right">股數</th>
                                     <th className="p-3 text-right">價格</th>
                                     <th className="p-3 text-right">總額</th>
                                     <th className="p-3 text-center">操作</th>
                                  </tr>
                               </thead>
                               <tbody className="divide-y divide-slate-100">
                                  {holdings.map((h) => {
                                     const member = members.find(m => m.id === h.memberId);
                                     const isBuy = h.shares > 0;
                                     return (
                                     <tr 
                                        key={h.id} 
                                        onClick={() => handleAuthRequired(() => { 
                                            // Safely merging default values to handle missing fields in legacy/imported data
                                            setEditingHolding(h); 
                                            setHoldingForm({
                                                ...holdingForm, // defaults
                                                ...h, 
                                                date: h.date, 
                                                type: h.shares > 0 ? 'buy' : 'sell', 
                                                shares: Math.abs(h.shares).toString(),
                                                fee: h.fee ? h.fee.toString() : "1",
                                                note: h.note || ""
                                            }); 
                                            setIsAddHoldingOpen(true); 
                                        })}
                                        className="hover:bg-slate-50/80 transition-colors cursor-pointer group"
                                     >
                                        <td className="p-3 pl-4 text-slate-500 whitespace-nowrap">{h.date}</td>
                                        <td className="p-3 font-medium text-slate-700">{member?.name}</td>
                                        <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${isBuy ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>{isBuy ? '買進' : '賣出'}</span></td>
                                        <td className="p-3"><div className="font-bold text-slate-800">{h.name}</div><div className="text-xs text-slate-400">{h.symbol}</div></td>
                                        <td className="p-3 text-right">{formatNumber(Math.abs(h.shares))}</td>
                                        <td className="p-3 text-right text-slate-500">{formatNumber(h.price)}</td>
                                        <td className="p-3 text-right font-medium text-slate-700">{formatNumber(Math.abs(h.shares * h.price))}</td>
                                        <td className="p-3 text-center">
                                           <button onClick={(e) => { e.stopPropagation(); handleAuthRequired(() => setDeleteConfirm({ id: h.id })); }} className="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors"><Trash2 size={16}/></button>
                                        </td>
                                     </tr>
                                  )})}
                               </tbody>
                            </table>
                            {holdings.length === 0 && <div className="p-8 text-center text-slate-400">目前沒有交易紀錄</div>}
                         </div>
                       )}
                    </Card>
                  </div>
                )}
                
                {/* 2. Analysis Tab (Placeholder for future expansion) */}
                {activeTab === 'analysis' && (
                  <div className="text-center p-12">
                    <p className="text-slate-400">更多圖表開發中...</p>
                  </div>
                )}

              </main>

              {/* Modals */}
              <Modal isOpen={isAddMemberOpen} onClose={() => setIsAddMemberOpen(false)} title="新增家庭成員">
                 <div className="space-y-4">
                    <Input label="成員名稱" placeholder="例如：爸爸、媽媽" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} />
                    <Button onClick={handleAddMember} className="w-full mt-2">新增成員</Button>
                    <div className="mt-4 pt-4 border-t border-slate-100">
                       <p className="text-xs text-slate-500 mb-2 font-semibold uppercase">現有成員</p>
                       <div className="flex flex-wrap gap-2">
                          {members.map(m => <span key={m.id} className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-sm flex items-center gap-1">{m.name}</span>)}
                       </div>
                    </div>
                 </div>
              </Modal>
              
              {/* Member Detail Modal (New!) */}
              <MemberDetailModal 
                isOpen={!!selectedMember}
                onClose={() => setSelectedMember(null)}
                member={selectedMember}
                allHoldings={allHoldings}
                year={activeYear}
              />

              {/* Unlock Modal (New!) */}
              <Modal isOpen={showUnlockModal} onClose={() => setShowUnlockModal(false)} title="安全驗證">
                 <div className="space-y-6 flex flex-col items-center">
                    <div className="bg-blue-100 p-4 rounded-full"><Lock size={32} className="text-blue-600" /></div>
                    <div className="text-center">
                        <h3 className="font-bold text-slate-800 text-lg">請輸入密碼</h3>
                        <p className="text-slate-500 text-sm mt-1">驗證身分以進行編輯</p>
                    </div>
                    
                    {/* Custom Pin Keypad */}
                    <PinKeypad 
                        value={pinInput} 
                        onInput={handlePadInput} 
                        onDelete={handlePadDelete} 
                        onClear={handlePadClear} 
                    />
                 </div>
              </Modal>

              {/* Delete Confirmation Modal */}
              <Modal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="刪除確認">
                 <div className="space-y-4">
                    <div className="flex items-center gap-3 text-red-600 bg-red-50 p-3 rounded-lg">
                       <AlertTriangle size={24} />
                       <p className="font-medium text-sm">確定要刪除這筆交易紀錄嗎？</p>
                    </div>
                    <p className="text-slate-500 text-sm">此動作無法復原，刪除後將從總資產中移除此筆交易的計算。</p>
                    <div className="flex gap-3 pt-2">
                       <Button variant="ghost" onClick={() => setDeleteConfirm(null)} className="flex-1">取消</Button>
                       <Button variant="danger" onClick={executeDelete} className="flex-1">確認刪除</Button>
                    </div>
                 </div>
              </Modal>

              <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="系統設定">
                 <div className="space-y-6">
                    <div>
                       <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><Settings size={18} className="text-blue-500"/> 資料管理</h4>
                       <div className="grid grid-cols-2 gap-3">
                          <Button variant="secondary" onClick={handleExportData} isLoading={processingSettings} className="justify-center">
                             <Download size={16}/> 匯出備份
                          </Button>
                          <div className="relative">
                             <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleImportData} 
                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                                accept=".json"
                             />
                             <Button variant="secondary" isLoading={processingSettings} className="justify-center w-full">
                                <Upload size={16}/> 匯入資料
                             </Button>
                          </div>
                          <Button variant="secondary" onClick={handleRemoveDuplicates} isLoading={processingSettings} className="justify-center text-slate-600">
                             <Copy size={16}/> 移除重複
                          </Button>
                          <Button variant="danger" onClick={handleClearData} isLoading={processingSettings} className="justify-center bg-red-50 text-red-600 hover:bg-red-100 border-red-100">
                             <Trash2 size={16}/> 清空資料
                          </Button>
                       </div>
                    </div>
                    <div className="pt-4 border-t border-slate-100">
                       <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><ShieldCheck size={18} className="text-blue-500"/> 安全性設定</h4>
                       <div className="bg-slate-50 p-4 rounded-lg border border-slate-100">
                          {hasPin ? (
                             <div className="text-center space-y-3">
                                <p className="text-emerald-600 font-medium flex items-center justify-center gap-2"><Lock size={16}/> 已啟用 PIN 碼保護</p>
                                <Button variant="secondary" className="w-full text-sm" onClick={() => { setHasPin(false); setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security'), { pin: null }); }}>移除密碼</Button>
                             </div>
                          ) : (
                             <div className="space-y-3">
                                <Input label="設定新的 PIN 碼" type="password" placeholder="4 位數字" value={newPin} onChange={e => setNewPin(e.target.value)} maxLength={4} />
                                <Button onClick={handleSetPin} className="w-full">啟用保護</Button>
                             </div>
                          )}
                       </div>
                    </div>
                 </div>
              </Modal>

              <Modal isOpen={isAddHoldingOpen} onClose={() => { setIsAddHoldingOpen(false); setEditingHolding(null); resetForm(); }} title={editingHolding ? "編輯交易紀錄" : "新增交易紀錄"}>
                 <div className="space-y-4">
                  <div className="flex bg-slate-100 rounded-lg p-1"><button className={`flex-1 py-1.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${holdingForm.type === 'buy' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400'}`} onClick={() => setHoldingForm({...holdingForm, type: 'buy'})}>買進 (Buy)</button><button className={`flex-1 py-1.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${holdingForm.type === 'sell' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`} onClick={() => setHoldingForm({...holdingForm, type: 'sell'})}>賣出 (Sell)</button></div>
                  <div className="flex flex-col gap-1"><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">持有成員</label><select value={holdingForm.memberId} onChange={e => setHoldingForm({...holdingForm, memberId: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="" disabled>選擇成員</option>{members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></div>
                  <div className="flex gap-3"><div className="flex flex-col gap-1 w-full"><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">交易日期</label><input type="date" value={holdingForm.date} onChange={e => { const newDate = e.target.value; const newYear = newDate ? newDate.split('-')[0] : holdingForm.year; setHoldingForm({ ...holdingForm, date: newDate, year: newYear }); }} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/></div></div>
                  
                  {/* Stock Symbol Input with Auto-fill */}
                  <div className="grid grid-cols-2 gap-3">
                     <div className="flex flex-col gap-1 relative">
                        <Input label="股票代號" placeholder="例如：2330" value={holdingForm.symbol} onChange={e => setHoldingForm({...holdingForm, symbol: e.target.value})} onBlur={handleSymbolBlur} onKeyDown={handleSymbolKeyDown} />
                        {loadingStockInfo && <div className="absolute right-3 top-8 text-slate-400 animate-spin"><Loader2 size={16}/></div>}
                     </div>
                     <Input label="股票名稱" placeholder="台積電" value={holdingForm.name} onChange={e => setHoldingForm({...holdingForm, name: e.target.value})} />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-3"><Input label="成交股數" type="number" placeholder="1000" value={holdingForm.shares} onChange={e => setHoldingForm({...holdingForm, shares: e.target.value})} /><Input label="成交單價" type="number" placeholder="500" value={holdingForm.price} onChange={e => setHoldingForm({...holdingForm, price: e.target.value})} /></div>
                  <div className="grid grid-cols-2 gap-3"><Input label="手續費" type="number" placeholder="20" value={holdingForm.fee} onChange={e => setHoldingForm({...holdingForm, fee: e.target.value})} /><div className="flex flex-col gap-1 justify-center"><span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">預估總金額</span><div className={`text-lg font-bold ${holdingForm.type === 'buy' ? 'text-red-600' : 'text-emerald-600'}`}>{formatNumber(calculateEstimate())}</div></div></div>
                  <Input label="備註" placeholder="例如：定期定額、波段..." value={holdingForm.note} onChange={e => setHoldingForm({...holdingForm, note: e.target.value})} /><Button onClick={handleSaveHolding} className="w-full mt-2" variant={holdingForm.type === 'buy' ? 'buyActive' : 'sellActive'}><Save size={18} /> {editingHolding ? "儲存修改" : "確認新增"}</Button>
                 </div>
              </Modal>

            </div>
          );
        }

        // --- 啟動 React ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
