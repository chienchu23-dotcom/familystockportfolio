<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭資產管家 (單檔測試版)</title>

    <!-- 1. 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
              cyan: { 50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' }
            }
          }
        }
      }
    </script>

    <!-- 2. Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.378.0?external=react,react-dom"
      }
    }
    </script>

    <!-- 3. Babel for JSX (Locked Version to fix configuration error) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <!-- 4. Global Styles -->
    <style>
      body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      /* Custom Animation for Pulse */
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: .7; }
      }
      .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      
      /* Donut Chart Center Text centering */
      .donut-center-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }
      
      /* Keypad Button Active State */
      .keypad-btn:active {
        transform: scale(0.95);
        background-color: #e2e8f0;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 5. 主要程式碼 -->
    <script type="text/babel" data-type="module">
        // --- 導入套件 (使用 Import Map 定義的名稱) ---
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { PieChart, Pie, Cell, ResponsiveContainer, Tooltip as RechartsTooltip, Legend, LineChart, Line, XAxis, YAxis, CartesianGrid, Area, AreaChart, Brush } from 'recharts';
        import { Plus, Trash2, Edit2, TrendingUp, TrendingDown, Users, DollarSign, RefreshCw, PieChart as PieChartIcon, Save, X, AlertCircle, Upload, FileText, Clock, ShieldCheck, Search, Calendar, ChevronDown, Filter, ArrowRightLeft, StickyNote, Layers, List, Activity, Lock, Settings, Unlock, Loader2, ChevronRight, XCircle, UserPlus, AlertTriangle, Download, FileJson, Copy, LockOpen, Delete } from 'lucide-react';

        // Firebase (保持 CDN 連結)
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, writeBatch, getDoc, setDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyC2mxpOL7hzieOBCv_7rPI6E-xpCe6DznA",
            authDomain: "familystockprofolio.firebaseapp.com",
            projectId: "familystockprofolio",
            storageBucket: "familystockprofolio.appspot.com",
            messagingSenderId: "338950854674",
            appId: "1:338950854674:web:0f56f1082c5053782780e0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "github-web-version";

        // --- 內建股票代號字典 (Mini Database) ---
        // 擴充包含完整上市櫃股票與 ETF 清單
        const STOCK_DICTIONARY = {
            // --- ETF ---
            '0050': '元大台灣50',
            // ... (rest of the dictionary is preserved, truncated for brevity in this response but kept in logic) ...
            '9958': '世紀鋼'
        };

        // --- 元件定義 ---
        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden ${className}`}>
            {children}
          </div>
        );

        const Button = ({ onClick, children, variant = 'primary', className = "", disabled = false, isLoading = false }) => {
          const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
          const variants = {
            primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-sm hover:shadow-md",
            secondary: "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50",
            danger: "bg-red-50 text-red-600 hover:bg-red-100 border border-red-100",
            ghost: "text-slate-500 hover:bg-slate-100",
            buy: "bg-red-500 text-white hover:bg-red-600 shadow-sm",
            sell: "bg-emerald-500 text-white hover:bg-emerald-600 shadow-sm",
            buyActive: "bg-red-600 text-white shadow-inner",
            sellActive: "bg-emerald-600 text-white shadow-inner",
          };
          return (
            <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`} disabled={disabled || isLoading}>
              {isLoading ? <Loader2 size={18} className="animate-spin" /> : children}
            </button>
          );
        };

        const Input = ({ label, value, onChange, onBlur, onKeyDown, type = "text", placeholder, className = "" }) => (
          <div className={`flex flex-col gap-1 ${className}`}>
            {label && <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{label}</label>}
            <input
              type={type}
              value={value}
              onChange={onChange}
              onBlur={onBlur}
              onKeyDown={onKeyDown}
              placeholder={placeholder}
              className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-slate-800"
            />
          </div>
        );

        // --- Pin Pad Component ---
        const PinKeypad = ({ onInput, onDelete, onClear, value }) => {
          const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];
          return (
            <div className="flex flex-col items-center gap-4">
               {/* Dots Display */}
               <div className="flex gap-4 mb-2">
                 {[...Array(4)].map((_, i) => (
                   <div key={i} className={`w-4 h-4 rounded-full border-2 border-slate-300 ${i < value.length ? 'bg-slate-800 border-slate-800' : 'bg-transparent'}`}></div>
                 ))}
               </div>
               
               {/* Keypad Grid */}
               <div className="grid grid-cols-3 gap-4 w-full max-w-[260px]">
                 {nums.map(n => (
                   <button key={n} onClick={() => onInput(n)} className="h-16 rounded-full bg-slate-100 hover:bg-slate-200 text-2xl font-bold text-slate-700 transition-colors keypad-btn shadow-sm">{n}</button>
                 ))}
                 <button onClick={onClear} className="h-16 rounded-full bg-slate-50 hover:bg-red-50 text-red-500 font-bold text-base transition-colors keypad-btn shadow-sm">清除</button>
                 <button onClick={() => onInput(0)} className="h-16 rounded-full bg-slate-100 hover:bg-slate-200 text-2xl font-bold text-slate-700 transition-colors keypad-btn shadow-sm">0</button>
                 <button onClick={onDelete} className="h-16 rounded-full bg-slate-50 hover:bg-slate-200 text-slate-600 transition-colors flex items-center justify-center keypad-btn shadow-sm"><Delete size={24}/></button>
               </div>
            </div>
          )
        }

        const Modal = ({ isOpen, onClose, title, children, className = "max-w-md" }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className={`bg-white rounded-2xl w-full ${className} shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]`}>
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 flex-shrink-0">
                  <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                  <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-200 text-slate-500 transition-colors"><X size={20} /></button>
                </div>
                <div className="p-6 overflow-y-auto flex-1">{children}</div>
              </div>
            </div>
          );
        };

        // --- 格式化工具 ---
        const formatCurrency = (value) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(value);
        const formatNumber = (value) => new Intl.NumberFormat('zh-TW').format(value);
        const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#6366F1'];
        const FRESH_COLORS = ['#06b6d4', '#22d3ee', '#4ade80', '#facc15', '#f87171', '#a78bfa', '#fbbf24'];

        // --- Helper for Date Formatting (ROC Year) ---
        const formatAxisDate = (dateStr) => {
             if (!dateStr) return '';
             const date = new Date(dateStr);
             const year = date.getFullYear() - 1911;
             const month = String(date.getMonth() + 1).padStart(2, '0');
             const day = String(date.getDate()).padStart(2, '0');
             return `${year}/${month}/${day}`;
        };

        // --- Helper for Millions Formatting ---
        const formatAxisValue = (value) => {
            if (value >= 1000000) return `${(value / 1000000).toFixed(1)}M`;
            if (value >= 1000) return `${(value / 1000).toFixed(1)}K`;
            return value;
        };

        // --- 成員詳細分析視窗元件 ---
        const MemberDetailModal = ({ isOpen, onClose, member, allHoldings, year }) => {
            const [timeRange, setTimeRange] = useState('1Y'); // 1M, 3M, 6M, 1Y
            
            // Hook 1: memberHoldings
            const memberHoldings = useMemo(() => {
                if (!member) return { items: [], totalValue: 0 }; 
                const memberData = allHoldings.filter(h => h.memberId === member.id);
                const grouped = {};
                memberData.forEach(h => {
                    const sym = h.symbol;
                    if (!grouped[sym]) grouped[sym] = { symbol: sym, name: h.name, shares: 0, currentPrice: h.currentPrice || 0, marketValue: 0 };
                    const qty = parseFloat(h.shares);
                    grouped[sym].shares += qty;
                });
                
                let totalVal = 0;
                const result = Object.values(grouped).map(g => {
                    const mv = g.shares * g.currentPrice;
                    g.marketValue = mv;
                    totalVal += mv;
                    return g;
                }).filter(g => g.shares > 0).sort((a, b) => b.marketValue - a.marketValue);
                
                return { items: result, totalValue: totalVal };
            }, [member, allHoldings]);

            // Hook 2: memberTrend (Daily Data)
            const memberTrend = useMemo(() => {
                if (!member) return [];
                
                // 1. Determine Date Range
                const today = new Date();
                const start = new Date();
                
                today.setHours(23, 59, 59, 999);
                
                switch(timeRange) {
                    case '1M': start.setMonth(today.getMonth() - 1); break;
                    case '3M': start.setMonth(today.getMonth() - 3); break;
                    case '6M': start.setMonth(today.getMonth() - 6); break;
                    case '1Y': start.setFullYear(today.getFullYear() - 1); break;
                    default: start.setFullYear(today.getFullYear() - 1);
                }
                start.setHours(0, 0, 0, 0);

                // 2. Prepare Data Maps
                const priceMap = {};
                allHoldings.forEach(h => { if(h.currentPrice) priceMap[h.symbol] = h.currentPrice; });

                const memberTxs = allHoldings
                    .filter(h => h.memberId === member.id)
                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                // 3. Initialize Holdings before Start Date
                let currentHoldings = {}; 
                let txIndex = 0;
                
                // Advance past transactions before start date
                while (txIndex < memberTxs.length) {
                    const tx = memberTxs[txIndex];
                    const txDate = new Date(tx.date);
                    if (txDate < start) {
                        const qty = parseFloat(tx.shares);
                        currentHoldings[tx.symbol] = (currentHoldings[tx.symbol] || 0) + qty;
                        txIndex++;
                    } else {
                        break;
                    }
                }

                // 4. Generate Daily Data Points
                const data = [];
                for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
                    const dateStr = d.toISOString().split('T')[0];
                    
                    // Apply transactions for this day
                    while (txIndex < memberTxs.length) {
                        const tx = memberTxs[txIndex];
                        if (tx.date === dateStr) {
                             const qty = parseFloat(tx.shares);
                             currentHoldings[tx.symbol] = (currentHoldings[tx.symbol] || 0) + qty;
                             txIndex++;
                        } else if (new Date(tx.date) < d) {
                             // Catch up if logic skipped
                             const qty = parseFloat(tx.shares);
                             currentHoldings[tx.symbol] = (currentHoldings[tx.symbol] || 0) + qty;
                             txIndex++;
                        } else {
                            break; 
                        }
                    }

                    // Calculate Total Asset Value for this day
                    let dailyValue = 0;
                    Object.entries(currentHoldings).forEach(([sym, shares]) => {
                        if (shares > 0) {
                            const price = priceMap[sym] || 0;
                            dailyValue += shares * price;
                        }
                    });

                    data.push({
                        date: dateStr,
                        value: Math.round(dailyValue)
                    });
                }
                
                return data;
            }, [member, allHoldings, timeRange]);

            // Hook 3: pieData 
            const pieData = useMemo(() => {
                if (!memberHoldings || !memberHoldings.items) return [];

                const total = memberHoldings.totalValue;
                if (total === 0) return [];
                
                const data = memberHoldings.items.slice(0, 5).map(i => ({
                    name: i.name,
                    symbol: i.symbol,
                    value: i.marketValue,
                    percent: (i.marketValue / total) * 100
                }));
                
                const othersValue = memberHoldings.items.slice(5).reduce((sum, i) => sum + i.marketValue, 0);
                if (othersValue > 0) {
                    data.push({ name: '其他', symbol: 'Others', value: othersValue, percent: (othersValue / total) * 100 });
                }
                return data;
            }, [memberHoldings]);

            if (!isOpen || !member) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`${member.name} 的資產概況`} className="max-w-3xl">
                    <div className="space-y-8">
                        {/* 1. Trend Chart Section */}
                        <div>
                             <div className="flex justify-between items-center mb-4">
                                <h4 className="font-bold text-slate-800 flex items-center gap-2"><Activity size={18} className="text-cyan-500"/> 證券資產趨勢圖</h4>
                                <div className="flex gap-1 p-1 bg-slate-100 rounded-full">
                                    {['1M', '3M', '6M', '1Y'].map(range => (
                                        <button 
                                            key={range}
                                            onClick={() => setTimeRange(range)}
                                            className={`px-3 py-1 text-xs font-bold rounded-full transition-all duration-300 ${
                                                timeRange === range 
                                                ? 'bg-cyan-500 text-white shadow-md transform scale-105' 
                                                : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'
                                            }`}
                                        >
                                            {range === '1Y' ? '1年' : range.replace('M', '月')}
                                        </button>
                                    ))}
                                </div>
                             </div>
                             <div className="h-64 w-full bg-white rounded-xl border border-slate-50 relative p-2">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={memberTrend} margin={{ top: 20, right: 10, left: -10, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorCyan" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#06b6d4" stopOpacity={0.2}/>
                                                <stop offset="95%" stopColor="#06b6d4" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                                        <XAxis 
                                            dataKey="date" 
                                            axisLine={false} 
                                            tickLine={false} 
                                            tick={{fill: '#94A3B8', fontSize: 11}} 
                                            tickFormatter={formatAxisDate}
                                            minTickGap={30}
                                        />
                                        <YAxis 
                                            axisLine={false} 
                                            tickLine={false} 
                                            tick={{fill: '#94A3B8', fontSize: 11}} 
                                            tickFormatter={formatAxisValue} 
                                            domain={['auto', 'auto']}
                                            width={45}
                                        />
                                        <RechartsTooltip 
                                            contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }}
                                            formatter={(value) => [formatCurrency(value), '總資產']}
                                            labelFormatter={formatAxisDate}
                                        />
                                        <Area 
                                            type="monotone" 
                                            dataKey="value" 
                                            stroke="#06b6d4" 
                                            strokeWidth={3}
                                            fillOpacity={1} 
                                            fill="url(#colorCyan)" 
                                            activeDot={{ r: 6, strokeWidth: 0, fill: '#0891b2', stroke: '#fff', strokeWidth: 2 }}
                                        />
                                        <Brush 
                                            dataKey="date" 
                                            height={30} 
                                            stroke="#cbd5e1" 
                                            tickFormatter={formatAxisDate}
                                            fill="#f8fafc"
                                        />
                                    </AreaChart>
                                </ResponsiveContainer>
                             </div>
                        </div>
                        <div className="border-t border-slate-100"></div>
                        {/* 2. Donut Chart Section */}
                        <div>
                            <h4 className="font-bold text-slate-800 flex items-center gap-2 mb-4"><PieChartIcon size={18} className="text-cyan-500"/> 證券持股圓餅圖</h4>
                            <div className="flex flex-col md:flex-row items-center gap-8">
                                <div className="relative w-48 h-48 flex-shrink-0">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie 
                                                data={pieData} 
                                                innerRadius={60} 
                                                outerRadius={80} 
                                                paddingAngle={3} 
                                                dataKey="value"
                                                startAngle={90}
                                                endAngle={-270}
                                                cornerRadius={4}
                                            >
                                                {pieData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={FRESH_COLORS[index % FRESH_COLORS.length]} stroke="none"/>
                                                ))}
                                            </Pie>
                                        </PieChart>
                                    </ResponsiveContainer>
                                    <div className="donut-center-text flex flex-col items-center">
                                        <div className="text-xs text-slate-400 font-medium">TWD</div>
                                        <div className="text-lg font-bold text-slate-800">{formatNumber(memberHoldings.totalValue)}</div>
                                    </div>
                                </div>
                                <div className="flex-1 w-full space-y-3">
                                    {pieData.map((item, index) => (
                                        <div key={index} className="flex items-center justify-between text-sm group hover:bg-slate-50 p-2 rounded-lg transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="w-3 h-3 rounded-full shadow-sm" style={{ background: FRESH_COLORS[index % FRESH_COLORS.length] }}></div>
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-slate-700 leading-none">{item.symbol}</span>
                                                    <span className="text-xs text-slate-400 mt-1">{item.name}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-bold text-slate-700">{Math.round(item.percent)}%</div>
                                                <div className="text-xs text-slate-400">{formatCurrency(item.value)}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        };

        // --- 主程式 ---
        function App() {
          const [user, setUser] = useState(null);
          const [activeTab, setActiveTab] = useState('overview');
          const [members, setMembers] = useState([]);
          const [allHoldings, setAllHoldings] = useState([]); 
          const [loading, setLoading] = useState(true);

          // Selection State for Modal
          const [selectedMember, setSelectedMember] = useState(null);
          const [deleteConfirm, setDeleteConfirm] = useState(null); 

          // Security States
          const [isAuthenticated, setIsAuthenticated] = useState(false); // Controls edit access
          const [hasPin, setHasPin] = useState(false);
          const [showUnlockModal, setShowUnlockModal] = useState(false); // Controls PIN modal visibility
          const [pinInput, setPinInput] = useState("");
          const [storedPin, setStoredPin] = useState(null);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [newPin, setNewPin] = useState("");
          
          // Pending action to execute after unlock
          const pendingActionRef = useRef(null);

          // Year & Month Management
          const currentYear = new Date().getFullYear().toString();
          const [activeYear, setActiveYear] = useState(currentYear);
          const [activeMonth, setActiveMonth] = useState('all');
          const [availableYears, setAvailableYears] = useState([currentYear]);
          const [mainTimeRange, setMainTimeRange] = useState('1Y'); // <-- 新增主畫面趨勢圖的時間區間狀態

          // View Mode & Filtering
          const [holdingViewMode, setHoldingViewMode] = useState('summary');
          const [listFilter, setListFilter] = useState({ memberId: null, symbol: null });

          // Update Logic States
          const [updatingPrices, setUpdatingPrices] = useState(false);
          const [priceUpdateMsg, setPriceUpdateMsg] = useState("");
          const [lastUpdateTime, setLastUpdateTime] = useState(null);
          const [processingSettings, setProcessingSettings] = useState(false);

          // Modal States
          const [isAddMemberOpen, setIsAddMemberOpen] = useState(false);
          const [isAddHoldingOpen, setIsAddHoldingOpen] = useState(false);
          const [editingHolding, setEditingHolding] = useState(null);

          // Form States
          const [loadingStockInfo, setLoadingStockInfo] = useState(false);
          const [newMemberName, setNewMemberName] = useState("");
          const [holdingForm, setHoldingForm] = useState({
            memberId: "",
            symbol: "",
            name: "",
            shares: "",
            price: "",
            fee: "1",
            date: new Date().toISOString().split('T')[0],
            type: 'buy',
            note: "",
            year: currentYear
          });

          // Import State
          const fileInputRef = useRef(null);

          // --- Auth & Data Fetching ---
          useEffect(() => {
            const initAuth = async () => {
              try {
                // 這裡我們只使用匿名登入
                await signInAnonymously(auth);
              } catch (error) {
                console.error("Auth error:", error);
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => setUser(currentUser));
            return () => unsubscribe();
          }, []);

          // --- Security Check & Data Fetching ---
          useEffect(() => {
            if (!user) return;
            // 1. Check for PIN
            const checkSecurity = async () => {
              try {
                const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security');
                const snap = await getDoc(settingsRef);
                if (snap.exists() && snap.data().pin) {
                  setHasPin(true);
                  setStoredPin(snap.data().pin);
                  setIsAuthenticated(false); // Locked by default if PIN exists
                } else {
                  setHasPin(false);
                  setIsAuthenticated(true); // Unlocked if no PIN
                }
              } catch (e) {
                console.error("Security check failed", e);
                // Default to open if check fails to avoid lockout, or locked? Let's assume open for basic safety or keep default false
                setIsAuthenticated(false); 
              }
            };
            checkSecurity();

            // 2. Fetch Data
            const membersRef = collection(db, 'artifacts', appId, 'users', user.uid, 'members');
            const unsubMembers = onSnapshot(membersRef, (snapshot) => {
              setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });

            const holdingsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'holdings');
            const unsubHoldings = onSnapshot(holdingsRef, (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAllHoldings(data);
              setLoading(false);
               
              const years = new Set(data.map(h => h.year || currentYear));
              years.add(currentYear);
              const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));
              setAvailableYears(sortedYears);

              // Find last update time
              if (data.length > 0) {
                const maxTime = Math.max(...data.map(h => h.lastUpdateTimestamp || 0));
                if (maxTime > 0) setLastUpdateTime(new Date(maxTime * 1000));
              }
            });
            return () => { unsubMembers(); unsubHoldings(); };
          }, [user]);

          // --- Auth Logic ---
          const handleAuthRequired = (action) => {
             if (!hasPin || isAuthenticated) {
                 action();
             } else {
                 pendingActionRef.current = action;
                 setShowUnlockModal(true);
             }
          };

          const handleUnlock = () => {
            if (pinInput === storedPin) {
                setIsAuthenticated(true);
                setShowUnlockModal(false);
                setPinInput("");
                // Execute pending action if any
                if (pendingActionRef.current) {
                    pendingActionRef.current();
                    pendingActionRef.current = null;
                }
            } else {
                alert("密碼錯誤，請重試");
                setPinInput(""); // Clear on error
            }
          };
          
          const handlePadInput = (num) => {
             if (pinInput.length < 4) {
                 setPinInput(prev => prev + num);
             }
          };

          const handlePadDelete = () => {
             setPinInput(prev => prev.slice(0, -1));
          };
          
          const handlePadClear = () => {
             setPinInput("");
          };

          // Auto-submit pin
          useEffect(() => {
             if (showUnlockModal && pinInput.length === 4) {
                 // Small delay for UX
                 setTimeout(() => handleUnlock(), 100);
             }
          }, [pinInput, showUnlockModal]);

          const handleToggleLock = () => {
              if (isAuthenticated && hasPin) {
                  // Lock
                  setIsAuthenticated(false);
                  alert("已鎖定編輯權限");
              } else if (!isAuthenticated && hasPin) {
                  // Open unlock modal
                  setShowUnlockModal(true);
              }
          };

          // --- Filtered Data ---
          const holdings = useMemo(() => {
            let filtered = allHoldings.filter(h => {
              const yearMatch = (h.year || currentYear) === activeYear;
              if (!yearMatch) return false;

              if (listFilter.memberId && h.memberId !== listFilter.memberId) return false;
              if (listFilter.symbol && h.symbol !== listFilter.symbol) return false;

              if (activeMonth === 'all') return true;
              const hMonth = parseInt(h.date?.split('-')[1] || 0, 10);
              return hMonth === activeMonth;
            });
            
            return filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          }, [allHoldings, activeYear, activeMonth, currentYear, listFilter]);

          // --- Aggregated Data ---
          const aggregatedHoldings = useMemo(() => {
            const groups = {};
            const sortedForCalc = [...holdings].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedForCalc.forEach(tx => {
              const key = `${tx.symbol}-${tx.memberId}`; 
              if (!groups[key]) {
                const member = members.find(m => m.id === tx.memberId);
                groups[key] = {
                  symbol: tx.symbol,
                  name: tx.name,
                  memberId: tx.memberId,
                  memberName: member ? member.name : 'Unknown',
                  shares: 0,
                  totalCost: 0,
                  realizedProfit: 0,
                  currentPrice: 0,
                  dailyChangePercent: 0,
                  txCount: 0
                };
              }
              const group = groups[key];
              if (tx.currentPrice) group.currentPrice = tx.currentPrice;
              if (tx.dailyChangePercent) group.dailyChangePercent = tx.dailyChangePercent;

              const qty = tx.shares;
              const unitCost = tx.cost;
              if (qty > 0) {
                group.shares += qty;
                group.totalCost += (qty * unitCost);
              } else {
                const avgCost = group.shares > 0 ? group.totalCost / group.shares : 0;
                const sellQty = Math.abs(qty);
                const revenue = sellQty * unitCost;
                const costBasis = sellQty * avgCost;
                
                group.realizedProfit += (revenue - costBasis);
                group.shares -= sellQty;
                group.totalCost -= costBasis;
              }
              group.txCount++;
            });
            return Object.values(groups).map(g => {
              const avgCost = g.shares > 0 ? g.totalCost / g.shares : 0;
              const marketValue = g.shares * g.currentPrice;
              const unrealizedProfit = marketValue - g.totalCost;
              const unrealizedProfitPercent = g.totalCost > 0 ? (unrealizedProfit / g.totalCost) * 100 : 0;
               
              return {
                ...g,
                avgCost,
                marketValue,
                unrealizedProfit,
                unrealizedProfitPercent,
                totalProfit: g.realizedProfit + unrealizedProfit
              };
            }).filter(g => g.shares > 0 || g.realizedProfit !== 0);
          }, [holdings, members]);

          // --- Calculate Total Daily Profit (New!) ---
          const totalDailyProfit = useMemo(() => {
            return aggregatedHoldings.reduce((sum, h) => {
                const change = h.dailyChangePercent || 0;
                const marketVal = h.marketValue || 0;
                if (marketVal === 0 || change === 0) return sum;
                // 公式：今日損益 = 市值 - (市值 / (1 + 漲跌幅%))
                const prevVal = marketVal / (1 + change / 100);
                return sum + (marketVal - prevVal);
            }, 0);
          }, [aggregatedHoldings]);
          
          // --- Total Asset Value & Profits ---
          const totalAssetValue = useMemo(() => {
              return aggregatedHoldings.reduce((sum, h) => sum + h.marketValue, 0);
          }, [aggregatedHoldings]);

          const totalCost = useMemo(() => {
              return aggregatedHoldings.reduce((sum, h) => sum + h.totalCost, 0);
          }, [aggregatedHoldings]);

          const totalUnrealizedProfit = useMemo(() => {
              return aggregatedHoldings.reduce((sum, h) => sum + h.unrealizedProfit, 0);
          }, [aggregatedHoldings]);

          const totalProfitPercentage = totalCost > 0 ? (totalUnrealizedProfit / totalCost) * 100 : 0;

          // --- Trend Data Calculation ---
          const trendData = useMemo(() => {
            if (members.length === 0) return [];

            const year = parseInt(activeYear);
            const today = new Date();
            // If active year is current year, end at today, else end of year
            const endDate = (year === today.getFullYear()) ? today : new Date(year, 11, 31);
            endDate.setHours(23,59,59,999);

            // Calculate start date based on selected time range
            const startDate = new Date(endDate);
            switch(mainTimeRange) {
                case '1M': startDate.setMonth(endDate.getMonth() - 1); break;
                case '3M': startDate.setMonth(endDate.getMonth() - 3); break;
                case '6M': startDate.setMonth(endDate.getMonth() - 6); break;
                case '1Y': startDate.setFullYear(year, 0, 1); break; // 1Y means from Jan 1st of the active year
                default: startDate.setFullYear(year, 0, 1);
            }
            startDate.setHours(0,0,0,0);

            // Price Map
            const priceMap = {};
            allHoldings.forEach(h => { if(h.currentPrice) priceMap[h.symbol] = h.currentPrice; });

            // Sort all transactions
            const sortedTxs = [...allHoldings].sort((a, b) => new Date(a.date) - new Date(b.date));

            // Initialize running portfolio for each member
            // Structure: { memberId: { symbol: quantity } }
            const portfolios = {};
            members.forEach(m => portfolios[m.id] = {});

            // 1. Process transactions BEFORE start date to get initial state
            let txIndex = 0;
            while(txIndex < sortedTxs.length) {
                const tx = sortedTxs[txIndex];
                const txDate = new Date(tx.date);
                if (txDate < startDate) {
                    const mId = tx.memberId;
                    const sym = tx.symbol;
                    const qty = parseFloat(tx.shares);
                    if (portfolios[mId]) {
                        portfolios[mId][sym] = (portfolios[mId][sym] || 0) + qty;
                    }
                    txIndex++;
                } else {
                    break;
                }
            }

            // 2. Iterate through each day of the active date range
            const data = [];
            // Loop day by day
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const dateStr = d.toISOString().split('T')[0]; // YYYY-MM-DD

                // Apply transactions for this day
                while(txIndex < sortedTxs.length) {
                    const tx = sortedTxs[txIndex];
                    if (tx.date === dateStr) {
                         const mId = tx.memberId;
                         const sym = tx.symbol;
                         const qty = parseFloat(tx.shares);
                         if (portfolios[mId]) {
                            portfolios[mId][sym] = (portfolios[mId][sym] || 0) + qty;
                         }
                         txIndex++;
                    } else if (new Date(tx.date) < d) {
                         // Catch up if logic skipped (should rarely happen with sorted list)
                         const mId = tx.memberId;
                         const sym = tx.symbol;
                         const qty = parseFloat(tx.shares);
                         if (portfolios[mId]) {
                            portfolios[mId][sym] = (portfolios[mId][sym] || 0) + qty;
                         }
                         txIndex++;
                    } else {
                        break;
                    }
                }

                // Calculate value for this day
                const dataPoint = { date: dateStr };
                let totalVal = 0;

                members.forEach(m => {
                    let memberVal = 0;
                    const mPortfolio = portfolios[m.id];
                    if (mPortfolio) {
                        Object.entries(mPortfolio).forEach(([sym, qty]) => {
                            if (qty > 0) {
                                // Use current price for valuation (simplified trend)
                                const price = priceMap[sym] || 0; 
                                memberVal += qty * price;
                            }
                        });
                    }
                    dataPoint[m.id] = Math.round(memberVal);
                    totalVal += memberVal;
                });
                
                // Add data point if we have valid data or if it's within the valid range
                data.push(dataPoint);
            }
            
            return data;
          }, [allHoldings, activeYear, members, mainTimeRange]);

          // --- Chart Data Preparation (RESTORED) ---
          const allocationData = useMemo(() => {
             return members.map((member, index) => {
                 const memberValue = aggregatedHoldings
                    .filter(h => h.memberId === member.id)
                    .reduce((sum, h) => sum + h.marketValue, 0);
                 
                 return {
                     name: member.name,
                     value: memberValue,
                     color: COLORS[index % COLORS.length] // Bind color to member index
                 };
             }).filter(item => item.value > 0);
          }, [aggregatedHoldings, members]);

          // --- Helpers & APIs ---
          const fetchWithDualProxy = async (targetUrl) => {
            const encodedUrl = encodeURIComponent(targetUrl);
            const timestamp = Date.now();
            try {
              const response1 = await fetch(`https://api.allorigins.win/get?url=${encodedUrl}&t=${timestamp}`);
              if (response1.ok) {
                const data = await response1.json();
                if (data.contents) return JSON.parse(data.contents);
              }
            } catch (e) {}
            try {
               const response2 = await fetch(`https://corsproxy.io/?${encodedUrl}`);
               if (response2.ok) return await response2.json();
            } catch (e) { return null; }
            return null;
          };

          const fetchStockData = async (code, type) => {
            if (!code) return null;
            // Force uppercase for consistent API querying
            const uCode = code.trim().toUpperCase(); 
            
            // 1. Try TWSE MIS First (Priority: Chinese Names & Official Data)
            // Queries both TSE (Listed) and OTC (Over-the-counter)
            const query = `tse_${uCode}.tw|otc_${uCode}.tw`;
            const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${query}&json=1&delay=0`;
            
            try {
                const data = await fetchWithDualProxy(twseUrl);
                const result = data?.msgArray?.find(item => item.c === uCode);
                
                if (result) {
                  let price = parseFloat(result.z);
                  if (isNaN(price)) price = parseFloat(result.b?.split('_')[0]);
                  if (isNaN(price)) price = parseFloat(result.a?.split('_')[0]);
                  if (isNaN(price)) price = parseFloat(result.y); // Yesterday's closing if no trade
                  
                  const yesterday = parseFloat(result.y);
                  const change = price - yesterday;
                  const changePercent = (change / yesterday) * 100;
                  
                  return {
                    price: price,
                    change: change,
                    changePercent: changePercent,
                    name: result.n, // Returns the Chinese name (e.g., 元大台灣50正2)
                    source: 'TWSE'
                  };
                }
            } catch (e) {
                console.warn("TWSE fetch failed, failing over to Yahoo...", e);
            }

            // 2. Fallback to Yahoo Finance (Reliable Price, but Name might be English/Code)
            const yahooSymbol = `${uCode}.TW`; 
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${yahooSymbol}?interval=1d`;
            try {
               const data = await fetchWithDualProxy(yahooUrl);
               if (data && data.chart && data.chart.result) {
                  const meta = data.chart.result[0].meta;
                  return {
                    price: meta.regularMarketPrice,
                    change: meta.regularMarketPrice - meta.chartPreviousClose,
                    changePercent: ((meta.regularMarketPrice - meta.chartPreviousClose) / meta.chartPreviousClose) * 100,
                    name: uCode, // Fallback to code if name unavailable
                    source: 'Yahoo'
                  };
               }
            } catch (e) {}

            return null; 
          };

          const performSymbolSearch = async () => {
             let sym = holdingForm.symbol;
             if (!sym || sym.trim() === '') return;
             
             // Auto-convert to uppercase for UX consistency
             const uCode = sym.trim().toUpperCase();
             // Check LOCAL DICTIONARY first
             const localName = STOCK_DICTIONARY[uCode];
             
             // 1. Instant local update if available
             if (localName) {
                 setHoldingForm(prev => ({ ...prev, symbol: uCode, name: localName }));
             } else {
                 setHoldingForm(prev => ({ ...prev, symbol: uCode }));
             }

             setLoadingStockInfo(true);
             try {
                const quote = await fetchStockData(uCode, "");
                if (quote) {
                    setHoldingForm(prev => ({
                        ...prev,
                        symbol: uCode,
                        name: localName || quote.name || prev.name,
                    }));
                }
             } catch (e) {
                console.error("Auto-fill error", e);
             } finally {
                setLoadingStockInfo(false);
             }
          };

          const handleSymbolBlur = () => {
              performSymbolSearch();
          };

          const handleSymbolKeyDown = (e) => {
              if (e.key === 'Enter') {
                  e.preventDefault(); // Prevent accidental form submit if wrapped
                  performSymbolSearch();
              }
          };

          const handleUpdatePrices = async () => {
            if (!user || allHoldings.length === 0) return;
            // Auth check for update price (optional, but safe to keep)
            if (hasPin && !isAuthenticated) {
               pendingActionRef.current = handleUpdatePrices;
               setShowUnlockModal(true);
               return;
            }

            setUpdatingPrices(true);
            setPriceUpdateMsg("正在篩選持股並連線...");
            
            try {
                // 1. 智慧篩選：只抓取「庫存 > 0」的股票
                const inventory = {};
                allHoldings.forEach(h => {
                    const s = parseFloat(h.shares);
                    inventory[h.symbol] = (inventory[h.symbol] || 0) + s;
                });
                
                // 過濾出目前持有的股票代號 (庫存 > 0.001 避免浮點數誤差)
                const activeSymbols = Object.keys(inventory).filter(sym => inventory[sym] > 0.001);
                
                if (activeSymbols.length === 0) {
                    setPriceUpdateMsg("目前無持有中的股票需更新");
                    setUpdatingPrices(false);
                    setTimeout(() => setPriceUpdateMsg(""), 3000);
                    return;
                }

                setPriceUpdateMsg(`正在更新 ${activeSymbols.length} 檔持股價格...`);

                const batch = writeBatch(db);
                const now = Math.floor(Date.now() / 1000);
                let successCount = 0;
                
                // 2. 批次查詢策略 (Batching)
                // 台灣證交所 API 支援一次查詢多檔，我們設定每批 20 檔，大幅減少請求次數
                const CHUNK_SIZE = 20; 
                const chunks = [];
                for (let i = 0; i < activeSymbols.length; i += CHUNK_SIZE) {
                    chunks.push(activeSymbols.slice(i, i + CHUNK_SIZE));
                }

                // 內部函數：處理單一股票更新到 Firestore Batch
                const stageStockUpdate = (symbol, price, changePercent) => {
                    const targetDocs = allHoldings.filter(h => h.symbol === symbol);
                    targetDocs.forEach(docData => {
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', docData.id);
                        batch.update(docRef, {
                            currentPrice: price,
                            dailyChangePercent: changePercent,
                            lastUpdateTimestamp: now
                        });
                    });
                    successCount++;
                };

                // 開始執行批次查詢
                for (const chunk of chunks) {
                    // 建構批次查詢字串: tse_1101.tw|otc_1101.tw|...
                    // 同時查詢上市(tse)與上櫃(otc)以確保命中
                    const query = chunk.map(s => `tse_${s}.tw|otc_${s}.tw`).join('|');
                    const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${query}&json=1&delay=0`;
                    
                    let chunkSuccess = false;
                    try {
                        const data = await fetchWithDualProxy(twseUrl);
                        if (data && data.msgArray) {
                             chunkSuccess = true;
                             
                             // 處理這一批回傳的資料
                             // 建立一個 Set 來記錄這一批成功更新的股票
                             const updatedInChunk = new Set();

                             data.msgArray.forEach(result => {
                                 const symbol = result.c; // 股票代號
                                 if (chunk.includes(symbol)) {
                                     // 解析價格 (與單一查詢邏輯相同)
                                     let price = parseFloat(result.z);
                                     if (isNaN(price)) price = parseFloat(result.b?.split('_')[0]);
                                     if (isNaN(price)) price = parseFloat(result.a?.split('_')[0]);
                                     if (isNaN(price)) price = parseFloat(result.y);
                                     
                                     const yesterday = parseFloat(result.y);
                                     const changePercent = yesterday ? ((price - yesterday) / yesterday) * 100 : 0;
                                     
                                     if (!isNaN(price)) {
                                        stageStockUpdate(symbol, price, changePercent);
                                        updatedInChunk.add(symbol);
                                     }
                                 }
                             });

                             // 3. 針對批次查詢中「失敗/未回傳」的股票，改用單一查詢 (例如 Yahoo) 補救
                             const missingSymbols = chunk.filter(s => !updatedInChunk.has(s));
                             if (missingSymbols.length > 0) {
                                 console.log("Fallback fetching for:", missingSymbols);
                                 // 平行處理補救查詢
                                 await Promise.all(missingSymbols.map(async (symbol) => {
                                     const stockData = await fetchStockData(symbol); // 使用原本包含 Yahoo 的查詢函式
                                     if (stockData) {
                                         stageStockUpdate(symbol, stockData.price, stockData.changePercent);
                                     }
                                 }));
                             }
                        }
                    } catch (e) {
                        console.warn("Batch fetch failed, switching to sequential fallback", e);
                        chunkSuccess = false;
                    }

                    // 如果整批失敗 (例如 API 格式改變)，則對該批次所有股票進行逐一查詢
                    if (!chunkSuccess) {
                         for (const symbol of chunk) {
                             const data = await fetchStockData(symbol);
                             if (data) stageStockUpdate(symbol, data.price, data.changePercent);
                             await new Promise(r => setTimeout(r, 100)); // 輕微延遲避免被鎖
                         }
                    } else {
                        // 批次成功後，稍微休息一下再發下一批，避免對 Proxy 造成壓力
                        await new Promise(r => setTimeout(r, 300));
                    }
                }

                if (successCount > 0) {
                    await batch.commit();
                    setPriceUpdateMsg(`更新完成：成功更新 ${successCount} 檔現有持股`);
                    setLastUpdateTime(new Date());
                } else {
                    setPriceUpdateMsg("更新失敗或無資料變動");
                }

            } catch (e) {
                console.error("Update error", e);
                setPriceUpdateMsg("更新過程發生錯誤");
            } finally {
                setUpdatingPrices(false);
                setTimeout(() => setPriceUpdateMsg(""), 5000);
            }
          };

          const handleAddMember = async () => {
            if (!newMemberName.trim() || !user) return;
            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'members'), {
              name: newMemberName,
              createdAt: new Date().toISOString()
            });
            setNewMemberName("");
            setIsAddMemberOpen(false);
          };

          const handleSaveHolding = async () => {
             if (!user) return;
             
             // Extract ID to prevent saving it into the document data
             const { shares, price, fee, type, id, ...restForm } = holdingForm; 
             
             // 1. Validation
             if (!shares || !price || isNaN(parseFloat(shares)) || isNaN(parseFloat(price))) {
                 alert("請輸入有效的股數與價格");
                 return;
             }

             const numShares = parseFloat(shares);
             const numPrice = parseFloat(price);
             const numFee = parseFloat(fee) || 0;
             
             const cost = type === 'buy' ? (numPrice) + (numFee / numShares) : (numPrice) - (numFee / numShares); 
             const signedShares = type === 'buy' ? numShares : -numShares;

             // 2. Construct Payload (Ensure no undefined)
             const payload = {
                ...restForm, 
                shares: signedShares,
                fee: numFee.toString(),
                cost: cost, 
                price: numPrice, 
                lastUpdateTimestamp: Math.floor(Date.now() / 1000)
             };
             
             // Remove any undefined keys to prevent Firestore errors
             Object.keys(payload).forEach(key => payload[key] === undefined && delete payload[key]);

             try {
                 if (editingHolding) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', editingHolding.id), payload);
                 } else {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'), payload);
                 }
                 setIsAddHoldingOpen(false);
                 setEditingHolding(null);
                 resetForm();
             } catch (e) {
                 console.error("Save failed", e);
                 alert("儲存失敗: " + e.message);
             }
          };

          const handleDeleteHolding = (id, e) => {
             e.stopPropagation(); 
             setDeleteConfirm({ id });
          };

          const executeDelete = async () => {
             if (!user || !deleteConfirm) return;
             try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', deleteConfirm.id));
                setDeleteConfirm(null);
             } catch (error) {
                console.error("Delete failed:", error);
                alert("刪除失敗: " + error.message);
             }
          };

          const resetForm = () => {
             setHoldingForm({
                memberId: members.length > 0 ? members[0].id : "",
                symbol: "",
                name: "",
                shares: "",
                price: "",
                fee: "1",
                date: new Date().toISOString().split('T')[0],
                type: 'buy',
                note: "",
                year: activeYear
             });
          };

          const calculateEstimate = () => {
              const p = parseFloat(holdingForm.price) || 0;
              const s = parseFloat(holdingForm.shares) || 0;
              const f = parseFloat(holdingForm.fee) || 0;
              let estimate = 0;
              if (holdingForm.type === 'buy') { 
                  estimate = p * s + f; 
              } else { 
                  estimate = p * s - f; 
              }
              return Math.ceil(estimate); // 無條件進位到個位數
          };
          
          const handleDrillDown = (memberId, symbol) => {
             setListFilter({ memberId, symbol });
             setHoldingViewMode('detail');
             setActiveMonth('all'); 
          };
          
          const handleSetPin = async () => {
            if (newPin.length < 4) { alert("PIN 碼至少需 4 位數"); return; }
            try {
              await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security'), { pin: newPin }, { merge: true });
              setStoredPin(newPin);
              setHasPin(true);
              setNewPin("");
              // Setting a new PIN automatically authenticates
              setIsAuthenticated(true); 
              alert("安全密碼設定成功！");
            } catch (e) { console.error(e); }
          };

          // --- Settings Data Management Handlers ---
          const handleExportData = async () => {
            if(!user) return;
            try {
                setProcessingSettings(true);
                const membersSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'members'));
                const holdingsSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                
                const data = {
                  version: 1,
                  exportedAt: new Date().toISOString(),
                  members: membersSnap.docs.map(d => ({id: d.id, ...d.data()})),
                  holdings: holdingsSnap.docs.map(d => ({id: d.id, ...d.data()}))
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `family-asset-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch(e) {
                console.error(e);
                alert("匯出失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          const handleImportData = async (e) => {
            const file = e.target.files[0];
            if(!file || !user) return;
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    setProcessingSettings(true);
                    const data = JSON.parse(event.target.result);
                    if(!data.members || !data.holdings) throw new Error("無效的備份檔案格式");
                    
                    const batch = writeBatch(db);
                    let count = 0;
                    
                    for(const m of data.members) {
                        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'members', m.id);
                        const {id, ...rest} = m;
                        batch.set(ref, rest);
                        count++;
                    }
                    
                    for(const h of data.holdings) {
                        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', h.id);
                        const {id, ...rest} = h;
                        batch.set(ref, rest);
                        count++;
                    }
                    
                    await batch.commit();
                    alert(`成功匯入 ${data.members.length} 位成員與 ${data.holdings.length} 筆交易紀錄！`);
                    window.location.reload();
                } catch(e) {
                    alert("匯入失敗：" + e.message);
                } finally {
                    setProcessingSettings(false);
                    if(fileInputRef.current) fileInputRef.current.value = "";
                }
            };
            reader.readAsText(file);
          };

          const handleRemoveDuplicates = async () => {
            if(!user || !confirm("確定要移除重複的交易紀錄嗎？\n系統將保留每筆重複資料中的一筆，並刪除其餘重複項。\n建議先執行「匯出備份」。")) return;
            
            try {
                setProcessingSettings(true);
                const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                const seen = new Set();
                const duplicates = [];
                
                docs.forEach(doc => {
                    const key = `${doc.memberId}|${doc.symbol}|${doc.date}|${doc.type}|${parseFloat(doc.shares)}|${parseFloat(doc.price)}`;
                    if(seen.has(key)) {
                        duplicates.push(doc.id);
                    } else {
                        seen.add(key);
                    }
                });
                
                if(duplicates.length === 0) {
                    alert("未發現重複的交易紀錄。");
                    return;
                }
                
                const batch = writeBatch(db);
                duplicates.forEach(id => {
                    batch.delete(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', id));
                });
                
                await batch.commit();
                alert(`已成功移除 ${duplicates.length} 筆重複資料。`);
            } catch(e) {
                console.error(e);
                alert("處理失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          const handleClearData = async () => {
            if (!user) return;
            if (!confirm("⚠️ 危險操作警告！\n\n此操作將「永久刪除」所有成員與交易紀錄，且無法復原！\n\n強烈建議您先執行「匯出備份」。\n\n確定要繼續清空所有資料嗎？")) return;
            if (!confirm("再次確認：您真的要清空系統中的所有資料嗎？")) return;

            try {
                setProcessingSettings(true);
                const batch = writeBatch(db);
                
                const holdingsSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                holdingsSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });

                const membersSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'members'));
                membersSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                alert("系統已重置，所有資料已清空。");
                window.location.reload();
            } catch (e) {
                console.error(e);
                alert("清空失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          const renderMonthFilter = () => (
            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
               <button onClick={() => setActiveMonth('all')} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${activeMonth === 'all' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>全年</button>
               {Array.from({length: 12}, (_, i) => i + 1).map(m => (
                 <button key={m} onClick={() => setActiveMonth(m)} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${activeMonth === m ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>{m}月</button>
               ))}
            </div>
          );

          return (
            <div className="min-h-screen pb-6">
              {/* Header */}
              <header className="bg-white sticky top-0 z-10 border-b border-slate-200 px-4 py-3 shadow-sm">
                <div className="flex justify-between items-center gap-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className="bg-blue-600 text-white p-1.5 rounded-lg flex-shrink-0"><TrendingUp size={20}/></div>
                        <h1 className="font-bold text-slate-800 text-lg hidden lg:block whitespace-nowrap">家庭資產管家</h1>
                        
                        {/* Selectors Group - Integrated Year/Month */}
                        <div className="flex items-center gap-1 overflow-x-auto scrollbar-hide">
                            <select 
                              value={`${activeYear}-${activeMonth}`}
                              onChange={(e) => {
                                  const [y, m] = e.target.value.split('-');
                                  setActiveYear(y);
                                  setActiveMonth(m === 'all' ? 'all' : parseInt(m));
                              }}
                              className="bg-slate-100 text-slate-700 text-sm font-bold py-1.5 px-3 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer hover:bg-slate-200 transition-colors"
                            >
                                {availableYears.map(year => (
                                    <optgroup key={year} label={`${year}年`}>
                                        <option value={`${year}-all`}>{year}年 (全年)</option>
                                        {Array.from({length: 12}, (_, i) => i + 1).map(m => (
                                            <option key={`${year}-${m}`} value={`${year}-${m}`}>{m}月</option>
                                        ))}
                                    </optgroup>
                                ))}
                            </select>
                        </div>
                    </div>

                    <div className="flex items-center gap-1 sm:gap-2 flex-shrink-0">
                        <button 
                            onClick={() => handleAuthRequired(handleUpdatePrices)} 
                            disabled={updatingPrices}
                            className={`p-2 rounded-full transition-colors ${updatingPrices ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-slate-100'}`}
                            title="更新股價"
                        >
                            <RefreshCw size={20} className={updatingPrices ? "animate-spin" : ""}/>
                        </button>

                        <button onClick={() => handleAuthRequired(() => setIsAddMemberOpen(true))} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full" aria-label="新增成員"><UserPlus size={20}/></button>
                        <button onClick={() => handleAuthRequired(() => setIsSettingsOpen(true))} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full"><Settings size={20}/></button>
                        
                        {/* Lock Button */}
                        {hasPin && (
                            <button 
                                onClick={handleToggleLock}
                                className={`p-2 rounded-full transition-colors ${isAuthenticated ? 'text-emerald-500 bg-emerald-50' : 'text-red-500 bg-red-50'}`}
                                title={isAuthenticated ? "點擊鎖定" : "點擊解鎖"}
                            >
                                {isAuthenticated ? <LockOpen size={20}/> : <Lock size={20}/>}
                            </button>
                        )}

                        <Button variant="secondary" onClick={() => handleAuthRequired(() => { resetForm(); setIsAddHoldingOpen(true); })} className="px-3 text-sm ml-1 font-bold">新增</Button>
                    </div>
                </div>
                
                {/* Price Update Message Bar */}
                {priceUpdateMsg && (
                    <div className={`text-xs text-center py-1 mt-1 rounded ${priceUpdateMsg.includes('失敗') ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'} animate-in slide-in-from-top-1`}>
                        {priceUpdateMsg}
                    </div>
                )}
              </header>

              <main className="max-w-5xl mx-auto p-4 space-y-6">
                
                {/* 1. 總覽卡片 */}
                {activeTab === 'overview' && (
                  <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <Card className="p-5 bg-gradient-to-br from-blue-600 to-blue-700 text-white border-none shadow-lg shadow-blue-200">
                        <div className="flex justify-between items-start mb-4">
                          <div>
                              <p className="text-blue-100 text-sm font-medium mb-1">總資產市值</p>
                              <div className="flex items-baseline gap-2">
                                  <h2 className="text-3xl font-bold tracking-tight">{formatCurrency(totalAssetValue)}</h2>
                                  <span className={`text-sm font-bold px-2 py-0.5 rounded-full ${totalProfitPercentage >= 0 ? 'bg-red-500/30 text-red-100' : 'bg-emerald-500/30 text-emerald-100'}`}>
                                      {totalProfitPercentage > 0 ? '+' : ''}{totalProfitPercentage.toFixed(2)}%
                                  </span>
                              </div>
                          </div>
                          <div className="bg-white/20 p-2 rounded-lg backdrop-blur-sm"><DollarSign size={24} className="text-white"/></div>
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-sm text-blue-100">
                           <div className="flex flex-col">
                               <span className="opacity-70 text-xs mb-1">投入成本</span> 
                               <span className="font-bold text-base">{formatNumber(Math.round(totalCost))}</span>
                           </div>
                           <div className="flex flex-col">
                               <span className="opacity-70 text-xs mb-1">未實現損益</span> 
                               <span className="font-bold text-base">{formatNumber(Math.round(totalUnrealizedProfit))}</span>
                           </div>
                           <div className="flex flex-col">
                               <span className="opacity-70 text-xs mb-1">當日損益</span> 
                               <span className={`font-bold text-base ${totalDailyProfit >= 0 ? 'text-red-300' : 'text-emerald-300'}`}>
                                   {totalDailyProfit > 0 ? '+' : ''}{formatNumber(Math.round(totalDailyProfit))}
                               </span>
                           </div>
                        </div>
                      </Card>

                      <Card className="p-5 flex flex-col justify-between">
                         <div className="flex justify-between items-start">
                            <div><p className="text-slate-500 text-sm font-medium mb-1">已實現損益 (今年)</p><h2 className={`text-2xl font-bold ${aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0) >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatCurrency(aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0))}</h2></div>
                            <div className="bg-emerald-50 p-2 rounded-lg"><PieChartIcon size={24} className="text-emerald-500"/></div>
                         </div>
                         <div className="mt-2 text-xs text-slate-400">包含股利與價差</div>
                      </Card>

                      {/* 成員資產分佈 */}
                      <Card className="p-5 flex flex-col justify-between">
                         <div className="flex justify-between items-center mb-2">
                             <p className="text-slate-500 text-sm font-medium">成員資產分佈</p>
                         </div>
                         <div className="flex gap-4">
                             {/* Chart */}
                             <div className="flex-1 min-h-[100px] relative">
                                {allocationData.length > 0 ? (
                                   <ResponsiveContainer width="100%" height={120}>
                                     <PieChart>
                                       <Pie data={allocationData} innerRadius={35} outerRadius={55} paddingAngle={5} dataKey="value">
                                         {allocationData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                                       </Pie>
                                       <RechartsTooltip formatter={(val) => formatCurrency(val)} />
                                     </PieChart>
                                   </ResponsiveContainer>
                                ) : <div className="text-slate-400 text-xs flex items-center justify-center h-full">尚無資料</div>}
                             </div>
                             {/* Interactive Member List */}
                             <div className="flex flex-col justify-center gap-1.5 w-1/2">
                                {members.map((m, i) => {
                                    const mData = allocationData.find(d => d.name === m.name);
                                    const val = mData ? mData.value : 0;
                                    const percent = totalAssetValue > 0 ? ((val / totalAssetValue) * 100).toFixed(1) : "0.0";
                                    return (
                                        <button 
                                            key={m.id} 
                                            onClick={() => setSelectedMember(m)}
                                            className="flex items-center justify-between text-xs p-1.5 hover:bg-slate-50 rounded-lg group transition-colors text-left"
                                        >
                                            <div className="flex items-center gap-2">
                                                <div className="w-2 h-2 rounded-full" style={{background: COLORS[i % COLORS.length]}}></div>
                                                <span className="text-slate-700 font-medium">{m.name}</span>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <span className="text-xs text-slate-400 font-medium">{percent}%</span>
                                                <ChevronRight size={14} className="text-slate-300 group-hover:text-blue-500"/>
                                            </div>
                                        </button>
                                    );
                                })}
                             </div>
                         </div>
                      </Card>
                    </div>

                    {/* Chart Section */}
                    <Card className="p-6">
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 gap-2">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2"><Activity size={20} className="text-blue-500"/>資產趨勢圖 (堆疊)</h3>
                          <div className="flex gap-1 p-1 bg-slate-100 rounded-full self-start sm:self-auto">
                              {['1M', '3M', '6M', '1Y'].map(range => (
                                  <button 
                                      key={range}
                                      onClick={() => setMainTimeRange(range)}
                                      className={`px-3 py-1 text-xs font-bold rounded-full transition-all duration-300 ${
