<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭資產管家 (進階版)</title>

    <!-- 1. 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
              cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' } // For trend chart
            }
          }
        }
      }
    </script>

    <!-- 2. Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.378.0?external=react,react-dom"
      }
    }
    </script>
    
    <!-- 4. Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 5. 主要程式碼 -->
    <script type="text/babel" data-type="module">
        // --- 導入套件 ---
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { PieChart, Pie, Cell, ResponsiveContainer, Tooltip as RechartsTooltip, Legend, LineChart, Line, XAxis, YAxis, CartesianGrid, Area, AreaChart } from 'recharts';
        import { Plus, Trash2, Edit2, TrendingUp, TrendingDown, Users, DollarSign, RefreshCw, PieChart as PieChartIcon, Save, X, AlertCircle, Upload, FileText, Clock, ShieldCheck, Search, Calendar, ChevronDown, Filter, ArrowRightLeft, StickyNote, Layers, List, Activity, Lock, Settings, Unlock, Loader2, Table, LayoutList, ArrowUp, ArrowDown, ArrowUpDown, Copy, User } from 'lucide-react';

        // Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, writeBatch, getDoc, setDoc, getDocs, query } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyC2mxpOL7hzieOBCv_7rPI6E-xpCe6DznA",
            authDomain: "familystockprofolio.firebaseapp.com",
            projectId: "familystockprofolio",
            storageBucket: "familystockprofolio.appspot.com",
            messagingSenderId: "991475739366",
            appId: "1:991475739366:web:12745a33189c445472111d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "github-web-version";

        // --- 元件定義 ---
        const Card = ({ children, className = "", onClick }) => (
          <div onClick={onClick} className={`bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden ${className}`}>
            {children}
          </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl scale-100 overflow-hidden flex flex-col max-h-[90vh]">
                <div className="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50/50">
                  <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                  <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-200 text-slate-500 transition-colors"><X size={20} /></button>
                </div>
                <div className="p-4 overflow-y-auto bg-white">{children}</div>
              </div>
            </div>
          );
        };

        const Button = ({ children, onClick, variant = 'primary', className = "", disabled = false, isLoading = false }) => {
          const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
          const variants = {
            primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-md shadow-blue-200",
            secondary: "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 hover:border-slate-300 shadow-sm",
            danger: "bg-red-50 text-red-600 hover:bg-red-100 border border-red-100",
            warning: "bg-amber-50 text-amber-600 hover:bg-amber-100 border border-amber-100",
            ghost: "text-slate-500 hover:bg-slate-100",
            buyActive: "bg-red-600 text-white shadow-md shadow-red-200",
            sellActive: "bg-emerald-600 text-white shadow-md shadow-emerald-200",
          };
          return (
            <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`} disabled={disabled || isLoading}>
              {isLoading ? <Loader2 size={18} className="animate-spin" /> : children}
            </button>
          );
        };

        const Input = ({ label, value, onChange, onBlur, onKeyDown, type = "text", placeholder, className = "" }) => (
          <div className={`flex flex-col gap-1 ${className}`}>
            {label && <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{label}</label>}
            <input
              type={type}
              value={value}
              onChange={onChange}
              onBlur={onBlur}
              onKeyDown={onKeyDown}
              placeholder={placeholder}
              className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-slate-800"
            />
          </div>
        );

        const StatBox = ({ label, value, subValue, type = "neutral", icon: Icon }) => {
            const colors = {
                neutral: "text-slate-800",
                positive: "text-red-500", // 台股紅漲
                negative: "text-emerald-500", // 台股綠跌
                blue: "text-blue-600"
            };
            return (
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-start justify-between group hover:border-blue-100 transition-colors">
                    <div>
                        <div className="text-xs text-slate-500 font-medium mb-1">{label}</div>
                        <div className={`text-lg font-bold ${colors[type]}`}>{value}</div>
                        {subValue && <div className="text-xs text-slate-400 mt-0.5">{subValue}</div>}
                    </div>
                    {Icon && <div className="p-2 bg-white rounded-lg text-slate-400 group-hover:text-blue-500 transition-colors shadow-sm"><Icon size={18} /></div>}
                </div>
            );
        };

        // --- 格式化工具 ---
        const formatCurrency = (value) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(value);
        const formatNumber = (value) => new Intl.NumberFormat('zh-TW').format(value);
        // 新增：類似截圖的冷色調配色
        const PIE_COLORS = ['#3b82f6', '#0ea5e9', '#22d3ee', '#14b8a6', '#10b981', '#a8a29e']; 
        const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#6366F1'];

        // --- 主程式 ---
        function App() {
          const [user, setUser] = useState(null);
          const [activeTab, setActiveTab] = useState('overview');
          const [members, setMembers] = useState([]);
          const [allHoldings, setAllHoldings] = useState([]); 
          const [loading, setLoading] = useState(true);

          // Security States
          const [isLocked, setIsLocked] = useState(true);
          const [hasPin, setHasPin] = useState(false);
          const [pinInput, setPinInput] = useState("");
          const [storedPin, setStoredPin] = useState(null);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [newPin, setNewPin] = useState("");

          // Year & Month Management
          const currentYear = new Date().getFullYear().toString();
          const [activeYear, setActiveYear] = useState(currentYear);
          const [activeMonth, setActiveMonth] = useState('all');
          const [availableYears, setAvailableYears] = useState([currentYear]);

          // View Mode (Updated: 'portfolio' or 'history')
          const [holdingViewMode, setHoldingViewMode] = useState('portfolio'); // 'portfolio' | 'history'
          
          // Sorting State for History View
          const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });

          // Member Detail State
          const [selectedMember, setSelectedMember] = useState(null);
          const [trendRange, setTrendRange] = useState('1Y'); // 1Y, 6M, 3M, 1M

          // Update Logic States
          const [updatingPrices, setUpdatingPrices] = useState(false);
          const [priceUpdateMsg, setPriceUpdateMsg] = useState("");
          const [lastUpdateTime, setLastUpdateTime] = useState(null);

          // Modal States
          const [isAddMemberOpen, setIsAddMemberOpen] = useState(false);
          const [isAddHoldingOpen, setIsAddHoldingOpen] = useState(false);
          const [isImportOpen, setIsImportOpen] = useState(false);
          const [editingHolding, setEditingHolding] = useState(null);

          // Form States
          const [loadingStockInfo, setLoadingStockInfo] = useState(false);

          const [newMemberName, setNewMemberName] = useState("");
          const [holdingForm, setHoldingForm] = useState({
            memberId: "",
            symbol: "",
            name: "",
            type: "buy", // buy | sell
            shares: "",
            price: "",
            fee: "1", // 修改預設手續費為 1
            date: new Date().toISOString().split('T')[0],
            note: "",
            year: currentYear
          });

          // Import State
          const [importTargetMemberId, setImportTargetMemberId] = useState("");
          const [csvPreview, setCsvPreview] = useState([]);
          const [isImporting, setIsImporting] = useState(false); // 新增匯入載入狀態
          const fileInputRef = useRef(null);

          // --- Auth & Data Fetching ---
          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (error) {
                console.error("Auth error:", error);
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, setUser);
            return () => unsubscribe();
          }, []);

          // --- Security Check & Data Fetching ---
          useEffect(() => {
            if (!user) return;

            // 1. Check for PIN
            const checkSecurity = async () => {
              try {
                const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security');
                const snap = await getDoc(settingsRef);
                if (snap.exists() && snap.data().pin) {
                  setHasPin(true);
                  setStoredPin(snap.data().pin);
                  setIsLocked(true);
                } else {
                  setHasPin(false);
                  setIsLocked(false);
                }
              } catch (e) {
                console.error("Security check failed", e);
                setIsLocked(false);
              }
            };
            checkSecurity();

            // 2. Fetch Data
            const membersRef = collection(db, 'artifacts', appId, 'users', user.uid, 'members');
            const unsubMembers = onSnapshot(membersRef, (snapshot) => {
              setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });

            const holdingsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'holdings');
            const unsubHoldings = onSnapshot(holdingsRef, (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAllHoldings(data);
              setLoading(false);
                
              const years = new Set(data.map(h => h.year || currentYear));
              years.add(currentYear);
              const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));
              setAvailableYears(sortedYears);

              // Find last update time
              if (data.length > 0) {
                const maxTime = Math.max(...data.map(h => h.priceUpdateTime ? h.priceUpdateTime.seconds : 0));
                if (maxTime > 0) setLastUpdateTime(new Date(maxTime * 1000));
              }
            });

            return () => { unsubMembers(); unsubHoldings(); };
          }, [user]);

          // --- Filtered Data ---
          const holdings = useMemo(() => {
            let filtered = allHoldings.filter(h => {
              const yearMatch = (h.year || currentYear) === activeYear;
              if (activeMonth === 'all') return yearMatch;
              const hMonth = parseInt(h.date.split('-')[1], 10);
              return yearMatch && hMonth === activeMonth;
            });
            
            // Default sort by date desc for logic processing
            return filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          }, [allHoldings, activeYear, activeMonth, currentYear]);

          // --- Sorted History for Display ---
          const sortedHistory = useMemo(() => {
            let sortableItems = [...holdings];
            if (sortConfig.key !== null) {
              sortableItems.sort((a, b) => {
                let aValue, bValue;
                
                switch(sortConfig.key) {
                    case 'memberId': 
                        aValue = members.find(m => m.id === a.memberId)?.name || '';
                        bValue = members.find(m => m.id === b.memberId)?.name || '';
                        break;
                    case 'total':
                        aValue = Math.round(a.shares * a.price + (a.type === 'buy' ? 1 : -1) * (a.fee || 0));
                        bValue = Math.round(b.shares * b.price + (b.type === 'buy' ? 1 : -1) * (b.fee || 0));
                        break;
                    case 'shares':
                    case 'price':
                    case 'fee':
                        aValue = parseFloat(a[sortConfig.key] || 0);
                        bValue = parseFloat(b[sortConfig.key] || 0);
                        break;
                    default: // date, type, symbol, name
                        aValue = a[sortConfig.key];
                        bValue = b[sortConfig.key];
                }

                if (aValue < bValue) {
                  return sortConfig.direction === 'asc' ? -1 : 1;
                }
                if (aValue > bValue) {
                  return sortConfig.direction === 'asc' ? 1 : -1;
                }
                return 0;
              });
            }
            return sortableItems;
          }, [holdings, sortConfig, members]);

          // --- Aggregated Data ---
          const aggregatedHoldings = useMemo(() => {
            const groups = {};
            const sortedForCalc = [...holdings].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            sortedForCalc.forEach(tx => {
              const key = `${tx.symbol}-${tx.memberId}`;
              if (!groups[key]) {
                const member = members.find(m => m.id === tx.memberId);
                groups[key] = {
                  id: key,
                  symbol: tx.symbol,
                  name: tx.name,
                  memberId: tx.memberId,
                  memberName: member ? member.name : 'Unknown',
                  shares: 0,
                  totalCost: 0,
                  realizedProfit: 0,
                  currentPrice: 0,
                  dailyChangePercent: 0,
                  txCount: 0
                };
              }

              const group = groups[key];
              if (tx.currentPrice) group.currentPrice = tx.currentPrice;
              if (tx.dailyChangePercent) group.dailyChangePercent = tx.dailyChangePercent;

              // 修正重點：使用 parseFloat 保留小數點，解決成本計算誤差問題
              const qty = parseFloat(tx.shares) || 0;
              const unitCost = parseFloat(tx.price) || 0;
              const fee = parseFloat(tx.fee) || 0;

              if (tx.type === 'buy') {
                group.shares += qty;
                // 成本 = (股數 * 單價) + 手續費
                group.totalCost += (qty * unitCost + fee);
              } else {
                // Sell logic: Weighted Average Cost (加權平均成本法)
                // 當賣出時，依照賣出的比例減少總成本
                const avgCost = group.shares > 0 ? group.totalCost / group.shares : 0;
                const sellQty = Math.abs(qty);
                const revenue = sellQty * unitCost - fee; // 賣出收入 = (股數 * 單價) - 手續費
                const costBasis = sellQty * avgCost;      // 賣出部分的成本
                
                group.realizedProfit += (revenue - costBasis);
                group.shares -= sellQty;
                group.totalCost -= costBasis;
                
                // 邊界處理：如果股數歸零或變負(極少見)，重置成本以防浮點數誤差殘留
                if (group.shares <= 0) {
                    group.shares = 0;
                    group.totalCost = 0;
                }
              }
              group.txCount++;
            });

            return Object.values(groups).map(g => {
              // 防止除以零
              const avgCost = g.shares > 0 ? g.totalCost / g.shares : 0;
              const marketValue = g.shares * g.currentPrice;
              const unrealizedProfit = marketValue - g.totalCost;
              const unrealizedProfitPercent = g.totalCost > 0 ? (unrealizedProfit / g.totalCost) * 100 : 0;
                
              return {
                ...g,
                avgCost,
                marketValue: g.shares > 0 ? marketValue : 0,
                unrealizedProfit: g.shares > 0 ? unrealizedProfit : 0,
                unrealizedProfitPercent: g.shares > 0 ? unrealizedProfitPercent : 0
              };
            }).filter(g => g.shares > 0 || g.realizedProfit !== 0);
          }, [holdings, members]);

          // --- Trend Data Calculation ---
          const trendData = useMemo(() => {
            const months = Array.from({ length: 12 }, (_, i) => i + 1);
            const yearTxs = allHoldings
              .filter(h => (h.year || currentYear) === activeYear)
              .sort((a, b) => new Date(a.date) - new Date(b.date));

            const priceMap = {};
            allHoldings.forEach(h => { if(h.currentPrice) priceMap[h.symbol] = h.currentPrice; });
            
            // Initialize portfolio structure: { memberId: { symbol: { shares, totalCost } } }
            let runningPortfolio = {}; 
              
            members.forEach(m => { runningPortfolio[m.id] = {}; });

            return months.map(month => {
              const monthlyTxs = yearTxs.filter(h => {
                  const m = parseInt(h.date?.split('-')[1] || 0, 10);
                  return m === month;
              });

              monthlyTxs.forEach(tx => {
                  const mId = tx.memberId;
                  if (!runningPortfolio[mId]) runningPortfolio[mId] = {};
                  
                  const sym = tx.symbol;
                  if(!runningPortfolio[mId][sym]) runningPortfolio[mId][sym] = { shares: 0, totalCost: 0 };
                  
                  const qty = parseInt(tx.shares);
                  const unitCost = parseInt(tx.price);
                  const fee = parseInt(tx.fee || 0);
                  
                  if (tx.type === 'buy') {
                      runningPortfolio[mId][sym].shares += qty;
                      runningPortfolio[mId][sym].totalCost += (qty * unitCost + fee);
                  } else {
                      const currentData = runningPortfolio[mId][sym];
                      const currentAvg = currentData.shares > 0 ? currentData.totalCost / currentData.shares : 0;
                      const sellQty = Math.abs(qty);
                      currentData.shares -= sellQty;
                      currentData.totalCost -= (sellQty * currentAvg); // Reduce cost basis
                  }
              });

              // Calculate snapshot for this month
              let monthMarketValue = 0;
              let monthInvestedCost = 0;
              const dataPoint = { name: `${month}月` };

              members.forEach(m => {
                  let memberVal = 0;
                  const mPortfolio = runningPortfolio[m.id] || {};
                  
                  Object.entries(mPortfolio).forEach(([sym, data]) => {
                      if (data.shares > 0) {
                          const price = priceMap[sym] || (data.totalCost / data.shares); 
                          memberVal += data.shares * price;
                          monthInvestedCost += data.totalCost;
                      }
                  });
                  dataPoint[m.id] = Math.round(memberVal);
                  monthMarketValue += memberVal;
              });

              dataPoint.marketValue = Math.round(monthMarketValue);
              dataPoint.invested = Math.round(monthInvestedCost);

              return dataPoint;
            });
          }, [allHoldings, activeYear, members]);

          // --- Member Specific Data ---
          // 1. Pie Data
          const memberPieData = useMemo(() => {
            if (!selectedMember) return [];
            return aggregatedHoldings
                .filter(h => h.memberId === selectedMember.id && h.marketValue > 0)
                .sort((a, b) => b.marketValue - a.marketValue) // Descending
                .map(h => ({ 
                    name: h.name, 
                    symbol: h.symbol, 
                    value: h.marketValue,
                    // 新增：傳遞詳細資訊給列表顯示
                    currentPrice: h.currentPrice,
                    avgCost: h.avgCost,
                    unrealizedProfitPercent: h.unrealizedProfitPercent
                }));
          }, [aggregatedHoldings, selectedMember]);

          // 2. Trend Data (Filtered by Range)
          const memberTrendData = useMemo(() => {
              if (!selectedMember) return [];
              // Filter trendData for specific member
              const rawData = trendData.map(d => ({
                  name: d.name,
                  value: d[selectedMember.id] || 0
              }));

              // Apply Range Filter (Simulation based on months)
              // Current logic assumes trendData has 12 months. 
              // We'll slice from the end backwards to simulate ranges.
              const currentMonthIndex = new Date().getMonth() + 1; // 1-12 (approx)
              // If analyzing past year, we have data for available months.
              // Let's filter out future months that have 0 value if we want a clean line, 
              // or just use slice logic.
              
              let sliceCount = 12;
              if (trendRange === '1M') sliceCount = 2; // Show last 2 points for a line
              if (trendRange === '3M') sliceCount = 3;
              if (trendRange === '6M') sliceCount = 6;
              if (trendRange === '1Y') sliceCount = 12;

              // Get data up to current actual month if possible, or just non-zero?
              // For simplicity, we just slice the array from the end of valid data
              // Finding last non-zero month index could be better but let's stick to simple slice
              return rawData.slice(Math.max(rawData.length - sliceCount, 0));
          }, [trendData, selectedMember, trendRange]);

          const memberTotalAssets = memberPieData.reduce((sum, item) => sum + item.value, 0);

          // --- Helpers & APIs ---
          
          // 輔助：延遲函數 (用於穩定更新)
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          // 核心請求函數：穩定型 (Sequential Fallback)
          // 放棄競速，改為一個接一個試，直到成功，確保最高成功率
          const fetchStable = async (targetUrl) => {
             const encodedUrl = encodeURIComponent(targetUrl);
             
             // 代理清單 (依穩定度排序)
             const strategies = [
                 // 1. AllOrigins (解析 content，通常最穩)
                 async () => {
                     const r = await fetch(`https://api.allorigins.win/get?url=${encodedUrl}&t=${Date.now()}`);
                     if (!r.ok) throw new Error('AO ' + r.status);
                     const d = await r.json();
                     if (!d.contents) throw new Error('AO Empty');
                     return JSON.parse(d.contents);
                 },
                 // 2. Corsproxy.io (直接回傳)
                 async () => {
                     const r = await fetch(`https://corsproxy.io/?${encodedUrl}`);
                     if (!r.ok) throw new Error('CP ' + r.status);
                     return await r.json();
                 },
                 // 3. CodeTabs
                 async () => {
                     const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodedUrl}`);
                     if (!r.ok) throw new Error('CT ' + r.status);
                     return await r.json();
                 },
                 // 4. ThingProxy
                 async () => {
                     const r = await fetch(`https://thingproxy.freeboard.io/fetch/${targetUrl}`);
                     if (!r.ok) throw new Error('TP ' + r.status);
                     return await r.json();
                 }
             ];

             for (const strategy of strategies) {
                 try {
                     const controller = new AbortController();
                     const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超時
                     
                     const result = await Promise.race([
                         strategy(),
                         new Promise((_, reject) => controller.signal.addEventListener('abort', () => reject(new Error("Timeout"))))
                     ]);
                     
                     clearTimeout(timeoutId);
                     return result;
                 } catch (e) {
                     await sleep(500); // 失敗休息 0.5s
                     continue;
                 }
             }
             throw new Error("All proxies failed");
          };

          // 獲取單檔股票資料 (證交所優先版)
          const fetchStockData = async (code, currentName, onlyPrice = false) => {
             const cleanCode = code.toString().trim().toUpperCase();
             const needsName = !currentName || currentName.trim() === '';

             // 定義資料來源任務
             
             // 1. TWSE (證交所官方資料 - 最優先來源)
             const tryTwse = async () => {
                 try {
                     // 同時查詢 上市(tse) 與 上櫃(otc)
                     const query = `tse_${cleanCode}.tw|otc_${cleanCode}.tw`;
                     // 加上 timestamp 避免快取
                     const url = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${query}&json=1&delay=0&t=${Date.now()}`;
                     const data = await fetchStable(url);
                     
                     // 找到代號吻合的資料
                     const result = data?.msgArray?.find(item => item.c === cleanCode);
                     
                     if (result && result.n) {
                        // 嘗試解析價格
                        let p = parseFloat(result.z); // 最近成交價
                        if (isNaN(p)) p = parseFloat(result.b?.split('_')[0]); // 最佳買入
                        if (isNaN(p)) p = parseFloat(result.a?.split('_')[0]); // 最佳賣出
                        
                        const y = parseFloat(result.y); // 昨收
                        const changePercent = (!isNaN(p) && !isNaN(y)) ? ((p - y) / y) * 100 : 0;
                        
                        return { 
                            name: result.n, // 證交所的中文名稱 (ex: 台積電, 元大台灣50)
                            price: !isNaN(p) ? p : null, // 若盤前無價格則為 null
                            changePercent: changePercent 
                        };
                     }
                 } catch(e) {
                     // console.warn("TWSE fetch error", e);
                 }
                 return null;
             };

             // 2. Yahoo Quote API (價格備援 & 名稱備援)
             const tryYahooQuote = async () => {
                 try {
                     // 修正：加入 timestamp (t) 參數，強制避免快取，確保抓到最新股價
                     const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${cleanCode}.TW,${cleanCode}.TWO&t=${Date.now()}`;
                     const data = await fetchStable(url);
                     const res = data?.quoteResponse?.result?.[0];
                     if (res) {
                         return {
                             name: res.longName || res.shortName, // 這裡也有名字
                             price: res.regularMarketPrice,
                             changePercent: res.regularMarketChangePercent
                         };
                     }
                 } catch(e) {}
                 return null;
             };

             // 3. CnYes (鉅亨網 - 純名稱最後備援)
             const tryCnYes = async () => {
                 if (onlyPrice) return null;
                 try {
                     const url = `https://ess.api.cnyes.com/ess/api/v1/suggestion/keyword?q=${cleanCode}&limit=5`;
                     const data = await fetchStable(url);
                     if (data?.data?.stores?.length > 0) {
                         const match = data.data.stores.find(s => s.symbol === cleanCode) || data.data.stores[0];
                         if (match?.name) return { name: match.name };
                     }
                 } catch(e) {}
                 return null;
             };

             // --- 執行邏輯：依序嘗試 ---
             
             let finalName = currentName;
             let finalPrice = null;
             let finalChange = null;

             // 步驟 A: 優先嘗試證交所 (TWSE)
             let data = await tryTwse();
             
             if (data) {
                 // 只要證交所有回傳名字，就使用它
                 if (data.name) finalName = data.name;
                 if (data.price !== null) {
                     finalPrice = data.price;
                     finalChange = data.changePercent;
                 }
             }

             // 步驟 B: 如果 TWSE 失敗或沒價格，嘗試 Yahoo 補救
             if (finalPrice === null || (!finalName && needsName)) {
                 if (!data) await sleep(500); // 喘口氣
                 const yData = await tryYahooQuote();
                 if (yData) {
                     if (finalPrice === null) {
                         finalPrice = yData.price;
                         finalChange = yData.changePercent;
                     }
                     // 如果 TWSE 沒名字，才用 Yahoo 的
                     if (needsName && (!finalName || finalName === cleanCode)) {
                         finalName = yData.name;
                     }
                 }
             }

             // 步驟 C: 如果還是沒名字，最後試試鉅亨網
             if (needsName && (!finalName || finalName === cleanCode)) {
                 await sleep(500);
                 const cnYesData = await tryCnYes();
                 if (cnYesData?.name) finalName = cnYesData.name;
             }

             // 如果完全沒抓到東西，回傳 null
             if (finalPrice === null && (needsName && !finalName)) return null;

             return {
                 name: finalName,
                 price: finalPrice,
                 changePercent: finalChange
             };
          };

          // 新增：批次抓取股價 (針對手機版優化，速度快且穩定)
          const fetchBatchPrices = async (codes) => {
              if (!codes || codes.length === 0) return {};
              
              // 組合代號：同時查詢 .TW (上市) 和 .TWO (上櫃)
              const querySymbols = [];
              codes.forEach(c => {
                  const clean = c.toString().toUpperCase().trim();
                  querySymbols.push(`${clean}.TW`);
                  querySymbols.push(`${clean}.TWO`);
              });

              // Yahoo Finance Quote API (支援多代號)
              const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${querySymbols.join(',')}&t=${Date.now()}`;
              
              try {
                  // 使用 fetchStable 透過代理伺服器發送請求
                  const data = await fetchStable(url);
                  const updates = {};
                  
                  if (data?.quoteResponse?.result) {
                      data.quoteResponse.result.forEach(item => {
                          // 檢查是否有有效價格
                          if (item.regularMarketPrice !== undefined && item.regularMarketPrice !== null) {
                              const rawCode = item.symbol.split('.')[0]; // 移除 .TW/.TWO 後綴
                              updates[rawCode] = {
                                  price: item.regularMarketPrice,
                                  changePercent: item.regularMarketChangePercent
                              };
                          }
                      });
                  }
                  return updates;
              } catch (e) {
                  console.warn("Batch fetch failed", e);
                  return {}; // 失敗回傳空物件，交由第二階段補救
              }
          };

          const handleSymbolBlur = async () => {
             const sym = holdingForm.symbol;
             if (!sym || sym.trim() === '') return;
             
             const cleanSym = sym.trim().toUpperCase();
             if (cleanSym !== sym) {
                 setHoldingForm(prev => ({ ...prev, symbol: cleanSym }));
             }

             setLoadingStockInfo(true);
             try {
                // 搜尋模式：需要名字
                const quote = await fetchStockData(cleanSym, ""); 
                
                if (quote && quote.name) {
                    setHoldingForm(prev => ({
                        ...prev,
                        symbol: cleanSym,
                        name: quote.name, 
                        // 不覆蓋價格，除非是新的
                    }));
                } else {
                    alert("目前無法自動抓取名稱 (網路連線可能受阻)。\n\n請直接手動輸入名稱即可。");
                }
             } catch (e) {
                console.error("Auto-fill error", e);
             } finally {
                setLoadingStockInfo(false);
             }
          };

          const handleUpdatePrices = async () => {
            if (!user || allHoldings.length === 0) return;
            setUpdatingPrices(true);
            setPriceUpdateMsg("初始化...");
            
            const uniqueSymbols = [...new Set(allHoldings.map(h => h.symbol))];
            const updatesMap = {}; // 暫存所有成功的更新 { '2330': { price:..., change:... } }
            
            // --- 階段一：批次極速更新 (Yahoo) ---
            // 將代號切分成每組 10 個 (避免 URL 過長)
            const BATCH_SIZE = 10;
            const chunks = [];
            for (let i = 0; i < uniqueSymbols.length; i += BATCH_SIZE) {
                chunks.push(uniqueSymbols.slice(i, i + BATCH_SIZE));
            }

            for (let i = 0; i < chunks.length; i++) {
                const chunk = chunks[i];
                setPriceUpdateMsg(`正在批次更新第 ${i+1}/${chunks.length} 組...`);
                
                // 嘗試批次抓取
                const batchResults = await fetchBatchPrices(chunk);
                Object.assign(updatesMap, batchResults);
                
                // 小休息，避免被判定為機器人
                if (i < chunks.length - 1) await sleep(500);
            }

            // --- 階段二：針對性補漏 (TWSE 逐一補救) ---
            // 找出哪些股票在階段一沒抓到
            const missingSymbols = uniqueSymbols.filter(s => !updatesMap[s]);
            
            if (missingSymbols.length > 0) {
                setPriceUpdateMsg(`正在補救 ${missingSymbols.length} 檔資料...`);
                
                for (let i = 0; i < missingSymbols.length; i++) {
                    const code = missingSymbols[i];
                    // 顯示詳細進度
                    setPriceUpdateMsg(`補救中: ${code} (${i+1}/${missingSymbols.length})`);
                    
                    try {
                        const existingName = allHoldings.find(h => h.symbol === code)?.name || '';
                        // 使用單檔強力抓取 (onlyPrice=true)
                        const data = await fetchStockData(code, existingName, true);
                        if (data && data.price !== null) {
                            updatesMap[code] = data;
                        }
                    } catch (e) { console.warn("Retry failed", code); }
                    
                    // 補救模式需要休息久一點，確保成功率
                    await sleep(1000);
                }
            }

            // --- 階段三：寫入資料庫 ---
            setPriceUpdateMsg("正在儲存...");
            
            const pendingOperations = [];
            Object.entries(updatesMap).forEach(([code, data]) => {
                const holdingsToUpdate = allHoldings.filter(h => h.symbol === code);
                holdingsToUpdate.forEach(h => {
                    const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', h.id);
                    pendingOperations.push({
                        ref: ref,
                        data: {
                            currentPrice: data.price,
                            dailyChangePercent: data.changePercent,
                            priceUpdateTime: new Date()
                        }
                    });
                });
            });

            if (pendingOperations.length === 0) {
                setPriceUpdateMsg("本次無資料更新 (可能休市或網路異常)");
                setUpdatingPrices(false);
                return;
            }

            // 分批寫入 Firestore (每次 450 筆)
            const WRITE_BATCH_SIZE = 450;
            try {
                let committedCount = 0;
                for (let i = 0; i < pendingOperations.length; i += WRITE_BATCH_SIZE) {
                    const writeChunk = pendingOperations.slice(i, i + WRITE_BATCH_SIZE);
                    const batch = writeBatch(db);
                    writeChunk.forEach(op => batch.update(op.ref, op.data));
                    await batch.commit();
                    committedCount += writeChunk.length;
                }

                setLastUpdateTime(new Date());
                const successCount = Object.keys(updatesMap).length;
                const totalCount = uniqueSymbols.length;
                setPriceUpdateMsg(`更新完成：${successCount}/${totalCount} 檔成功`);
                
            } catch (e) {
                console.error("Batch write failed", e);
                setPriceUpdateMsg("資料庫寫入失敗");
            }
            
            setUpdatingPrices(false);
          };

          const handleSort = (key) => {
            let direction = 'asc';
            if (sortConfig.key === key && sortConfig.direction === 'asc') {
              direction = 'desc';
            }
            setSortConfig({ key, direction });
          };

          // Helper to render sort icon
          const SortIcon = ({ column }) => {
              if (sortConfig.key !== column) return <ArrowUpDown size={14} className="ml-1 text-slate-300 inline opacity-50" />;
              return sortConfig.direction === 'asc' 
                  ? <ArrowUp size={14} className="ml-1 text-blue-500 inline" /> 
                  : <ArrowDown size={14} className="ml-1 text-blue-500 inline" />;
          }

          // --- Stats ---
          const totalMarketValue = aggregatedHoldings.reduce((sum, h) => sum + h.marketValue, 0);
          const totalCost = aggregatedHoldings.reduce((sum, h) => sum + h.totalCost, 0);
          const totalProfit = totalMarketValue - totalCost;
          const totalProfitPercent = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;
          const totalRealized = aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0);

          const memberStats = useMemo(() => {
            const stats = {};
            members.forEach(m => {
                const mHoldings = aggregatedHoldings.filter(h => h.memberId === m.id);
                const mv = mHoldings.reduce((s, h) => s + h.marketValue, 0);
                const cost = mHoldings.reduce((s, h) => s + h.totalCost, 0);
                stats[m.id] = { name: m.name, value: mv, cost: cost, profit: mv - cost, id: m.id }; // Ensure id is passed
            });
            return Object.values(stats);
          }, [aggregatedHoldings, members]);

          // --- Handlers ---
          const handleAddMember = async () => {
            if (!newMemberName.trim() || !user) return;
            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'members'), {
              name: newMemberName,
              createdAt: new Date()
            });
            setNewMemberName("");
            setIsAddMemberOpen(false);
          };

          const handleSaveHolding = async () => {
            if (!holdingForm.memberId || !holdingForm.symbol || !holdingForm.shares || !holdingForm.price) {
                alert("請填寫完整資訊");
                return;
            }
            
            try {
                const payload = {
                    ...holdingForm,
                    year: holdingForm.date.split('-')[0], // ensure year sync
                    updatedAt: new Date()
                };

                if (editingHolding) {
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', editingHolding.id), payload);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'), {
                        ...payload,
                        createdAt: new Date(),
                        currentPrice: parseFloat(holdingForm.price), // Init with cost
                        dailyChangePercent: 0
                    });
                }
                setIsAddHoldingOpen(false);
                setEditingHolding(null);
                setHoldingForm({ ...holdingForm, symbol: "", name: "", shares: "", price: "", note: "" }); // Reset partial
            } catch (e) {
                console.error(e);
                alert("儲存失敗");
            }
          };

          const handleDeleteHolding = async (id) => {
            if (confirm("確定刪除此筆紀錄？")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', id));
            }
          };

          const calculateEstimate = () => {
              const p = parseFloat(holdingForm.price) || 0;
              const s = parseFloat(holdingForm.shares) || 0;
              const f = parseFloat(holdingForm.fee) || 0;
              if (holdingForm.type === 'buy') { return p * s + f; } else { return p * s - f; }
          };

          // --- Security Handlers ---
          const handleUnlock = () => {
            if (pinInput === storedPin) { setIsLocked(false); setPinInput(""); } else { alert("密碼錯誤，請重試"); }
          };

          const handleSetPin = async () => {
            if (newPin.length < 4) return alert("PIN 碼至少 4 位數");
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security'), { pin: newPin }, { merge: true });
            setStoredPin(newPin);
            setHasPin(true);
            setNewPin("");
            alert("密碼已設定");
          };

          // --- Import/Export ---
          const handleExport = () => {
             const csvContent = "data:text/csv;charset=utf-8,\uFEFF" 
                + "Date,Type,MemberID,Symbol,Name,Shares,Price,Fee,Note\n"
                + allHoldings.map(h => `${h.date},${h.type},${h.memberId},${h.symbol},${h.name},${h.shares},${h.price},${h.fee},${h.note}`).join("\n");
             const link = document.createElement("a");
             link.setAttribute("href", encodeURI(csvContent));
             link.setAttribute("download", `family_assets_backup_${new Date().toISOString().slice(0,10)}.csv`);
             document.body.appendChild(link);
             link.click();
          };
          
          const handleFileSelect = (e) => {
             const file = e.target.files[0];
             if(!file) return;
             const reader = new FileReader();
             reader.onload = (evt) => {
                 const text = evt.target.result;
                 // 1. 支援 Windows (\r\n) 與 Unix (\n) 換行
                 const rows = text.split(/\r?\n/).slice(1).filter(r => r.trim());
                 
                 const preview = rows.map(r => {
                     // 2. 簡單的 CSV 解析 (處理逗號)
                     // 為了相容性，這裡仍使用 split(',')，但建議備註盡量不要有逗號
                     // 如果需要更強的解析，可以使用 Regex: r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
                     const c = r.split(',');
                     return { 
                         date: c[0]?.trim(), 
                         type: c[1]?.trim(), 
                         memberId: c[2]?.trim(), 
                         symbol: c[3]?.trim(), 
                         name: c[4]?.trim(), 
                         shares: c[5]?.trim(), 
                         price: c[6]?.trim(), 
                         fee: c[7]?.trim(), 
                         note: c.slice(8).join(',').trim() // 備註如果包含逗號，盡量接回來
                     };
                 });
                 setCsvPreview(preview);
             };
             reader.readAsText(file);
          };

          const handleConfirmImport = async () => {
            if (!importTargetMemberId && csvPreview.some(r => !r.memberId)) { alert("請選擇匯入對象"); return; }
            
            setIsImporting(true);
            try {
                // 3. 批次處理 helper (Firestore 限制每次 batch 最多 500 筆)
                const chunkArray = (arr, size) => {
                   const chunks = [];
                   for (let i = 0; i < arr.length; i += size) {
                       chunks.push(arr.slice(i, i + size));
                   }
                   return chunks;
                };

                const batches = chunkArray(csvPreview, 450); // 設定 450 筆為一組，預留安全空間
                let successCount = 0;

                for (const chunk of batches) {
                    const batch = writeBatch(db);
                    chunk.forEach(row => {
                        const ref = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                        
                        // 4. 數值安全解析 (移除可能存在的逗號，例如 "1,000")
                        const parseNum = (str) => {
                            if (!str) return 0;
                            return parseFloat(str.toString().replace(/,/g, '')) || 0;
                        };

                        batch.set(ref, {
                            memberId: (row.memberId || importTargetMemberId),
                            symbol: row.symbol || "",
                            name: row.name || "",
                            type: (row.type && row.type.toLowerCase() === 'sell') ? 'sell' : 'buy',
                            shares: parseNum(row.shares),
                            price: parseNum(row.price),
                            fee: parseNum(row.fee),
                            note: row.note || "",
                            date: row.date || new Date().toISOString().split('T')[0],
                            year: (row.date && row.date.includes('-')) ? row.date.split('-')[0] : currentYear,
                            createdAt: new Date()
                        });
                    });
                    await batch.commit();
                    successCount += chunk.length;
                }

                setIsImportOpen(false);
                setCsvPreview([]);
                // 重置檔案輸入，確保下次可以選同一個檔案
                if(fileInputRef.current) fileInputRef.current.value = "";
                
                alert(`成功匯入 ${successCount} 筆資料`);
            } catch (e) { 
                console.error(e); 
                alert("匯入失敗：" + e.message);
            } finally {
                setIsImporting(false);
            }
          };

          // 新增：清空所有資料功能
          const handleClearAllData = async () => {
            // 第一道防線：警告視窗
            if (!confirm("嚴重警告：這將會【永久刪除】所有交易紀錄與庫存資料！\n\n刪除後的資料無法復原，建議您先執行「匯出備份」。\n\n您確定要繼續嗎？")) return;
            
            // 第二道防線：強制輸入驗證
            const check = prompt("為了防止誤刪，請輸入 'DELETE' (大寫) 以確認清空所有資料：");
            if (check !== 'DELETE') {
                alert("驗證碼輸入錯誤或取消，已中止清空作業。");
                return;
            }
            
            setIsImporting(true); // 重用 loading 狀態
            try {
                const q = query(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    alert("目前沒有資料可刪除");
                    return;
                }

                // 批次刪除
                const chunkArray = (arr, size) => {
                    const chunks = [];
                    for (let i = 0; i < arr.length; i += size) {
                        chunks.push(arr.slice(i, i + size));
                    }
                    return chunks;
                };

                const batches = chunkArray(snapshot.docs, 450);
                let deletedCount = 0;

                for (const chunk of batches) {
                    const batch = writeBatch(db);
                    chunk.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                    deletedCount += chunk.length;
                }
                
                alert(`已成功清除 ${deletedCount} 筆資料`);
                setIsSettingsOpen(false);
            } catch (e) {
                console.error(e);
                alert("刪除失敗：" + e.message);
            } finally {
                setIsImporting(false);
            }
          };

          // 新增：移除重複資料功能
          const handleRemoveDuplicates = async () => {
             if (!confirm("這將自動掃描並刪除內容完全相同的重複交易紀錄 (保留其中一筆)。\n\n確定執行嗎？")) return;
             
             setIsImporting(true);
             try {
                 const q = query(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                 const snapshot = await getDocs(q);
                 const docs = snapshot.docs.map(d => ({ ...d.data(), id: d.id, ref: d.ref }));
                 
                 // Group duplicates
                 const groups = {};
                 docs.forEach(doc => {
                     // Create a unique signature based on content
                     const signature = `${doc.date}|${doc.memberId}|${doc.symbol}|${doc.type}|${doc.shares}|${doc.price}`;
                     if (!groups[signature]) groups[signature] = [];
                     groups[signature].push(doc);
                 });

                 let toDelete = [];
                 Object.values(groups).forEach(group => {
                     if (group.length > 1) {
                         // Sort by creation time if available, otherwise just splice
                         // We keep the first one, delete the rest
                         toDelete = toDelete.concat(group.slice(1)); 
                     }
                 });

                 if (toDelete.length === 0) {
                     alert("未發現重複的交易紀錄");
                     return;
                 }

                 if (!confirm(`發現 ${toDelete.length} 筆重複資料，確定刪除嗎？`)) return;

                 // Batch Delete
                 const batch = writeBatch(db);
                 toDelete.forEach(d => batch.delete(d.ref));
                 await batch.commit();
                 
                 alert(`已移除 ${toDelete.length} 筆重複資料`);
                 setIsSettingsOpen(false);

             } catch (e) {
                 console.error(e);
                 alert("處理失敗: " + e.message);
             } finally {
                 setIsImporting(false);
             }
          };

          // --- Render Components ---
          const renderMonthFilter = () => (
            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
               <button onClick={() => setActiveMonth('all')} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${activeMonth === 'all' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>全年</button>
               {Array.from({length: 12}, (_, i) => i + 1).map(m => (
                   <button key={m} onClick={() => setActiveMonth(m)} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${activeMonth === m ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>{m}月</button>
               ))}
            </div>
          );

          if (isLocked) {
            return (
               <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl p-8 w-full max-w-sm shadow-2xl text-center">
                     <div className="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600"><Lock size={32}/></div>
                     <h2 className="text-2xl font-bold text-slate-800 mb-2">安全鎖定</h2>
                     <p className="text-slate-500 mb-6">請輸入 PIN 碼以存取您的資產資料</p>
                     <div className="flex gap-2 justify-center mb-6">
                        {[1,2,3,4].map((_, i) => (
                           <div key={i} className={`w-3 h-3 rounded-full ${pinInput.length > i ? 'bg-blue-600' : 'bg-slate-200'}`}></div>
                        ))}
                     </div>
                     <div className="grid grid-cols-3 gap-4 mb-4">
                        {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={() => setPinInput(p => (p.length < 4 ? p + n : p))} className="h-12 rounded-xl bg-slate-50 hover:bg-slate-100 font-bold text-lg text-slate-700 transition-colors">{n}</button>)}
                        <button onClick={() => setPinInput("")} className="h-12 rounded-xl bg-red-50 hover:bg-red-100 text-red-500 font-bold flex items-center justify-center">C</button>
                        <button onClick={() => setPinInput(p => (p.length < 4 ? p + '0' : p))} className="h-12 rounded-xl bg-slate-50 hover:bg-slate-100 font-bold text-lg text-slate-700">0</button>
                        <button onClick={handleUnlock} className="h-12 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold flex items-center justify-center"><ArrowRightLeft/></button>
                     </div>
                  </div>
               </div>
            );
          }

          if (loading) return <div className="min-h-screen flex items-center justify-center text-slate-400"><RefreshCw className="animate-spin mr-2"/> 載入資料中...</div>;

          return (
            <div className="min-h-screen pb-20 md:pb-8">
              {/* Header */}
              <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="bg-blue-600 p-2 rounded-lg text-white"><TrendingUp size={20} /></div>
                    <h1 className="font-bold text-lg text-slate-800 hidden md:block">家庭資產管家</h1>
                  </div>
                  
                  <div className="flex items-center gap-2 md:gap-3">
                     {/* 新增成員按鈕 (移至右上角) */}
                     <button onClick={() => setIsAddMemberOpen(true)} className="flex items-center gap-1 text-sm font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors border border-blue-100">
                        <Users size={16}/>
                        <Plus size={14} strokeWidth={3}/>
                        <span className="hidden md:inline">成員</span>
                     </button>
                     
                     <div className="h-6 w-px bg-slate-200 mx-1"></div>

                     <select value={activeYear} onChange={e => setActiveYear(e.target.value)} className="bg-slate-100 text-slate-700 text-sm font-medium px-2 py-1.5 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer hover:bg-slate-200 transition-colors">
                        {availableYears.map(y => <option key={y} value={y}>{y}年度</option>)}
                     </select>
                     <Button variant="secondary" onClick={() => setIsSettingsOpen(!isSettingsOpen)} className="!px-2"><Settings size={18}/></Button>
                  </div>
                </div>
                {/* Settings Dropdown */}
                {isSettingsOpen && (
                    <div className="bg-slate-50 border-b border-slate-200 p-4 animate-in slide-in-from-top-2">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-4 items-center justify-between">
                            <div className="flex gap-2 items-center w-full md:w-auto">
                                <input type="password" placeholder="設定新 PIN 碼 (4位)" maxLength={4} value={newPin} onChange={e => setNewPin(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm w-full"/>
                                <Button onClick={handleSetPin} className="whitespace-nowrap">設定鎖定</Button>
                            </div>
                            <div className="flex gap-2 flex-wrap">
                                <Button variant="secondary" onClick={handleExport}><Upload size={16}/> 匯出備份</Button>
                                <Button variant="secondary" onClick={() => setIsImportOpen(true)}><RefreshCw size={16}/> 匯入資料</Button>
                                {/* 新增：移除重複資料按鈕 */}
                                <Button variant="warning" onClick={handleRemoveDuplicates} isLoading={isImporting}><Copy size={16}/> 移除重複</Button>
                                <div className="w-px h-8 bg-slate-200 mx-1 hidden md:block"></div>
                                <Button variant="danger" onClick={handleClearAllData} isLoading={isImporting}><Trash2 size={16}/> 清空資料</Button>
                            </div>
                        </div>
                    </div>
                )}
              </header>

              <main className="max-w-5xl mx-auto px-4 py-6 space-y-6">
                
                {/* Tabs */}
                <div className="flex bg-slate-100 p-1 rounded-xl w-full md:w-fit">
                    {['overview', 'holdings'].map(tab => (
                        <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 md:flex-none px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === tab ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
                            {{overview: '總覽', holdings: '庫存'}[tab]}
                        </button>
                    ))}
                </div>

                {activeTab === 'overview' && (
                  <div className="space-y-6 animate-in fade-in duration-300">
                    {/* Hero Stats */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <Card className="p-4 bg-gradient-to-br from-blue-500 to-blue-600 text-white border-none col-span-2">
                            <div className="text-blue-100 text-sm font-medium mb-1">總資產市值</div>
                            <div className="text-3xl font-bold">{formatNumber(Math.round(totalMarketValue))}</div>
                            <div className="flex items-center gap-2 mt-2 text-blue-100 text-sm">
                                <span className={`px-1.5 py-0.5 rounded ${totalProfit >= 0 ? 'bg-white/20' : 'bg-red-900/20'}`}>{totalProfit >= 0 ? '+' : ''}{formatCurrency(totalProfit)}</span>
                                <span>({totalProfitPercent.toFixed(1)}%)</span>
                            </div>
                        </Card>
                        <StatBox label="總投入成本" value={formatCurrency(totalCost)} icon={DollarSign} />
                        <StatBox label="已實現損益" value={formatCurrency(totalRealized)} type={totalRealized >= 0 ? "positive" : "negative"} icon={totalRealized >= 0 ? TrendingUp : TrendingDown} />
                    </div>

                    {/* Chart Section */}
                    <div className="grid md:grid-cols-3 gap-6">
                       <div className="md:col-span-2 space-y-4">
                          <div className="flex justify-between items-center flex-wrap gap-2">
                             <h2 className="font-bold text-slate-800">資產分佈</h2>
                             <div className="flex items-center gap-2">
                                 {/* 移除了自動更新按鈕 */}
                                 <Button variant="ghost" onClick={handleUpdatePrices} isLoading={updatingPrices} className="text-xs h-8">
                                    <RefreshCw size={14} className="mr-1"/> 更新股價
                                 </Button>
                             </div>
                             {priceUpdateMsg && <div className={`text-xs text-center flex items-center justify-center gap-1 w-full md:w-auto ${priceUpdateMsg.includes('失敗') ? 'text-red-500' : 'text-emerald-600'}`}><AlertCircle size={12} /> {priceUpdateMsg}</div>}
                          </div>
                          
                          <Card className="p-6">
                             <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Activity size={20} className="text-blue-500"/>{activeYear} 年度資產趨勢 (堆疊圖)</h3>
                             <div className="h-64 w-full text-xs">
                                <ResponsiveContainer width="100%" height="100%">
                                  <AreaChart data={trendData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                    <defs><linearGradient id="colorValue" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3B82F6" stopOpacity={0.1}/><stop offset="95%" stopColor="#3B82F6" stopOpacity={0}/></linearGradient></defs>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0"/>
                                    <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill: '#64748B'}} />
                                    <YAxis hide domain={['auto', 'auto']} />
                                    <RechartsTooltip formatter={(value) => formatCurrency(value)} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}/>
                                    <Legend verticalAlign="top" height={36}/>
                                    
                                    {/* Total Line */}
                                    <Line type="monotone" dataKey="invested" name="總成本" stroke="#94A3B8" strokeWidth={2} strokeDasharray="5 5" dot={false} />
                                    
                                    {/* Member Areas */}
                                    {members.map((member, index) => (
                                        <Area 
                                            key={member.id}
                                            type="monotone" 
                                            dataKey={member.id} 
                                            name={member.name} 
                                            stackId="1" 
                                            stroke={COLORS[index % COLORS.length]} 
                                            fill={COLORS[index % COLORS.length]} 
                                            fillOpacity={0.6}
                                        />
                                    ))}
                                  </AreaChart>
                                </ResponsiveContainer>
                             </div>
                          </Card>
                       </div>

                       <div className="space-y-4">
                          <h2 className="font-bold text-slate-800">成員概況</h2>
                          <div className="space-y-3">
                             {memberStats.map(m => (
                                <Card 
                                    key={m.id} 
                                    className="p-4 flex flex-col gap-2 cursor-pointer hover:shadow-md hover:border-blue-300 transition-all"
                                    onClick={() => setSelectedMember(m)}
                                >
                                   <div className="flex justify-between items-center">
                                      <span className="font-bold text-slate-700">{m.name}</span>
                                      <span className="text-xs bg-slate-100 px-2 py-1 rounded-full text-slate-500">{((m.value/totalMarketValue)*100 || 0).toFixed(0)}%</span>
                                   </div>
                                   <div className="text-xl font-bold text-slate-800">{formatNumber(Math.round(m.value))}</div>
                                   <div className={`text-xs font-medium flex items-center gap-1 ${m.profit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                      {m.profit >= 0 ? <TrendingUp size={12}/> : <TrendingDown size={12}/>}
                                      {formatCurrency(m.profit)}
                                   </div>
                                </Card>
                             ))}
                          </div>
                       </div>
                    </div>
                  </div>
                )}

                {activeTab === 'holdings' && (
                   <div className="space-y-4 animate-in fade-in duration-300">
                      {/* Sub-Tabs for Holdings */}
                      <div className="flex justify-between items-center mb-2">
                        <div className="flex p-1 bg-slate-200 rounded-lg">
                            <button 
                                onClick={() => setHoldingViewMode('portfolio')} 
                                className={`px-4 py-1.5 rounded-md text-sm font-bold flex items-center gap-2 transition-all ${holdingViewMode === 'portfolio' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                            >
                                <LayoutList size={16}/> 庫存總覽
                            </button>
                            <button 
                                onClick={() => setHoldingViewMode('history')} 
                                className={`px-4 py-1.5 rounded-md text-sm font-bold flex items-center gap-2 transition-all ${holdingViewMode === 'history' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                            >
                                <List size={16}/> 交易紀錄
                            </button>
                        </div>

                        <Button onClick={() => { setEditingHolding(null); setHoldingForm({...holdingForm, symbol:'', name:'', shares:'', price:''}); setIsAddHoldingOpen(true); }}>
                            <Plus size={18}/> <span className="hidden md:inline">新增交易</span>
                        </Button>
                      </div>

                      {renderMonthFilter()}

                      {holdingViewMode === 'portfolio' ? (
                         // 庫存總覽模式 (Card View)
                         <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {aggregatedHoldings.map((h, i) => (
                               <Card key={i} className="p-4 relative group">
                                  <div className="flex justify-between items-start mb-2">
                                     <div>
                                        <div className="flex items-center gap-2">
                                           <span className="font-bold text-lg text-slate-800">{h.name}</span>
                                           <span className="text-xs text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">{h.symbol}</span>
                                        </div>
                                        {/* 修改：將持股數移至此處顯示，讓下方空間顯示成本價 */}
                                        <div className="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                                            <Users size={12}/> {h.memberName} <span className="text-slate-300">|</span> {formatNumber(h.shares)}股
                                        </div>
                                     </div>
                                     <div className={`text-right ${h.unrealizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                        <div className="font-bold text-lg">{h.unrealizedProfitPercent.toFixed(1)}%</div>
                                        <div className="text-xs">報酬率</div>
                                     </div>
                                  </div>
                                  
                                  {/* 三欄式佈局：顯示 均價、現價、市值 */}
                                  <div className="grid grid-cols-3 gap-2 py-3 border-t border-slate-50 mt-2">
                                     {/* 第一欄：均價與總成本 */}
                                     <div>
                                        <div className="text-[10px] text-slate-400 uppercase mb-0.5">均價 / 總成本</div>
                                        {/* 顯示平均成本價 */}
                                        <div className="font-bold text-slate-700">{formatNumber(parseFloat(h.avgCost.toFixed(2)))}</div>
                                        <div className="text-xs text-slate-400">{formatCurrency(h.totalCost)}</div>
                                     </div>
                                     
                                     {/* 第二欄：現價 */}
                                     <div className="text-center border-l border-r border-slate-50">
                                        <div className="text-[10px] text-slate-400 uppercase mb-0.5">現價</div>
                                        <div className={`font-bold text-base ${h.dailyChangePercent >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                            {h.currentPrice || '-'}
                                        </div>
                                        <div className="text-[10px] text-slate-400">
                                            {h.dailyChangePercent ? `${h.dailyChangePercent > 0 ? '+' : ''}${h.dailyChangePercent.toFixed(1)}%` : '-'}
                                        </div>
                                     </div>

                                     {/* 第三欄：市值與損益 */}
                                     <div className="text-right">
                                        <div className="text-[10px] text-slate-400 uppercase mb-0.5">市值 / 損益</div>
                                        <div className="font-bold text-blue-600">{formatCurrency(h.marketValue)}</div>
                                        <div className={`text-xs font-medium ${h.unrealizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                           {h.unrealizedProfit >= 0 ? '+' : ''}{formatCurrency(h.unrealizedProfit)}
                                        </div>
                                     </div>
                                  </div>
                               </Card>
                            ))}
                            {aggregatedHoldings.length === 0 && <div className="col-span-full text-center py-10 text-slate-400">尚無庫存資料</div>}
                         </div>
                      ) : (
                         // 交易紀錄模式 (List View) - 顯示所有明細
                         // 優化：手機版表格容器改為 rounded-xl，避免 scrollbar 在某些瀏覽器被 cut
                         <div className="bg-white rounded-xl border border-slate-200">
                            <div className="overflow-x-auto rounded-xl">
                                <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-500 font-medium whitespace-nowrap cursor-pointer select-none">
                                    <tr>
                                        <th className="p-3 hover:bg-slate-100 transition-colors" onClick={() => handleSort('date')}>日期 <SortIcon column="date"/></th>
                                        <th className="p-3 hover:bg-slate-100 transition-colors" onClick={() => handleSort('type')}>類別 <SortIcon column="type"/></th>
                                        <th className="p-3 hover:bg-slate-100 transition-colors" onClick={() => handleSort('symbol')}>標的 <SortIcon column="symbol"/></th>
                                        <th className="p-3 hover:bg-slate-100 transition-colors" onClick={() => handleSort('memberId')}>成員 <SortIcon column="memberId"/></th>
                                        <th className="p-3 text-right hover:bg-slate-100 transition-colors" onClick={() => handleSort('shares')}>股數 <SortIcon column="shares"/></th>
                                        <th className="p-3 text-right hover:bg-slate-100 transition-colors" onClick={() => handleSort('price')}>單價 <SortIcon column="price"/></th>
                                        <th className="p-3 text-right hover:bg-slate-100 transition-colors" onClick={() => handleSort('fee')}>手續費 <SortIcon column="fee"/></th>
                                        <th className="p-3 text-right hover:bg-slate-100 transition-colors" onClick={() => handleSort('total')}>總金額 <SortIcon column="total"/></th>
                                        <th className="p-3 w-10"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {sortedHistory.map(h => (
                                        <tr 
                                            key={h.id} 
                                            className="hover:bg-slate-50 group cursor-pointer transition-colors"
                                            onClick={() => { setEditingHolding(h); setHoldingForm({...h, date: h.date, fee: h.fee || 1}); setIsAddHoldingOpen(true); }}
                                        >
                                            <td className="p-3 text-slate-500 whitespace-nowrap">{h.date}</td>
                                            <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${h.type === 'buy' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'}`}>{h.type === 'buy' ? '買進' : '賣出'}</span></td>
                                            <td className="p-3"><div className="font-bold text-slate-700">{h.name}</div><div className="text-xs text-slate-400">{h.symbol}</div></td>
                                            <td className="p-3 text-slate-600 whitespace-nowrap">{members.find(m => m.id === h.memberId)?.name}</td>
                                            <td className="p-3 text-right font-medium text-slate-700">{formatNumber(h.shares)}</td>
                                            <td className="p-3 text-right text-slate-600">{h.price}</td>
                                            <td className="p-3 text-right text-slate-400">{h.fee}</td>
                                            <td className={`p-3 text-right font-bold ${h.type === 'buy' ? 'text-slate-700' : 'text-emerald-600'}`}>
                                                {formatNumber(Math.round(h.shares * h.price + (h.type === 'buy' ? 1 : -1) * (h.fee || 0)))}
                                            </td>
                                            <td className="p-3 flex justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                {/* 編輯按鈕已移除，改為點擊整列觸發 */}
                                                <button 
                                                    onClick={(e) => { 
                                                        e.stopPropagation(); // 防止觸發 tr 的 onClick
                                                        handleDeleteHolding(h.id); 
                                                    }} 
                                                    className="p-1.5 text-red-500 hover:bg-red-50 rounded"
                                                >
                                                    <Trash2 size={14}/>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {holdings.length === 0 && <tr><td colSpan="9" className="p-8 text-center text-slate-400">此區間無交易紀錄</td></tr>}
                                </tbody>
                                </table>
                            </div>
                         </div>
