                    if (!res.ok) throw new Error("CodeTabs failed");
                    const text = await res.text();
                    try { return JSON.parse(text); } catch(e) { return text; }
                });

            // 代理三：CorsProxy.io (備用)
            const p3 = fetchWithTimeout(`https://corsproxy.io/?url=${encodedUrl}`, timeoutMs)
                .then(async res => {
                    if (!res.ok) throw new Error("CorsProxy failed");
                    const text = await res.text();
                    try { return JSON.parse(text); } catch(e) { return text; }
                });

            try {
                // 競速模式：三個代理誰先成功回傳正常資料，就用誰的！
                return await Promise.any([p1, p2, p3]);
            } catch (e) {
                return null;
            }
        };

        const parseTwsePrice = (result) => {
             let price = parseFloat(result.z);
             
             // 若盤中無成交 (z為空)，尋找試撮價 (pz)
             if (isNaN(price) && result.pz && result.pz !== '-') price = parseFloat(result.pz);
             // 漲停/跌停鎖死時，尋找掛單第一筆 (b買價, a賣價)
             if (isNaN(price) && typeof result.b === 'string' && result.b !== '-') price = parseFloat(result.b.split('_')[0]);
             if (isNaN(price) && typeof result.a === 'string' && result.a !== '-') price = parseFloat(result.a.split('_')[0]);
             // 依然無價，抓昨收價(y)
             if (isNaN(price) && result.y && result.y !== '-') price = parseFloat(result.y);
             
             const yesterday = parseFloat(result.y);
             let change = 0;
             let changePercent = 0;
             
             if (!isNaN(price) && !isNaN(yesterday) && yesterday > 0) {
                 change = price - yesterday;
                 changePercent = (change / yesterday) * 100;
             }
             
             return { price: isNaN(price) ? 0 : price, change, changePercent, yesterday };
        };

        const fetchStockData = async (code, type) => {
            if (!code) return null;
            const uCode = code.trim().toUpperCase(); 
            const query = `tse_${uCode}.tw|otc_${uCode}.tw`;
            const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${query}&json=1&delay=0`;
            
            try {
                const data = await fetchWithDualProxy(twseUrl, 4000);
                const result = data?.msgArray?.find(item => item.c === uCode);
                
                if (result) {
                  const parsed = parseTwsePrice(result);
                  if (parsed.price > 0) {
                      return { price: parsed.price, change: parsed.change, changePercent: parsed.changePercent, name: result.n, source: 'TWSE' };
                  }
                }
            } catch (e) {}

            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/spark?symbols=${uCode}.TW,${uCode}.TWO`;
            try {
               const data = await fetchWithDualProxy(yahooUrl, 4000);
               if (data?.spark?.result?.length > 0) {
                  const validQuote = data.spark.result.find(q => q.response?.[0]?.meta?.regularMarketPrice > 0)?.response[0].meta;
                  if (validQuote) {
                      const prevClose = validQuote.previousClose || validQuote.chartPreviousClose;
                      const changePercent = prevClose ? ((validQuote.regularMarketPrice - prevClose) / prevClose) * 100 : 0;
                      return { price: validQuote.regularMarketPrice, change: validQuote.regularMarketPrice - prevClose, changePercent: changePercent, name: uCode, source: 'Yahoo' };
                  }
               }
            } catch (e) {}
            
            // 第三重防線：強制網頁爬蟲
            try {
                const htmlUrl = `https://tw.stock.yahoo.com/quote/${uCode}`;
                const html = await fetchWithDualProxy(htmlUrl, 4000);
                if (typeof html === 'string') {
                    const match = html.match(/window\.__INITIAL_STATE__\s*=\s*(\{.*?\});/);
                    if (match) {
                        const stateStr = match[1];
                        const priceMatch = stateStr.match(/"regularMarketPrice":([0-9.]+)/);
                        const prevMatch = stateStr.match(/"regularMarketPreviousClose":([0-9.]+)/) || stateStr.match(/"previousClose":([0-9.]+)/);
                        if (priceMatch) {
                            const price = parseFloat(priceMatch[1]);
                            const prev = prevMatch ? parseFloat(prevMatch[1]) : price;
                            const changePercent = prev ? ((price - prev)/prev)*100 : 0;
                            return { price, change: price - prev, changePercent, name: uCode, source: 'YahooHTML' };
                        }
                    }
                }
            } catch(e) {}

            return null; 
        };

        const fetchHistoryForSymbol = async (symbol, range = '1mo') => {
            const uCode = symbol.trim().toUpperCase(); 
            let url = `https://query1.finance.yahoo.com/v8/finance/chart/${uCode}.TW?range=${range}&interval=1d`;
            let data = await fetchWithDualProxy(url);
            
            if (!data?.chart?.result) {
                url = `https://query1.finance.yahoo.com/v8/finance/chart/${uCode}.TWO?range=${range}&interval=1d`;
                data = await fetchWithDualProxy(url);
            }
            
            if (data?.chart?.result?.[0]) {
                const result = data.chart.result[0];
                const timestamps = result.timestamp || [];
                const closes = result.indicators?.quote?.[0]?.close || [];
                const historyMap = {};
                
                timestamps.forEach((ts, idx) => {
                    if (closes[idx] !== null && closes[idx] !== undefined) {
                        const date = new Date(ts * 1000);
                        const dateStr = getLocalYMD(date);
                        historyMap[dateStr] = closes[idx];
                    }
                });
                return historyMap;
            }
            return null;
        };

        const MemberDetailModal = ({ isOpen, onClose, member, allHoldings, year, historicalPrices }) => {
            const [timeRange, setTimeRange] = useState('1Y');
            
            const memberHoldings = useMemo(() => {
                if (!member) return { items: [], totalValue: 0 }; 
                const memberData = allHoldings.filter(h => h.memberId === member.id);
                const grouped = {};
                memberData.forEach(h => {
                    const sym = h.symbol;
                    if (!grouped[sym]) grouped[sym] = { symbol: sym, name: h.name, shares: 0, currentPrice: h.currentPrice || 0, marketValue: 0 };
                    const qty = parseFloat(h.shares);
                    grouped[sym].shares += qty;
                });
                
                let totalVal = 0;
                const result = Object.values(grouped).map(g => {
                    const mv = g.shares * g.currentPrice;
                    g.marketValue = mv;
                    totalVal += mv;
                    return g;
                }).filter(g => g.shares > 0).sort((a, b) => b.marketValue - a.marketValue);
                
                return { items: result, totalValue: totalVal };
            }, [member, allHoldings]);

            const memberTrend = useMemo(() => {
                if (!member) return [];
                const today = new Date();
                const start = new Date();
                today.setHours(23, 59, 59, 999);
                
                switch(timeRange) {
                    case '1M': start.setMonth(today.getMonth() - 1); break;
                    case '3M': start.setMonth(today.getMonth() - 3); break;
                    case '6M': start.setMonth(today.getMonth() - 6); break;
                    case '1Y': start.setFullYear(today.getFullYear() - 1); break;
                    default: start.setFullYear(today.getFullYear() - 1);
                }
                start.setHours(0, 0, 0, 0);

                const priceMap = {};
                allHoldings.forEach(h => { if(h.currentPrice) priceMap[h.symbol] = h.currentPrice; });

                const memberTxs = allHoldings
                    .filter(h => h.memberId === member.id)
                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                let currentHoldings = {}; 
                let txIndex = 0;
                
                while (txIndex < memberTxs.length) {
                    const tx = memberTxs[txIndex];
                    const txDate = new Date(tx.date);
                    if (txDate < start) {
                        const qty = parseFloat(tx.shares);
                        currentHoldings[tx.symbol] = (currentHoldings[tx.symbol] || 0) + qty;
                        txIndex++;
                    } else {
                        break;
                    }
                }

                const data = [];
                for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
                    // 若不是交易日則跳過，不填入走勢圖中
                    if (!isTradingDay(d)) continue;
                    
                    const dateStr = getLocalYMD(d);
                    
                    while (txIndex < memberTxs.length) {
                        const tx = memberTxs[txIndex];
                        if (tx.date === dateStr || new Date(tx.date) < d) {
                             const qty = parseFloat(tx.shares);
                             currentHoldings[tx.symbol] = (currentHoldings[tx.symbol] || 0) + qty;
                             txIndex++;
                        } else {
                            break; 
                        }
                    }

                    let dailyValue = 0;
                    Object.entries(currentHoldings).forEach(([sym, shares]) => {
                        if (shares > 0) {
                            let price = priceMap[sym] || 0;
                            if (historicalPrices && historicalPrices[sym]) {
                                let tempDate = new Date(d);
                                for(let i=0; i<30; i++) {
                                    const tempStr = getLocalYMD(tempDate);
                                    if (historicalPrices[sym][tempStr]) {
                                        price = historicalPrices[sym][tempStr];
                                        break;
                                    }
                                    tempDate.setDate(tempDate.getDate() - 1);
                                }
                            }
                            dailyValue += shares * price;
                        }
                    });

                    data.push({
                        date: dateStr,
                        value: Math.round(dailyValue)
                    });
                }
                return data;
            }, [member, allHoldings, timeRange, historicalPrices]);

            const pieData = useMemo(() => {
                if (!memberHoldings || !memberHoldings.items) return [];
                const total = memberHoldings.totalValue;
                if (total === 0) return [];
                
                const data = memberHoldings.items.slice(0, 5).map(i => ({
                    name: i.name,
                    symbol: i.symbol,
                    value: i.marketValue,
                    percent: (i.marketValue / total) * 100
                }));
                
                const othersValue = memberHoldings.items.slice(5).reduce((sum, i) => sum + i.marketValue, 0);
                if (othersValue > 0) {
                    data.push({ name: '其他', symbol: 'Others', value: othersValue, percent: (othersValue / total) * 100 });
                }
                return data;
            }, [memberHoldings]);

            if (!isOpen || !member) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`${member.name} 的資產概況`} className="max-w-3xl">
                    <div className="space-y-8">
                        <div>
                             <div className="flex justify-between items-center mb-4">
                                <h4 className="font-bold text-slate-800 flex items-center gap-2"><Activity size={18} className="text-cyan-500"/> 證券資產趨勢圖</h4>
                                <div className="flex gap-1 p-1 bg-slate-100 rounded-full">
                                    {['1M', '3M', '6M', '1Y'].map(range => (
                                        <button 
                                            key={range}
                                            onClick={() => setTimeRange(range)}
                                            className={`px-3 py-1 text-xs font-bold rounded-full transition-all duration-300 ${
                                                timeRange === range 
                                                ? 'bg-cyan-500 text-white shadow-md transform scale-105' 
                                                : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'
                                            }`}
                                        >
                                            {range === '1Y' ? '1年' : range.replace('M', '月')}
                                        </button>
                                    ))}
                                </div>
                             </div>
                             <div className="h-64 w-full bg-white rounded-xl border border-slate-50 relative p-2">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={memberTrend} margin={{ top: 20, right: 10, left: -10, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorCyan" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#06b6d4" stopOpacity={0.2}/>
                                                <stop offset="95%" stopColor="#06b6d4" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                                        <XAxis 
                                            dataKey="date" 
                                            axisLine={false} 
                                            tickLine={false} 
                                            tick={{fill: '#94A3B8', fontSize: 11}} 
                                            tickFormatter={formatAxisDate}
                                            minTickGap={30}
                                        />
                                        <YAxis 
                                            axisLine={false} 
                                            tickLine={false} 
                                            tick={{fill: '#94A3B8', fontSize: 11}} 
                                            tickFormatter={formatAxisValue} 
                                            domain={['auto', 'auto']}
                                            width={45}
                                        />
                                        <RechartsTooltip 
                                            contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }}
                                            formatter={(value) => [formatCurrency(value), '總資產']}
                                            labelFormatter={formatAxisDate}
                                        />
                                        <Area 
                                            type="monotone" 
                                            dataKey="value" 
                                            stroke="#06b6d4" 
                                            strokeWidth={3}
                                            fillOpacity={1} 
                                            fill="url(#colorCyan)" 
                                            activeDot={{ r: 6, strokeWidth: 0, fill: '#0891b2', stroke: '#fff', strokeWidth: 2 }}
                                        />
                                        <Brush 
                                            dataKey="date" 
                                            height={30} 
                                            stroke="#cbd5e1" 
                                            tickFormatter={formatAxisDate}
                                            fill="#f8fafc"
                                        />
                                    </AreaChart>
                                </ResponsiveContainer>
                             </div>
                        </div>
                        <div className="border-t border-slate-100"></div>
                        <div>
                            <h4 className="font-bold text-slate-800 flex items-center gap-2 mb-4"><PieChartIcon size={18} className="text-cyan-500"/> 證券持股圓餅圖</h4>
                            <div className="flex flex-col md:flex-row items-center gap-8">
                                <div className="relative w-48 h-48 flex-shrink-0">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie 
                                                data={pieData} 
                                                innerRadius={60} 
                                                outerRadius={80} 
                                                paddingAngle={3} 
                                                dataKey="value"
                                                startAngle={90}
                                                endAngle={-270}
                                                cornerRadius={4}
                                            >
                                                {pieData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={FRESH_COLORS[index % FRESH_COLORS.length]} stroke="none"/>
                                                ))}
                                            </Pie>
                                        </PieChart>
                                    </ResponsiveContainer>
                                    <div className="donut-center-text flex flex-col items-center">
                                        <div className="text-xs text-slate-400 font-medium">TWD</div>
                                        <div className="text-lg font-bold text-slate-800">{formatNumber(memberHoldings.totalValue)}</div>
                                    </div>
                                </div>
                                <div className="flex-1 w-full space-y-3">
                                    {pieData.map((item, index) => (
                                        <div key={index} className="flex items-center justify-between text-sm group hover:bg-slate-50 p-2 rounded-lg transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="w-3 h-3 rounded-full shadow-sm" style={{ background: FRESH_COLORS[index % FRESH_COLORS.length] }}></div>
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-slate-700 leading-none">{item.symbol}</span>
                                                    <span className="text-xs text-slate-400 mt-1">{item.name}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-bold text-slate-700">{Math.round(item.percent)}%</div>
                                                <div className="text-xs text-slate-400">{formatCurrency(item.value)}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        };

        function App() {
          const [user, setUser] = useState(null);
          const [authLoading, setAuthLoading] = useState(true); 
          const [activeTab, setActiveTab] = useState('overview');
          const [members, setMembers] = useState([]);
          const [allHoldings, setAllHoldings] = useState([]); 
          const [loading, setLoading] = useState(true);

          const [historicalPrices, setHistoricalPrices] = useState({});
          const [isFetchingHistory, setIsFetchingHistory] = useState(false);
          const [historyLoaded, setHistoryLoaded] = useState(false);

          const [selectedMember, setSelectedMember] = useState(null);
          const [deleteConfirm, setDeleteConfirm] = useState(null); 

          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [hasPin, setHasPin] = useState(false);
          const [showUnlockModal, setShowUnlockModal] = useState(false);
          const [pinInput, setPinInput] = useState("");
          const [storedPin, setStoredPin] = useState(null);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [newPin, setNewPin] = useState("");
          
          const pendingActionRef = useRef(null);

          const currentYear = new Date().getFullYear().toString();
          const [activeYear, setActiveYear] = useState(currentYear);
          const [activeMonth, setActiveMonth] = useState('all');
          const [availableYears, setAvailableYears] = useState([currentYear]);
          const [mainTimeRange, setMainTimeRange] = useState('1Y'); 

          const [holdingViewMode, setHoldingViewMode] = useState('summary');
          const [listFilter, setListFilter] = useState({ memberId: null, symbol: null });

          const [updatingPrices, setUpdatingPrices] = useState(false);
          const [priceUpdateMsg, setPriceUpdateMsg] = useState("");
          const [lastUpdateTime, setLastUpdateTime] = useState(null);
          const [processingSettings, setProcessingSettings] = useState(false);

          const [isAddMemberOpen, setIsAddMemberOpen] = useState(false);
          const [isAddHoldingOpen, setIsAddHoldingOpen] = useState(false);
          const [editingHolding, setEditingHolding] = useState(null);

          const [loadingStockInfo, setLoadingStockInfo] = useState(false);
          const [newMemberName, setNewMemberName] = useState("");
          const [holdingForm, setHoldingForm] = useState({
            memberId: "", symbol: "", name: "", shares: "", price: "", fee: "1", date: getLocalYMD(), type: 'buy', note: "", year: currentYear
          });

          const fileInputRef = useRef(null);

          const [sortSummary, setSortSummary] = useState({ key: 'marketValue', direction: 'desc' });
          const [sortDetail, setSortDetail] = useState({ key: 'date', direction: 'desc' });

          const handleSortSummary = (key) => {
              setSortSummary(prev => ({ key, direction: prev.key === key && prev.direction === 'desc' ? 'asc' : 'desc' }));
          };
          
          const handleSortDetail = (key) => {
              setSortDetail(prev => ({ key, direction: prev.key === key && prev.direction === 'desc' ? 'asc' : 'desc' }));
          };
          
          const renderSortHeader = (label, key, currentSort, onSort, align="right") => {
              const isActive = currentSort.key === key;
              const isLeft = align === 'left';
              const isCenter = align === 'center';
              return (
                  <th className={`p-3 cursor-pointer hover:bg-slate-50 transition-colors select-none group/th ${isLeft ? 'pl-4 text-left' : isCenter ? 'text-center' : 'text-right'}`} onClick={() => onSort(key)}>
                      <div className={`flex items-center gap-1 ${isLeft ? 'justify-start' : isCenter ? 'justify-center' : 'justify-end'}`}>
                          {label}
                          <span className="text-slate-400 flex flex-col justify-center">
                              {isActive ? (
                                  currentSort.direction === 'asc' ? <ChevronUp size={14} className="text-blue-500" /> : <ChevronDown size={14} className="text-blue-500" />
                              ) : (
                                  <ArrowRightLeft size={14} className="opacity-0 group-hover/th:opacity-50 rotate-90 transition-opacity" />
                              )}
                          </span>
                      </div>
                  </th>
              );
          };

          const [dialogState, setDialogState] = useState({ isOpen: false, type: 'alert', title: '', message: '', onConfirm: null, onCloseCb: null });

          const showAlert = (message, title = "提示", onCloseCb = null) => {
              setDialogState({ isOpen: true, type: 'alert', title, message, onConfirm: null, onCloseCb });
          };

          const showConfirm = (message, onConfirm, title = "確認") => {
              setDialogState({ isOpen: true, type: 'confirm', title, message, onConfirm, onCloseCb: null });
          };

          const closeDialog = () => {
              const cb = dialogState.onCloseCb;
              setDialogState(prev => ({ ...prev, isOpen: false }));
              if (cb) cb();
          };

          const handleGoogleSignIn = async () => {
              try {
                  await signInWithPopup(auth, googleProvider);
              } catch (error) {
                  console.error("Google Login Error:", error);
                  showAlert("登入失敗: " + error.message, "錯誤");
              }
          };

          const handleSignOut = async () => {
              try {
                  await signOut(auth);
                  setAllHoldings([]);
                  setMembers([]);
                  setHistoricalPrices({});
                  setHasPin(false);
                  setIsAuthenticated(false);
              } catch (error) {
                  console.error("Sign Out Error:", error);
              }
          };

          useEffect(() => {
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (error) {
                        console.error("Auth init error:", error);
                    }
                }
            };
            initAuth();

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              setAuthLoading(false);
            });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;
            const userId = user.uid;

            const checkSecurity = async () => {
              try {
                const settingsRef = doc(db, 'artifacts', appId, 'users', userId, 'settings', 'security');
                const snap = await getDoc(settingsRef);
                if (snap.exists() && snap.data().pin) {
                  setHasPin(true);
                  setStoredPin(snap.data().pin);
                  setIsAuthenticated(false);
                } else {
                  setHasPin(false);
                  setIsAuthenticated(true);
                }
              } catch (e) {
                setIsAuthenticated(false); 
              }
            };
            checkSecurity();

            const membersRef = collection(db, 'artifacts', appId, 'users', userId, 'members');
            const unsubMembers = onSnapshot(membersRef, (snapshot) => {
              setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });

            const holdingsRef = collection(db, 'artifacts', appId, 'users', userId, 'holdings');
            const unsubHoldings = onSnapshot(holdingsRef, (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAllHoldings(data);
              setLoading(false);
                
              const years = new Set(data.map(h => h.year || currentYear));
              years.add(currentYear);
              const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));
              setAvailableYears(sortedYears);

              if (data.length > 0) {
                const maxTime = Math.max(...data.map(h => h.lastUpdateTimestamp || 0));
                if (maxTime > 0) setLastUpdateTime(new Date(maxTime * 1000));
              }
            });

            const historyRef = collection(db, 'artifacts', appId, 'users', userId, 'priceHistory');
            const unsubHistory = onSnapshot(historyRef, (snapshot) => {
                const historyData = {};
                snapshot.docs.forEach(doc => {
                    if (doc.data().history) {
                        historyData[doc.id] = doc.data().history;
                    }
                });
                setHistoricalPrices(historyData);
                setHistoryLoaded(true);
            });

            return () => { unsubMembers(); unsubHoldings(); unsubHistory(); };
          }, [user]);

          useEffect(() => {
              if (!historyLoaded || allHoldings.length === 0 || !user) return;
              const userId = user.uid;
              const uniqueSymbols = [...new Set(allHoldings.map(h => h.symbol))];
              const symbolsToFetch = uniqueSymbols.filter(sym => !historicalPrices[sym] || Object.keys(historicalPrices[sym]).length < 10);
              
              if (symbolsToFetch.length === 0) return;

              let isMounted = true;
              const loadHistory = async () => {
                  setIsFetchingHistory(true);
                  for (const sym of symbolsToFetch) {
                      try {
                          const historyMap = await fetchHistoryForSymbol(sym, '1y'); 
                          if (isMounted && historyMap) {
                              const historyDocRef = doc(db, 'artifacts', appId, 'users', userId, 'priceHistory', sym);
                              await setDoc(historyDocRef, {
                                  history: historyMap,
                                  lastUpdated: Math.floor(Date.now() / 1000)
                              }, { merge: true });
                          }
                      } catch (e) { console.error("Failed to fetch history for " + sym, e); }
                      await new Promise(r => setTimeout(r, 800));
                  }
                  if (isMounted) setIsFetchingHistory(false);
              };

              loadHistory();
              return () => { isMounted = false; };
          }, [allHoldings, historicalPrices, historyLoaded, user]);

                groups[key] = {
                  symbol: tx.symbol, name: tx.name, memberId: tx.memberId, memberName: member ? member.name : 'Unknown',
                  shares: 0, totalCost: 0, realizedProfit: 0, currentPrice: 0, dailyChangePercent: 0, txCount: 0
                };

              const group = groups[key];

              if (tx.dailyChangePercent) group.dailyChangePercent = tx.dailyChangePercent;

              const qty = tx.shares;
              const unitCost = tx.cost;
              if (qty > 0) {
                group.shares += qty;
                group.totalCost += (qty * unitCost);
              } else {
                const avgCost = group.shares > 0 ? group.totalCost / group.shares : 0;
                const sellQty = Math.abs(qty);
                const revenue = sellQty * unitCost;
                const costBasis = sellQty * avgCost;
                
                group.realizedProfit += (revenue - costBasis);
                group.shares -= sellQty;
                group.totalCost -= costBasis;
              }
              group.txCount++;
            });
            return Object.values(groups).map(g => {

            const sortedTxs = [...allHoldings].sort((a, b) => new Date(a.date) - new Date(b.date));
            const portfolios = {};
            members.forEach(m => portfolios[m.id] = {});

            let txIndex = 0;
            while(txIndex < sortedTxs.length) {
                const tx = sortedTxs[txIndex];
                if (new Date(tx.date) < startDate) {
                    const mId = tx.memberId;
                    const sym = tx.symbol;
                    if (portfolios[mId]) portfolios[mId][sym] = (portfolios[mId][sym] || 0) + parseFloat(tx.shares);
                    txIndex++;
                } else break;
            }

            const data = [];
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                // 若不是交易日則跳過，不填入走勢圖中
                if (!isTradingDay(d)) continue;
                
                const dateStr = getLocalYMD(d);
                while(txIndex < sortedTxs.length) {
                    const tx = sortedTxs[txIndex];
                    if (tx.date === dateStr || new Date(tx.date) < d) {
                         const mId = tx.memberId;
                         const sym = tx.symbol;

                         txIndex++;
                    } else break;
                }

                const dataPoint = { date: dateStr };
                let totalVal = 0;

                members.forEach(m => {

                    const mPortfolio = portfolios[m.id];

                        Object.entries(mPortfolio).forEach(([sym, qty]) => {

                                        tempDate.setDate(tempDate.getDate() - 1);

                            }
                        });
                    }
                    dataPoint[m.id] = Math.round(memberVal);
                    totalVal += memberVal;

                    const changeRaw = item.Change ? item.Change.replace(/[^0-9.-]/g, '') : "0";
                    const change = parseFloat(changeRaw) || 0;
                    
                    if (!isNaN(price) && price > 0) {
                        const prev = price - change; // 推算昨收
                        const changePercent = prev > 0 ? (change / prev) * 100 : 0;
                        officialPriceMap[item.Code] = { price, changePercent };
                    }
                });

                // 2. 解析上櫃資料
                tpexData.forEach(item => {
                    const price = parseFloat(item.Close);

                    const change = parseFloat(changeRaw) || 0;
                    
                    if (!isNaN(price) && price > 0) {
                        const prev = price - change;

                        officialPriceMap[item.SecuritiesCompanyCode] = { price, changePercent };

                });

                const batch = writeBatch(db);
                const now = Math.floor(Date.now() / 1000);
