<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭資產管家 (單檔測試版)</title>

    <!-- 1. 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' },
              cyan: { 50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490' }
            }
          }
        }
      }
    </script>

    <!-- 2. Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.378.0?external=react,react-dom"
      }
    }
    </script>

    <!-- 3. Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Global Styles -->
    <style>
      body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      /* Custom Animation for Pulse */
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: .7; }
      }
      .animate-pulse-soft { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      
      /* Donut Chart Center Text centering */
      .donut-center-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 5. 主要程式碼 -->
    <script type="text/babel" data-type="module">
        // --- 導入套件 (使用 Import Map 定義的名稱) ---
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { PieChart, Pie, Cell, ResponsiveContainer, Tooltip as RechartsTooltip, Legend, LineChart, Line, XAxis, YAxis, CartesianGrid, Area, AreaChart } from 'recharts';
        import { Plus, Trash2, Edit2, TrendingUp, TrendingDown, Users, DollarSign, RefreshCw, PieChart as PieChartIcon, Save, X, AlertCircle, Upload, FileText, Clock, ShieldCheck, Search, Calendar, ChevronDown, Filter, ArrowRightLeft, StickyNote, Layers, List, Activity, Lock, Settings, Unlock, Loader2, ChevronRight, XCircle, UserPlus, AlertTriangle, Download, FileJson, Copy } from 'lucide-react';

        // Firebase (保持 CDN 連結)
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, writeBatch, getDoc, setDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyC2mxpOL7hzieOBCv_7rPI6E-xpCe6DznA",
            authDomain: "familystockprofolio.firebaseapp.com",
            projectId: "familystockprofolio",
            storageBucket: "familystockprofolio.appspot.com",
            messagingSenderId: "338950854674",
            appId: "1:338950854674:web:0f56f1082c5053782780e0"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "github-web-version";

        // --- 元件定義 ---
        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden ${className}`}>
            {children}
          </div>
        );

        const Button = ({ onClick, children, variant = 'primary', className = "", disabled = false, isLoading = false }) => {
          const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
          const variants = {
            primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-sm hover:shadow-md",
            secondary: "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50",
            danger: "bg-red-50 text-red-600 hover:bg-red-100 border border-red-100",
            ghost: "text-slate-500 hover:bg-slate-100",
            buy: "bg-red-500 text-white hover:bg-red-600 shadow-sm",
            sell: "bg-emerald-500 text-white hover:bg-emerald-600 shadow-sm",
            buyActive: "bg-red-600 text-white shadow-inner",
            sellActive: "bg-emerald-600 text-white shadow-inner",
          };
          return (
            <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`} disabled={disabled || isLoading}>
              {isLoading ? <Loader2 size={18} className="animate-spin" /> : children}
            </button>
          );
        };

        const Input = ({ label, value, onChange, onBlur, type = "text", placeholder, className = "" }) => (
          <div className={`flex flex-col gap-1 ${className}`}>
            {label && <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{label}</label>}
            <input
              type={type}
              value={value}
              onChange={onChange}
              onBlur={onBlur}
              placeholder={placeholder}
              className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all text-slate-800"
            />
          </div>
        );

        const Modal = ({ isOpen, onClose, title, children, className = "max-w-md" }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in duration-200">
              <div className={`bg-white rounded-2xl w-full ${className} shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]`}>
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 flex-shrink-0">
                  <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                  <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-200 text-slate-500 transition-colors"><X size={20} /></button>
                </div>
                <div className="p-6 overflow-y-auto flex-1">{children}</div>
              </div>
            </div>
          );
        };

        // --- 格式化工具 ---
        const formatCurrency = (value) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(value);
        const formatNumber = (value) => new Intl.NumberFormat('zh-TW').format(value);
        const COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#6366F1'];
        const FRESH_COLORS = ['#06b6d4', '#22d3ee', '#4ade80', '#facc15', '#f87171', '#a78bfa', '#fbbf24'];

        // --- 成員詳細分析視窗元件 ---
        const MemberDetailModal = ({ isOpen, onClose, member, allHoldings, year }) => {
            const [timeRange, setTimeRange] = useState('1Y'); // 1M, 3M, 6M, 1Y
            
            // Hook 1: memberHoldings
            const memberHoldings = useMemo(() => {
                if (!member) return { items: [], totalValue: 0 }; 
                const memberData = allHoldings.filter(h => h.memberId === member.id);
                const grouped = {};
                memberData.forEach(h => {
                    const sym = h.symbol;
                    if (!grouped[sym]) grouped[sym] = { symbol: sym, name: h.name, shares: 0, currentPrice: h.currentPrice || 0, marketValue: 0 };
                    const qty = parseFloat(h.shares);
                    grouped[sym].shares += qty;
                });
                
                let totalVal = 0;
                const result = Object.values(grouped).map(g => {
                    const mv = g.shares * g.currentPrice;
                    g.marketValue = mv;
                    totalVal += mv;
                    return g;
                }).filter(g => g.shares > 0).sort((a, b) => b.marketValue - a.marketValue);
                
                return { items: result, totalValue: totalVal };
            }, [member, allHoldings]);

            // Hook 2: memberTrend
            const memberTrend = useMemo(() => {
                if (!member) return [];
                const months = Array.from({ length: 12 }, (_, i) => i + 1);
                const yearTxs = allHoldings
                  .filter(h => (h.year || new Date().getFullYear().toString()) === year)
                  .sort((a, b) => new Date(a.date) - new Date(b.date));
                
                const priceMap = {};
                allHoldings.forEach(h => { if(h.currentPrice) priceMap[h.symbol] = h.currentPrice; });

                let runningPortfolio = {}; 

                const fullData = months.map(month => {
                    const monthlyTxs = yearTxs.filter(h => {
                        const m = parseInt(h.date?.split('-')[1] || 0, 10);
                        return m === month;
                    });

                    monthlyTxs.forEach(tx => {
                        if (tx.memberId !== member.id) return;
                        const sym = tx.symbol;
                        const qty = parseFloat(tx.shares);
                        runningPortfolio[sym] = (runningPortfolio[sym] || 0) + qty;
                    });

                    let monthValue = 0;
                    Object.entries(runningPortfolio).forEach(([sym, shares]) => {
                        if (shares > 0) {
                            const price = priceMap[sym] || 0; 
                            monthValue += shares * price;
                        }
                    });

                    return { name: `${month}月`, value: Math.round(monthValue) };
                });
                
                const currentMonth = new Date().getMonth() + 1;
                let data = fullData.filter(d => parseInt(d.name) <= currentMonth);
                
                if (timeRange === '1M') data = data.slice(-1);
                if (timeRange === '3M') data = data.slice(-3);
                if (timeRange === '6M') data = data.slice(-6);
                if (data.length === 0) return [{name: '起始', value: 0}];
                
                return data;

            }, [member, allHoldings, year, timeRange]);

            // Hook 3: pieData 
            const pieData = useMemo(() => {
                if (!memberHoldings || !memberHoldings.items) return [];

                const total = memberHoldings.totalValue;
                if (total === 0) return [];
                
                const data = memberHoldings.items.slice(0, 5).map(i => ({
                    name: i.name,
                    symbol: i.symbol,
                    value: i.marketValue,
                    percent: (i.marketValue / total) * 100
                }));
                
                const othersValue = memberHoldings.items.slice(5).reduce((sum, i) => sum + i.marketValue, 0);
                if (othersValue > 0) {
                    data.push({ name: '其他', symbol: 'Others', value: othersValue, percent: (othersValue / total) * 100 });
                }
                return data;
            }, [memberHoldings]);

            if (!isOpen || !member) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`${member.name} 的資產概況`} className="max-w-3xl">
                    <div className="space-y-8">
                        {/* 1. Trend Chart Section */}
                        <div>
                             <div className="flex justify-between items-center mb-4">
                                <h4 className="font-bold text-slate-800 flex items-center gap-2"><Activity size={18} className="text-cyan-500"/> 證券資產趨勢圖</h4>
                                <div className="flex gap-1 p-1 bg-slate-100 rounded-full">
                                    {['1M', '3M', '6M', '1Y'].map(range => (
                                        <button 
                                            key={range}
                                            onClick={() => setTimeRange(range)}
                                            className={`px-3 py-1 text-xs font-bold rounded-full transition-all duration-300 ${
                                                timeRange === range 
                                                ? 'bg-cyan-500 text-white shadow-md transform scale-105' 
                                                : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'
                                            }`}
                                        >
                                            {range === '1Y' ? '1年' : range.replace('M', '月')}
                                        </button>
                                    ))}
                                </div>
                             </div>
                             <div className="h-64 w-full bg-white rounded-xl border border-slate-50 relative p-2">
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={memberTrend} margin={{ top: 20, right: 10, left: -20, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorCyan" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#06b6d4" stopOpacity={0.2}/>
                                                <stop offset="95%" stopColor="#06b6d4" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#F1F5F9" />
                                        <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill: '#94A3B8', fontSize: 12}} />
                                        <YAxis axisLine={false} tickLine={false} tick={{fill: '#94A3B8', fontSize: 12}} tickFormatter={(val) => `${val/10000}萬`} />
                                        <RechartsTooltip 
                                            contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgb(0 0 0 / 0.1)' }}
                                            formatter={(value) => [formatCurrency(value), '總資產']}
                                        />
                                        <Area 
                                            type="monotone" 
                                            dataKey="value" 
                                            stroke="#06b6d4" 
                                            strokeWidth={3}
                                            fillOpacity={1} 
                                            fill="url(#colorCyan)" 
                                            activeDot={{ r: 6, strokeWidth: 0, fill: '#0891b2', stroke: '#fff', strokeWidth: 2 }}
                                        />
                                    </AreaChart>
                                </ResponsiveContainer>
                             </div>
                        </div>
                        <div className="border-t border-slate-100"></div>
                        {/* 2. Donut Chart Section */}
                        <div>
                            <h4 className="font-bold text-slate-800 flex items-center gap-2 mb-4"><PieChartIcon size={18} className="text-cyan-500"/> 證券持股圓餅圖</h4>
                            <div className="flex flex-col md:flex-row items-center gap-8">
                                <div className="relative w-48 h-48 flex-shrink-0">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie 
                                                data={pieData} 
                                                innerRadius={60} 
                                                outerRadius={80} 
                                                paddingAngle={3} 
                                                dataKey="value"
                                                startAngle={90}
                                                endAngle={-270}
                                                cornerRadius={4}
                                            >
                                                {pieData.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={FRESH_COLORS[index % FRESH_COLORS.length]} stroke="none"/>
                                                ))}
                                            </Pie>
                                        </PieChart>
                                    </ResponsiveContainer>
                                    <div className="donut-center-text flex flex-col items-center">
                                        <div className="text-xs text-slate-400 font-medium">TWD</div>
                                        <div className="text-lg font-bold text-slate-800">{formatNumber(memberHoldings.totalValue)}</div>
                                    </div>
                                </div>
                                <div className="flex-1 w-full space-y-3">
                                    {pieData.map((item, index) => (
                                        <div key={index} className="flex items-center justify-between text-sm group hover:bg-slate-50 p-2 rounded-lg transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="w-3 h-3 rounded-full shadow-sm" style={{ background: FRESH_COLORS[index % FRESH_COLORS.length] }}></div>
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-slate-700 leading-none">{item.symbol}</span>
                                                    <span className="text-xs text-slate-400 mt-1">{item.name}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-bold text-slate-700">{Math.round(item.percent)}%</div>
                                                <div className="text-xs text-slate-400">{formatCurrency(item.value)}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        };

        // --- 主程式 ---
        function App() {
          const [user, setUser] = useState(null);
          const [activeTab, setActiveTab] = useState('overview');
          const [members, setMembers] = useState([]);
          const [allHoldings, setAllHoldings] = useState([]); 
          const [loading, setLoading] = useState(true);

          // Selection State for Modal
          const [selectedMember, setSelectedMember] = useState(null);
          const [deleteConfirm, setDeleteConfirm] = useState(null); 

          // Security States
          const [isLocked, setIsLocked] = useState(true);
          const [hasPin, setHasPin] = useState(false);
          const [pinInput, setPinInput] = useState("");
          const [storedPin, setStoredPin] = useState(null);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [newPin, setNewPin] = useState("");

          // Year & Month Management
          const currentYear = new Date().getFullYear().toString();
          const [activeYear, setActiveYear] = useState(currentYear);
          const [activeMonth, setActiveMonth] = useState('all');
          const [availableYears, setAvailableYears] = useState([currentYear]);

          // View Mode & Filtering
          const [holdingViewMode, setHoldingViewMode] = useState('summary');
          const [listFilter, setListFilter] = useState({ memberId: null, symbol: null });

          // Update Logic States
          const [updatingPrices, setUpdatingPrices] = useState(false);
          const [priceUpdateMsg, setPriceUpdateMsg] = useState("");
          const [lastUpdateTime, setLastUpdateTime] = useState(null);
          const [processingSettings, setProcessingSettings] = useState(false);

          // Modal States
          const [isAddMemberOpen, setIsAddMemberOpen] = useState(false);
          const [isAddHoldingOpen, setIsAddHoldingOpen] = useState(false);
          const [editingHolding, setEditingHolding] = useState(null);

          // Form States
          const [loadingStockInfo, setLoadingStockInfo] = useState(false);
          const [newMemberName, setNewMemberName] = useState("");
          const [holdingForm, setHoldingForm] = useState({
            memberId: "",
            symbol: "",
            name: "",
            shares: "",
            price: "",
            fee: "1",
            date: new Date().toISOString().split('T')[0],
            type: 'buy',
            note: "",
            year: currentYear
          });

          // Import State
          const fileInputRef = useRef(null);

          // --- Auth & Data Fetching ---
          useEffect(() => {
            const initAuth = async () => {
              try {
                // 這裡我們只使用匿名登入
                await signInAnonymously(auth);
              } catch (error) {
                console.error("Auth error:", error);
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => setUser(currentUser));
            return () => unsubscribe();
          }, []);

          // --- Security Check & Data Fetching ---
          useEffect(() => {
            if (!user) return;
            // 1. Check for PIN
            const checkSecurity = async () => {
              try {
                const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security');
                const snap = await getDoc(settingsRef);
                if (snap.exists() && snap.data().pin) {
                  setHasPin(true);
                  setStoredPin(snap.data().pin);
                  setIsLocked(true);
                } else {
                  setHasPin(false);
                  setIsLocked(false);
                }
              } catch (e) {
                console.error("Security check failed", e);
                setIsLocked(false);
              }
            };
            checkSecurity();

            // 2. Fetch Data
            const membersRef = collection(db, 'artifacts', appId, 'users', user.uid, 'members');
            const unsubMembers = onSnapshot(membersRef, (snapshot) => {
              setMembers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });

            const holdingsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'holdings');
            const unsubHoldings = onSnapshot(holdingsRef, (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAllHoldings(data);
              setLoading(false);
               
              const years = new Set(data.map(h => h.year || currentYear));
              years.add(currentYear);
              const sortedYears = Array.from(years).sort((a, b) => b.localeCompare(a));
              setAvailableYears(sortedYears);

              // Find last update time
              if (data.length > 0) {
                const maxTime = Math.max(...data.map(h => h.lastUpdateTimestamp || 0));
                if (maxTime > 0) setLastUpdateTime(new Date(maxTime * 1000));
              }
            });
            return () => { unsubMembers(); unsubHoldings(); };
          }, [user]);

          // --- Filtered Data ---
          const holdings = useMemo(() => {
            let filtered = allHoldings.filter(h => {
              const yearMatch = (h.year || currentYear) === activeYear;
              if (!yearMatch) return false;

              if (listFilter.memberId && h.memberId !== listFilter.memberId) return false;
              if (listFilter.symbol && h.symbol !== listFilter.symbol) return false;

              if (activeMonth === 'all') return true;
              const hMonth = parseInt(h.date?.split('-')[1] || 0, 10);
              return hMonth === activeMonth;
            });
            
            return filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
          }, [allHoldings, activeYear, activeMonth, currentYear, listFilter]);

          // --- Aggregated Data ---
          const aggregatedHoldings = useMemo(() => {
            const groups = {};
            const sortedForCalc = [...holdings].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedForCalc.forEach(tx => {
              const key = `${tx.symbol}-${tx.memberId}`; 
              if (!groups[key]) {
                const member = members.find(m => m.id === tx.memberId);
                groups[key] = {
                  symbol: tx.symbol,
                  name: tx.name,
                  memberId: tx.memberId,
                  memberName: member ? member.name : 'Unknown',
                  shares: 0,
                  totalCost: 0,
                  realizedProfit: 0,
                  currentPrice: 0,
                  dailyChangePercent: 0,
                  txCount: 0
                };
              }
              const group = groups[key];
              if (tx.currentPrice) group.currentPrice = tx.currentPrice;
              if (tx.dailyChangePercent) group.dailyChangePercent = tx.dailyChangePercent;

              const qty = tx.shares;
              const unitCost = tx.cost;
              if (qty > 0) {
                group.shares += qty;
                group.totalCost += (qty * unitCost);
              } else {
                const avgCost = group.shares > 0 ? group.totalCost / group.shares : 0;
                const sellQty = Math.abs(qty);
                const revenue = sellQty * unitCost;
                const costBasis = sellQty * avgCost;
                
                group.realizedProfit += (revenue - costBasis);
                group.shares -= sellQty;
                group.totalCost -= costBasis;
              }
              group.txCount++;
            });
            return Object.values(groups).map(g => {
              const avgCost = g.shares > 0 ? g.totalCost / g.shares : 0;
              const marketValue = g.shares * g.currentPrice;
              const unrealizedProfit = marketValue - g.totalCost;
              const unrealizedProfitPercent = g.totalCost > 0 ? (unrealizedProfit / g.totalCost) * 100 : 0;
               
              return {
                ...g,
                avgCost,
                marketValue,
                unrealizedProfit,
                unrealizedProfitPercent,
                totalProfit: g.realizedProfit + unrealizedProfit
              };
            }).filter(g => g.shares > 0 || g.realizedProfit !== 0);
          }, [holdings, members]);

          // --- Trend Data Calculation ---
          const trendData = useMemo(() => {
            const months = Array.from({ length: 12 }, (_, i) => i + 1);
            const yearTxs = allHoldings
              .filter(h => (h.year || currentYear) === activeYear)
              .sort((a, b) => new Date(a.date) - new Date(b.date));

            const priceMap = {};
            allHoldings.forEach(h => { if(h.currentPrice) priceMap[h.symbol] = h.currentPrice; });
            
            let runningPortfolio = {}; 
            members.forEach(m => { runningPortfolio[m.id] = {}; });

            return months.map(month => {
              const monthlyTxs = yearTxs.filter(h => {
                 const m = parseInt(h.date?.split('-')[1] || 0, 10);
                 return m === month;
              });

              monthlyTxs.forEach(tx => {
                  const mId = tx.memberId;
                  if (!runningPortfolio[mId]) runningPortfolio[mId] = {};
                  const sym = tx.symbol;
                  if(!runningPortfolio[mId][sym]) runningPortfolio[mId][sym] = { shares: 0, totalCost: 0 };
                  
                  const qty = tx.shares;
                  const unitCost = tx.cost;
                  
                  if (qty > 0) {
                      runningPortfolio[mId][sym].shares += qty;
                      runningPortfolio[mId][sym].totalCost += (qty * unitCost);
                  } else {
                      const sellQty = Math.abs(qty);
                      const currentData = runningPortfolio[mId][sym];
                      const currentAvg = currentData.shares > 0 ? currentData.totalCost / currentData.shares : 0;
                      currentData.shares -= sellQty;
                      currentData.totalCost -= (sellQty * currentAvg);
                  }
              });

              const dataPoint = { name: `${month}月` };
              let totalMarketVal = 0;
              let totalInvested = 0;

              members.forEach(m => {
                  let memberVal = 0;
                  const mPortfolio = runningPortfolio[m.id] || {};
                  Object.entries(mPortfolio).forEach(([sym, data]) => {
                      if (data.shares > 0) {
                          const price = priceMap[sym] || (data.totalCost / data.shares); 
                          memberVal += data.shares * price;
                          totalInvested += data.totalCost;
                      }
                  });
                  dataPoint[m.id] = Math.round(memberVal);
                  totalMarketVal += memberVal;
              });
              
              dataPoint.marketValue = Math.round(totalMarketVal);
              dataPoint.invested = Math.round(totalInvested);
              return dataPoint;
            });
          }, [allHoldings, activeYear, members]);

          // --- Chart Data Preparation (RESTORED) ---
          const allocationData = useMemo(() => {
             const data = {};
             aggregatedHoldings.forEach(h => {
                if (h.marketValue > 0) {
                   data[h.memberName] = (data[h.memberName] || 0) + h.marketValue;
                }
             });
            return Object.entries(data).map(([name, value]) => ({ name, value }));
          }, [aggregatedHoldings, members]);

          // --- Helpers & APIs ---
          const fetchWithDualProxy = async (targetUrl) => {
            const encodedUrl = encodeURIComponent(targetUrl);
            const timestamp = Date.now();
            try {
              const response1 = await fetch(`https://api.allorigins.win/get?url=${encodedUrl}&t=${timestamp}`);
              if (response1.ok) {
                const data = await response1.json();
                if (data.contents) return JSON.parse(data.contents);
              }
            } catch (e) {}
            try {
               const response2 = await fetch(`https://corsproxy.io/?${encodedUrl}`);
               if (response2.ok) return await response2.json();
            } catch (e) { return null; }
            return null;
          };

          const fetchStockData = async (code, type) => {
            if (!code) return null;
            const uCode = code.toUpperCase(); // Ensure code is uppercase for API consistency
            const yahooSymbol = `${uCode}.TW`; 
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${yahooSymbol}?interval=1d`;
            try {
               const data = await fetchWithDualProxy(yahooUrl);
               if (data && data.chart && data.chart.result) {
                  const meta = data.chart.result[0].meta;
                  return {
                    price: meta.regularMarketPrice,
                    change: meta.regularMarketPrice - meta.chartPreviousClose,
                    changePercent: ((meta.regularMarketPrice - meta.chartPreviousClose) / meta.chartPreviousClose) * 100,
                    name: uCode,
                    source: 'Yahoo'
                  };
               }
            } catch (e) {}

            const query = `tse_${uCode}.tw|otc_${uCode}.tw`;
            const twseUrl = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${query}&json=1&delay=0`;
            const data = await fetchWithDualProxy(twseUrl);
            const result = data?.msgArray?.find(item => item.c === uCode);
            if (result) {
              let price = parseFloat(result.z);
              if (isNaN(price)) price = parseFloat(result.b?.split('_')[0]);
              if (isNaN(price)) price = parseFloat(result.a?.split('_')[0]);
              if (isNaN(price)) price = parseFloat(result.y);
              const yesterday = parseFloat(result.y);
              const change = price - yesterday;
              const changePercent = (change / yesterday) * 100;
              return {
                price: price,
                change: change,
                changePercent: changePercent,
                name: result.n,
                source: 'TWSE'
              };
            }
            return null; 
          };

          const handleSymbolBlur = async () => {
             let sym = holdingForm.symbol;
             if (!sym || sym.trim() === '') return;
             
             // 強制轉大寫並去除空白
             sym = sym.trim().toUpperCase();
             
             // 更新輸入框顯示 (自動修正輸入欄)
             setHoldingForm(prev => ({ ...prev, symbol: sym }));

             setLoadingStockInfo(true);
             try {
                const quote = await fetchStockData(sym, "");
                if (quote) {
                    setHoldingForm(prev => ({
                        ...prev,
                        symbol: sym, // 確保儲存時也是大寫
                        name: quote.name || prev.name,
                        price: quote.price ? quote.price.toString() : prev.price
                    }));
                }
             } catch (e) {
                console.error("Auto-fill error", e);
             } finally {
                setLoadingStockInfo(false);
             }
          };

          const handleUpdatePrices = async () => {
            if (!user || allHoldings.length === 0) return;
            setUpdatingPrices(true);
            setPriceUpdateMsg("正在更新股價...");
            
            const uniqueSymbols = [...new Set(allHoldings.map(h => h.symbol))];
            let successCount = 0;
            const batch = writeBatch(db);
            const now = Math.floor(Date.now() / 1000);

            for (const symbol of uniqueSymbols) {
               const stockData = await fetchStockData(symbol);
               if (stockData) {
                  const targetDocs = allHoldings.filter(h => h.symbol === symbol);
                  targetDocs.forEach(docData => {
                     const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', docData.id);
                     batch.update(docRef, {
                        currentPrice: stockData.price,
                        dailyChangePercent: stockData.changePercent,
                        lastUpdateTimestamp: now
                     });
                  });
                  successCount++;
               }
               await new Promise(r => setTimeout(r, 200));
            }

            if (successCount > 0) {
               await batch.commit();
               setPriceUpdateMsg(`成功更新 ${successCount} 檔股票價格`);
               setLastUpdateTime(new Date());
            } else {
               setPriceUpdateMsg("更新失敗，請稍後再試");
            }
            setUpdatingPrices(false);
            setTimeout(() => setPriceUpdateMsg(""), 5000);
          };

          const handleAddMember = async () => {
            if (!newMemberName.trim() || !user) return;
            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'members'), {
              name: newMemberName,
              createdAt: new Date().toISOString()
            });
            setNewMemberName("");
            setIsAddMemberOpen(false);
          };

          const handleSaveHolding = async () => {
             if (!user) return;
             const { shares, price, fee, type } = holdingForm;
             const numShares = parseFloat(shares);
             const numPrice = parseFloat(price);
             const numFee = parseFloat(fee) || 0;
             
             const cost = type === 'buy' ? (numPrice) + (numFee / numShares) : (numPrice) - (numFee / numShares); 
             const signedShares = type === 'buy' ? numShares : -numShares;

             const payload = {
                ...holdingForm,
                shares: signedShares,
                cost: cost, 
                price: numPrice, 
                lastUpdateTimestamp: Math.floor(Date.now() / 1000)
             };
             
             if (editingHolding) {
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', editingHolding.id), payload);
             } else {
                await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'), payload);
             }
             setIsAddHoldingOpen(false);
             setEditingHolding(null);
             resetForm();
          };

          const handleDeleteHolding = (id, e) => {
             e.stopPropagation(); 
             setDeleteConfirm({ id });
          };

          const executeDelete = async () => {
             if (!user || !deleteConfirm) return;
             try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', deleteConfirm.id));
                setDeleteConfirm(null);
             } catch (error) {
                console.error("Delete failed:", error);
             }
          };

          const resetForm = () => {
             setHoldingForm({
                memberId: members.length > 0 ? members[0].id : "",
                symbol: "",
                name: "",
                shares: "",
                price: "",
                fee: "1",
                date: new Date().toISOString().split('T')[0],
                type: 'buy',
                note: "",
                year: activeYear
             });
          };

          const calculateEstimate = () => {
              const p = parseFloat(holdingForm.price) || 0;
              const s = parseFloat(holdingForm.shares) || 0;
              const f = parseFloat(holdingForm.fee) || 0;
              if (holdingForm.type === 'buy') { return p * s + f; } else { return p * s - f; }
          };
          
          const handleDrillDown = (memberId, symbol) => {
             setListFilter({ memberId, symbol });
             setHoldingViewMode('detail');
             setActiveMonth('all'); 
          };

          const handleUnlock = () => {
            if (pinInput === storedPin) { setIsLocked(false); setPinInput(""); } else { alert("密碼錯誤，請重試"); }
          };
          
          const handleSetPin = async () => {
            if (newPin.length < 4) { alert("PIN 碼至少需 4 位數"); return; }
            try {
              await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security'), { pin: newPin }, { merge: true });
              setStoredPin(newPin);
              setHasPin(true);
              setNewPin("");
              setIsSettingsOpen(false);
              alert("安全密碼設定成功！");
            } catch (e) { console.error(e); }
          };

          // --- Settings Data Management Handlers ---
          const handleExportData = async () => {
            if(!user) return;
            try {
                setProcessingSettings(true);
                const membersSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'members'));
                const holdingsSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                
                const data = {
                  version: 1,
                  exportedAt: new Date().toISOString(),
                  members: membersSnap.docs.map(d => ({id: d.id, ...d.data()})),
                  holdings: holdingsSnap.docs.map(d => ({id: d.id, ...d.data()}))
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `family-asset-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch(e) {
                console.error(e);
                alert("匯出失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          const handleImportData = async (e) => {
            const file = e.target.files[0];
            if(!file || !user) return;
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    setProcessingSettings(true);
                    const data = JSON.parse(event.target.result);
                    if(!data.members || !data.holdings) throw new Error("無效的備份檔案格式");
                    
                    const batch = writeBatch(db);
                    let count = 0;
                    
                    // Import Members
                    for(const m of data.members) {
                        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'members', m.id);
                        const {id, ...rest} = m;
                        batch.set(ref, rest);
                        count++;
                    }
                    
                    // Import Holdings
                    for(const h of data.holdings) {
                        const ref = doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', h.id);
                        const {id, ...rest} = h;
                        batch.set(ref, rest);
                        count++;
                        
                        // Commit every 450 ops (limit is 500) - Basic implementation
                        // For this simple app, assuming total dataset is small. 
                        // If larger, would need multiple batches.
                    }
                    
                    await batch.commit();
                    alert(`成功匯入 ${data.members.length} 位成員與 ${data.holdings.length} 筆交易紀錄！`);
                    // Optional: reload to ensure fresh state
                    window.location.reload();
                } catch(e) {
                    alert("匯入失敗：" + e.message);
                } finally {
                    setProcessingSettings(false);
                    if(fileInputRef.current) fileInputRef.current.value = "";
                }
            };
            reader.readAsText(file);
          };

          const handleRemoveDuplicates = async () => {
            if(!user || !confirm("確定要移除重複的交易紀錄嗎？\n系統將保留每筆重複資料中的一筆，並刪除其餘重複項。\n建議先執行「匯出備份」。")) return;
            
            try {
                setProcessingSettings(true);
                const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                const seen = new Set();
                const duplicates = [];
                
                docs.forEach(doc => {
                    // Create a unique key based on critical fields
                    // Using floor for shares/price to handle slight float differences if any, though usually exact
                    const key = `${doc.memberId}|${doc.symbol}|${doc.date}|${doc.type}|${parseFloat(doc.shares)}|${parseFloat(doc.price)}`;
                    if(seen.has(key)) {
                        duplicates.push(doc.id);
                    } else {
                        seen.add(key);
                    }
                });
                
                if(duplicates.length === 0) {
                    alert("未發現重複的交易紀錄。");
                    return;
                }
                
                const batch = writeBatch(db);
                duplicates.forEach(id => {
                    batch.delete(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', id));
                });
                
                await batch.commit();
                alert(`已成功移除 ${duplicates.length} 筆重複資料。`);
            } catch(e) {
                console.error(e);
                alert("處理失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          const renderMonthFilter = () => (
            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
               <button onClick={() => setActiveMonth('all')} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${activeMonth === 'all' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>全年</button>
               {Array.from({length: 12}, (_, i) => i + 1).map(m => (
                 <button key={m} onClick={() => setActiveMonth(m)} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${activeMonth === m ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>{m}月</button>
               ))}
            </div>
          );

          if (isLocked) {
             return (
               <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                 <Card className="w-full max-w-sm p-8 flex flex-col items-center">
                   <div className="bg-blue-100 p-4 rounded-full mb-4"><Lock size={32} className="text-blue-600" /></div>
                   <h2 className="text-xl font-bold text-slate-800 mb-2">安全鎖定</h2>
                   <p className="text-slate-500 mb-6 text-center">請輸入 PIN 碼以存取您的資產資料</p>
                   <div className="flex gap-2 w-full mb-4">
                     <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} className="w-full px-4 py-3 text-center text-lg tracking-widest bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="****" maxLength={6} />
                   </div>
                   <Button onClick={handleUnlock} className="w-full">解鎖</Button>
                 </Card>
               </div>
             );
          }

          return (
            <div className="min-h-screen pb-6">
              {/* Header */}
              <header className="bg-white sticky top-0 z-10 border-b border-slate-200 px-4 py-3 shadow-sm">
                <div className="flex justify-between items-center gap-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className="bg-blue-600 text-white p-1.5 rounded-lg flex-shrink-0"><TrendingUp size={20}/></div>
                        <h1 className="font-bold text-slate-800 text-lg hidden lg:block whitespace-nowrap">家庭資產管家</h1>
                        
                        {/* Selectors Group */}
                        <div className="flex items-center gap-1 overflow-x-auto scrollbar-hide">
                            <select 
                              value={activeYear} 
                              onChange={(e) => setActiveYear(e.target.value)} 
                              className="bg-slate-100 text-slate-700 text-sm font-bold py-1.5 px-2 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer hover:bg-slate-200 transition-colors"
                            >
                              {availableYears.map(y => <option key={y} value={y}>{y}年</option>)}
                            </select>

                            <select 
                              value={activeMonth} 
                              onChange={(e) => setActiveMonth(e.target.value === 'all' ? 'all' : parseInt(e.target.value))} 
                              className="bg-slate-100 text-slate-700 text-sm font-bold py-1.5 px-2 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer hover:bg-slate-200 transition-colors"
                            >
                              <option value="all">全年</option>
                              {Array.from({length: 12}, (_, i) => i + 1).map(m => (
                                <option key={m} value={m}>{m}月</option>
                              ))}
                            </select>
                        </div>
                    </div>

                    <div className="flex items-center gap-1 sm:gap-2 flex-shrink-0">
                        <button 
                            onClick={handleUpdatePrices} 
                            disabled={updatingPrices}
                            className={`p-2 rounded-full transition-colors ${updatingPrices ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-slate-100'}`}
                            title="更新股價"
                        >
                            <RefreshCw size={20} className={updatingPrices ? "animate-spin" : ""}/>
                        </button>

                        <button onClick={() => setIsAddMemberOpen(true)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full" aria-label="新增成員"><UserPlus size={20}/></button>
                        <button onClick={() => setIsSettingsOpen(true)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full"><Settings size={20}/></button>
                        <Button variant="secondary" onClick={() => { resetForm(); setIsAddHoldingOpen(true); }} className="px-3 text-sm ml-1 font-bold">新增</Button>
                    </div>
                </div>
                
                {/* Price Update Message Bar */}
                {priceUpdateMsg && (
                    <div className={`text-xs text-center py-1 mt-1 rounded ${priceUpdateMsg.includes('失敗') ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'} animate-in slide-in-from-top-1`}>
                        {priceUpdateMsg}
                    </div>
                )}
              </header>

              <main className="max-w-5xl mx-auto p-4 space-y-6">
                
                {/* 1. 總覽卡片 */}
                {activeTab === 'overview' && (
                  <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <Card className="p-5 bg-gradient-to-br from-blue-600 to-blue-700 text-white border-none shadow-lg shadow-blue-200">
                        <div className="flex justify-between items-start mb-4">
                          <div><p className="text-blue-100 text-sm font-medium mb-1">總資產市值</p><h2 className="text-3xl font-bold tracking-tight">{formatCurrency(aggregatedHoldings.reduce((sum, h) => sum + h.marketValue, 0))}</h2></div>
                          <div className="bg-white/20 p-2 rounded-lg backdrop-blur-sm"><DollarSign size={24} className="text-white"/></div>
                        </div>
                        <div className="flex gap-4 text-sm text-blue-100">
                           <div><span className="opacity-70">投入成本</span> <span className="font-semibold">{formatNumber(aggregatedHoldings.reduce((sum, h) => sum + h.totalCost, 0))}</span></div>
                           <div><span className="opacity-70">未實現損益</span> <span className="font-semibold">{formatNumber(aggregatedHoldings.reduce((sum, h) => sum + h.unrealizedProfit, 0))}</span></div>
                        </div>
                      </Card>

                      <Card className="p-5 flex flex-col justify-between">
                         <div className="flex justify-between items-start">
                            <div><p className="text-slate-500 text-sm font-medium mb-1">已實現損益 (今年)</p><h2 className={`text-2xl font-bold ${aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0) >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatCurrency(aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0))}</h2></div>
                            <div className="bg-emerald-50 p-2 rounded-lg"><PieChartIcon size={24} className="text-emerald-500"/></div>
                         </div>
                         <div className="mt-2 text-xs text-slate-400">包含股利與價差</div>
                      </Card>

                      {/* 成員資產分佈 */}
                      <Card className="p-5 flex flex-col justify-between">
                         <div className="flex justify-between items-center mb-2">
                             <p className="text-slate-500 text-sm font-medium">成員資產分佈</p>
                         </div>
                         <div className="flex gap-4">
                             {/* Chart */}
                             <div className="flex-1 min-h-[100px] relative">
                                {allocationData.length > 0 ? (
                                   <ResponsiveContainer width="100%" height={120}>
                                     <PieChart>
                                       <Pie data={allocationData} innerRadius={35} outerRadius={55} paddingAngle={5} dataKey="value">
                                         {allocationData.map((entry, index) => <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />)}
                                       </Pie>
                                       <RechartsTooltip formatter={(val) => formatCurrency(val)} />
                                     </PieChart>
                                   </ResponsiveContainer>
                                ) : <div className="text-slate-400 text-xs flex items-center justify-center h-full">尚無資料</div>}
                             </div>
                             {/* Interactive Member List */}
                             <div className="flex flex-col justify-center gap-1.5 w-1/2">
                                {members.map((m, i) => (
                                    <button 
                                        key={m.id} 
                                        onClick={() => setSelectedMember(m)}
                                        className="flex items-center justify-between text-xs p-1.5 hover:bg-slate-50 rounded-lg group transition-colors text-left"
                                    >
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full" style={{background: COLORS[i % COLORS.length]}}></div>
                                            <span className="text-slate-700 font-medium">{m.name}</span>
                                        </div>
                                        <ChevronRight size={14} className="text-slate-300 group-hover:text-blue-500"/>
                                    </button>
                                ))}
                             </div>
                         </div>
                      </Card>
                    </div>

                    {/* Chart Section */}
                    <Card className="p-6">
                      <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Activity size={20} className="text-blue-500"/>{activeYear} 年度資產趨勢 (堆疊圖)</h3>
                      <div className="h-64 w-full text-xs">
                        <ResponsiveContainer width="100%" height="100%">
                          <AreaChart data={trendData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                            <defs><linearGradient id="colorValue" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3B82F6" stopOpacity={0.1}/><stop offset="95%" stopColor="#3B82F6" stopOpacity={0}/></linearGradient></defs>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0"/>
                            <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill: '#64748B'}} />
                            <YAxis hide domain={['auto', 'auto']} />
                            <RechartsTooltip formatter={(value) => formatCurrency(value)} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}/>
                            <Legend verticalAlign="top" height={36}/>
                            {members.map((member, index) => (
                                <Area 
                                    key={member.id}
                                    type="monotone" 
                                    dataKey={member.id} 
                                    name={member.name} 
                                    stackId="1" 
                                    stroke={COLORS[index % COLORS.length]} 
                                    fill={COLORS[index % COLORS.length]} 
                                    fillOpacity={0.6}
                                />
                            ))}
                          </AreaChart>
                        </ResponsiveContainer>
                      </div>
                    </Card>

                    {/* Inventory List */}
                    <Card className="overflow-hidden">
                       <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2"><Layers size={18} className="text-blue-500"/> 持股明細</h3>
                          <div className="flex bg-slate-200 p-0.5 rounded-lg">
                             <button onClick={() => { setHoldingViewMode('summary'); setListFilter({ memberId: null, symbol: null }); }} className={`px-3 py-1 text-xs font-medium rounded-md transition-all ${holdingViewMode === 'summary' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>彙整</button>
                             <button onClick={() => setHoldingViewMode('detail')} className={`px-3 py-1 text-xs font-medium rounded-md transition-all ${holdingViewMode === 'detail' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>明細</button>
                          </div>
                       </div>
                       
                       {holdingViewMode === 'summary' ? (
                         <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                               <thead className="bg-slate-50 text-slate-500 font-medium">
                                  <tr>
                                     <th className="p-3 pl-4">成員</th>
                                     <th className="p-3">標的</th>
                                     <th className="p-3 text-right">股數</th>
                                     <th className="p-3 text-right">均價</th>
                                     <th className="p-3 text-right">現價</th>
                                     <th className="p-3 text-right">市值</th>
                                     <th className="p-3 text-right">未實現損益</th>
                                     <th className="p-3 text-right">已實現</th>
                                     <th className="p-3 text-center">操作</th>
                                  </tr>
                               </thead>
                               <tbody className="divide-y divide-slate-100">
                                  {aggregatedHoldings.map((h, i) => (
                                     <tr key={i} className="hover:bg-slate-50/80 transition-colors">
                                        <td className="p-3 pl-4 font-medium text-slate-700">{h.memberName}</td>
                                        <td className="p-3">
                                           <div className="font-bold text-slate-800">{h.name}</div>
                                           <div className="text-xs text-slate-400">{h.symbol}</div>
                                        </td>
                                        <td className="p-3 text-right">{formatNumber(h.shares)}</td>
                                        <td className="p-3 text-right text-slate-500">{formatNumber(h.avgCost.toFixed(1))}</td>
                                        <td className="p-3 text-right">
                                           <div className="font-medium">{h.currentPrice || '-'}</div>
                                           {h.dailyChangePercent !== 0 && (
                                              <div className={`text-xs ${h.dailyChangePercent > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{h.dailyChangePercent > 0 ? '+' : ''}{h.dailyChangePercent.toFixed(2)}%</div>
                                           )}
                                        </td>
                                        <td className="p-3 text-right font-medium text-slate-800">{formatNumber(h.marketValue)}</td>
                                        <td className={`p-3 text-right font-medium ${h.unrealizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                           {formatNumber(h.unrealizedProfit)}
                                           <div className="text-xs opacity-75">{h.unrealizedProfitPercent.toFixed(1)}%</div>
                                        </td>
                                        <td className={`p-3 text-right ${h.realizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatNumber(h.realizedProfit)}</td>
                                        <td className="p-3 text-center">
                                           <button onClick={() => handleDrillDown(h.memberId, h.symbol)} className="text-blue-600 hover:text-blue-800 text-xs font-bold border border-blue-200 hover:bg-blue-50 px-2 py-1 rounded transition-colors">編輯明細</button>
                                        </td>
                                     </tr>
                                  ))}
                               </tbody>
                            </table>
                            {aggregatedHoldings.length === 0 && <div className="p-8 text-center text-slate-400">目前沒有持股資料</div>}
                         </div>
                       ) : (
                         <div className="overflow-x-auto">
                            { (listFilter.memberId || listFilter.symbol) && (
                               <div className="bg-blue-50 px-4 py-2 flex justify-between items-center text-xs text-blue-700 border-b border-blue-100">
                                  <span className="flex items-center gap-1">
                                    <Filter size={12}/> 
                                    目前顯示: <b>{members.find(m => m.id === listFilter.memberId)?.name}</b> 的 <b>{listFilter.symbol}</b> 交易紀錄
                                  </span>
                                  <button onClick={() => setListFilter({ memberId: null, symbol: null })} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 hover:underline">
                                    <XCircle size={12}/> 顯示全部
                                  </button>
                               </div>
                            )}
                            <table className="w-full text-sm text-left">
                               <thead className="bg-slate-50 text-slate-500 font-medium">
                                  <tr>
                                     <th className="p-3 pl-4">日期</th>
                                     <th className="p-3">成員</th>
                                     <th className="p-3">動作</th>
                                     <th className="p-3">標的</th>
                                     <th className="p-3 text-right">股數</th>
                                     <th className="p-3 text-right">價格</th>
                                     <th className="p-3 text-right">總額</th>
                                     <th className="p-3 text-center">操作</th>
                                  </tr>
                               </thead>
                               <tbody className="divide-y divide-slate-100">
                                  {holdings.map((h) => {
                                     const member = members.find(m => m.id === h.memberId);
                                     const isBuy = h.shares > 0;
                                     return (
                                     <tr 
                                        key={h.id} 
                                        onClick={() => { setEditingHolding(h); setHoldingForm({...h, date: h.date, type: h.shares > 0 ? 'buy' : 'sell', shares: Math.abs(h.shares).toString() }); setIsAddHoldingOpen(true); }}
                                        className="hover:bg-slate-50/80 transition-colors cursor-pointer group"
                                     >
                                        <td className="p-3 pl-4 text-slate-500 whitespace-nowrap">{h.date}</td>
                                        <td className="p-3 font-medium text-slate-700">{member?.name}</td>
                                        <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${isBuy ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>{isBuy ? '買進' : '賣出'}</span></td>
                                        <td className="p-3"><div className="font-bold text-slate-800">{h.name}</div><div className="text-xs text-slate-400">{h.symbol}</div></td>
                                        <td className="p-3 text-right">{formatNumber(Math.abs(h.shares))}</td>
                                        <td className="p-3 text-right text-slate-500">{formatNumber(h.price)}</td>
                                        <td className="p-3 text-right font-medium text-slate-700">{formatNumber(Math.abs(h.shares * h.price))}</td>
                                        <td className="p-3 text-center">
                                           <button onClick={(e) => handleDeleteHolding(h.id, e)} className="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors"><Trash2 size={16}/></button>
                                        </td>
                                     </tr>
                                  )})}
                               </tbody>
                            </table>
                            {holdings.length === 0 && <div className="p-8 text-center text-slate-400">目前沒有交易紀錄</div>}
                         </div>
                       )}
                    </Card>
                  </div>
                )}
                
                {/* 2. Analysis Tab (Placeholder for future expansion) */}
                {activeTab === 'analysis' && (
                  <div className="text-center p-12">
                    <p className="text-slate-400">更多圖表開發中...</p>
                  </div>
                )}

              </main>

              {/* Modals */}
              <Modal isOpen={isAddMemberOpen} onClose={() => setIsAddMemberOpen(false)} title="新增家庭成員">
                 <div className="space-y-4">
                    <Input label="成員名稱" placeholder="例如：爸爸、媽媽" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} />
                    <Button onClick={handleAddMember} className="w-full mt-2">新增成員</Button>
                    <div className="mt-4 pt-4 border-t border-slate-100">
                       <p className="text-xs text-slate-500 mb-2 font-semibold uppercase">現有成員</p>
                       <div className="flex flex-wrap gap-2">
                          {members.map(m => <span key={m.id} className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-sm flex items-center gap-1">{m.name}</span>)}
                       </div>
                    </div>
                 </div>
              </Modal>
              
              {/* Member Detail Modal (New!) */}
              <MemberDetailModal 
                isOpen={!!selectedMember}
                onClose={() => setSelectedMember(null)}
                member={selectedMember}
                allHoldings={allHoldings}
                year={activeYear}
              />

              {/* Delete Confirmation Modal */}
              <Modal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="刪除確認">
                 <div className="space-y-4">
                    <div className="flex items-center gap-3 text-red-600 bg-red-50 p-3 rounded-lg">
                       <AlertTriangle size={24} />
                       <p className="font-medium text-sm">確定要刪除這筆交易紀錄嗎？</p>
                    </div>
                    <p className="text-slate-500 text-sm">此動作無法復原，刪除後將從總資產中移除此筆交易的計算。</p>
                    <div className="flex gap-3 pt-2">
                       <Button variant="ghost" onClick={() => setDeleteConfirm(null)} className="flex-1">取消</Button>
                       <Button variant="danger" onClick={executeDelete} className="flex-1">確認刪除</Button>
                    </div>
                 </div>
              </Modal>

              <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="系統設定">
                 <div className="space-y-6">
                    <div>
                       <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><Settings size={18} className="text-blue-500"/> 資料管理</h4>
                       <div className="grid grid-cols-2 gap-3">
                          <Button variant="secondary" onClick={handleExportData} isLoading={processingSettings} className="justify-center">
                             <Download size={16}/> 匯出備份
                          </Button>
                          <div className="relative">
                             <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleImportData} 
                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                                accept=".json"
                             />
                             <Button variant="secondary" isLoading={processingSettings} className="justify-center w-full">
                                <Upload size={16}/> 匯入資料
                             </Button>
                          </div>
                          <Button variant="secondary" onClick={handleRemoveDuplicates} isLoading={processingSettings} className="col-span-2 justify-center text-red-500 border-red-100 hover:bg-red-50">
                             <Copy size={16}/> 移除重複交易
                          </Button>
                       </div>
                    </div>
                    <div className="pt-4 border-t border-slate-100">
                       <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><ShieldCheck size={18} className="text-blue-500"/> 安全性設定</h4>
                       <div className="bg-slate-50 p-4 rounded-lg border border-slate-100">
                          {hasPin ? (
                             <div className="text-center space-y-3">
                                <p className="text-emerald-600 font-medium flex items-center justify-center gap-2"><Lock size={16}/> 已啟用 PIN 碼保護</p>
                                <Button variant="secondary" className="w-full text-sm" onClick={() => { setHasPin(false); setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security'), { pin: null }); }}>移除密碼</Button>
                             </div>
                          ) : (
                             <div className="space-y-3">
                                <Input label="設定新的 PIN 碼" type="password" placeholder="4-6 位數字" value={newPin} onChange={e => setNewPin(e.target.value)} maxLength={6} />
                                <Button onClick={handleSetPin} className="w-full">啟用保護</Button>
                             </div>
                          )}
                       </div>
                    </div>
                 </div>
              </Modal>

              <Modal isOpen={isAddHoldingOpen} onClose={() => { setIsAddHoldingOpen(false); setEditingHolding(null); resetForm(); }} title={editingHolding ? "編輯交易紀錄" : "新增交易紀錄"}>
                 <div className="space-y-4">
                  <div className="flex bg-slate-100 rounded-lg p-1"><button className={`flex-1 py-1.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${holdingForm.type === 'buy' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400'}`} onClick={() => setHoldingForm({...holdingForm, type: 'buy'})}>買進 (Buy)</button><button className={`flex-1 py-1.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${holdingForm.type === 'sell' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`} onClick={() => setHoldingForm({...holdingForm, type: 'sell'})}>賣出 (Sell)</button></div>
                  <div className="flex flex-col gap-1"><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">持有成員</label><select value={holdingForm.memberId} onChange={e => setHoldingForm({...holdingForm, memberId: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="" disabled>選擇成員</option>{members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></div>
                  <div className="flex gap-3"><div className="flex flex-col gap-1 w-full"><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">交易日期</label><input type="date" value={holdingForm.date} onChange={e => { const newDate = e.target.value; const newYear = newDate ? newDate.split('-')[0] : holdingForm.year; setHoldingForm({ ...holdingForm, date: newDate, year: newYear }); }} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/></div></div>
                  
                  {/* Stock Symbol Input with Auto-fill */}
                  <div className="grid grid-cols-2 gap-3">
                     <div className="flex flex-col gap-1 relative">
                        <Input label="股票代號" placeholder="例如：2330" value={holdingForm.symbol} onChange={e => setHoldingForm({...holdingForm, symbol: e.target.value})} onBlur={handleSymbolBlur} />
                        {loadingStockInfo && <div className="absolute right-3 top-8 text-slate-400 animate-spin"><Loader2 size={16}/></div>}
                     </div>
                     <Input label="股票名稱" placeholder="台積電" value={holdingForm.name} onChange={e => setHoldingForm({...holdingForm, name: e.target.value})} />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-3"><Input label="成交股數" type="number" placeholder="1000" value={holdingForm.shares} onChange={e => setHoldingForm({...holdingForm, shares: e.target.value})} /><Input label="成交單價" type="number" placeholder="500" value={holdingForm.price} onChange={e => setHoldingForm({...holdingForm, price: e.target.value})} /></div>
                  <div className="grid grid-cols-2 gap-3"><Input label="手續費" type="number" placeholder="20" value={holdingForm.fee} onChange={e => setHoldingForm({...holdingForm, fee: e.target.value})} /><div className="flex flex-col gap-1 justify-center"><span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">預估總金額</span><div className={`text-lg font-bold ${holdingForm.type === 'buy' ? 'text-red-600' : 'text-emerald-600'}`}>{formatNumber(calculateEstimate())}</div></div></div>
                  <Input label="備註" placeholder="例如：定期定額、波段..." value={holdingForm.note} onChange={e => setHoldingForm({...holdingForm, note: e.target.value})} /><Button onClick={handleSaveHolding} className="w-full mt-2" variant={holdingForm.type === 'buy' ? 'buyActive' : 'sellActive'}><Save size={18} /> {editingHolding ? "儲存修改" : "確認新增"}</Button>
                 </div>
              </Modal>

            </div>
          );
        }

        // --- 啟動 React ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
