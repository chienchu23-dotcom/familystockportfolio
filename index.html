          const handleRemoveDuplicates = async () => {
            if(!user || !confirm("確定要移除重複的交易紀錄嗎？\n系統將保留每筆重複資料中的一筆，並刪除其餘重複項。\n建議先執行「匯出備份」。")) return;
            
            try {
                setProcessingSettings(true);
                const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                const seen = new Set();
                const duplicates = [];
                
                docs.forEach(doc => {
                    const key = `${doc.memberId}|${doc.symbol}|${doc.date}|${doc.type}|${parseFloat(doc.shares)}|${parseFloat(doc.price)}`;
                    if(seen.has(key)) {
                        duplicates.push(doc.id);
                    } else {
                        seen.add(key);
                    }
                });
                
                if(duplicates.length === 0) {
                    alert("未發現重複的交易紀錄。");
                    return;
                }
                
                const batch = writeBatch(db);
                duplicates.forEach(id => {
                    batch.delete(doc(db, 'artifacts', appId, 'users', user.uid, 'holdings', id));
                });
                
                await batch.commit();
                alert(`已成功移除 ${duplicates.length} 筆重複資料。`);
            } catch(e) {
                console.error(e);
                alert("處理失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          const handleClearData = async () => {
            if (!user) return;
            if (!confirm("⚠️ 危險操作警告！\n\n此操作將「永久刪除」所有成員與交易紀錄，且無法復原！\n\n強烈建議您先執行「匯出備份」。\n\n確定要繼續清空所有資料嗎？")) return;
            if (!confirm("再次確認：您真的要清空系統中的所有資料嗎？")) return;

            try {
                setProcessingSettings(true);
                const batch = writeBatch(db);
                
                const holdingsSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'holdings'));
                holdingsSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });

                const membersSnap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'members'));
                membersSnap.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                alert("系統已重置，所有資料已清空。");
                window.location.reload();
            } catch (e) {
                console.error(e);
                alert("清空失敗：" + e.message);
            } finally {
                setProcessingSettings(false);
            }
          };

          return (
            <div className="min-h-screen pb-6">
              {/* Header */}
              <header className="bg-white sticky top-0 z-10 border-b border-slate-200 px-4 py-3 shadow-sm">
                <div className="flex justify-between items-center gap-2">
                    <div className="flex items-center gap-2 flex-1 min-w-0">
                        <div className="bg-blue-600 text-white p-1.5 rounded-lg flex-shrink-0"><TrendingUp size={20}/></div>
                        <h1 className="font-bold text-slate-800 text-lg hidden lg:block whitespace-nowrap">家庭資產管家</h1>
                        
                        {/* Selectors Group - Integrated Year/Month */}
                        <div className="flex items-center gap-1 overflow-x-auto scrollbar-hide">
                            <select 
                              value={`${activeYear}-${activeMonth}`}
                              onChange={(e) => {
                                  const [y, m] = e.target.value.split('-');
                                  setActiveYear(y);
                                  setActiveMonth(m === 'all' ? 'all' : parseInt(m));
                              }}
                              className="bg-slate-100 text-slate-700 text-sm font-bold py-1.5 px-3 rounded-lg border-none focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer hover:bg-slate-200 transition-colors"
                            >
                                {availableYears.map(year => (
                                    <optgroup key={year} label={`${year}年`}>
                                        <option value={`${year}-all`}>{year}年 (全年)</option>
                                        {Array.from({length: 12}, (_, i) => i + 1).map(m => (
                                            <option key={`${year}-${m}`} value={`${year}-${m}`}>{m}月</option>
                                        ))}
                                    </optgroup>
                                ))}
                            </select>
                        </div>
                    </div>

                    <div className="flex items-center gap-1 sm:gap-2 flex-shrink-0">
                        {/* 新增: 顯示最後更新時間 */}
                        {lastUpdateTime && (
                            <div className="hidden sm:flex flex-col items-end justify-center mr-2 border-r border-slate-200 pr-3 h-8">
                                <span className="text-[10px] text-slate-400 font-medium">最後更新</span>
                                <span className="text-xs font-bold text-slate-600 font-mono tracking-tight">{lastUpdateTime.toLocaleTimeString('zh-TW', { hour12: false })}</span>
                            </div>
                        )}
                        <button 
                            onClick={() => handleAuthRequired(handleUpdatePrices)} 
                            disabled={updatingPrices}
                            className={`p-2 rounded-full transition-colors ${updatingPrices ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-slate-100'}`}
                            title="更新股價"
                        >
                            <RefreshCw size={20} className={updatingPrices ? "animate-spin" : ""}/>
                        </button>

                        <button onClick={() => handleAuthRequired(() => setIsAddMemberOpen(true))} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full" aria-label="新增成員"><UserPlus size={20}/></button>
                        <button onClick={() => handleAuthRequired(() => setIsSettingsOpen(true))} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full"><Settings size={20}/></button>
                        
                        {/* Lock Button */}
                        {hasPin && (
                            <button 
                                onClick={handleToggleLock}
                                className={`p-2 rounded-full transition-colors ${isAuthenticated ? 'text-emerald-500 bg-emerald-50' : 'text-red-500 bg-red-50'}`}
                                title={isAuthenticated ? "點擊鎖定" : "點擊解鎖"}
                            >
                                {isAuthenticated ? <LockOpen size={20}/> : <Lock size={20}/>}
                            </button>
                        )}

                        <Button variant="secondary" onClick={() => handleAuthRequired(() => { resetForm(); setIsAddHoldingOpen(true); })} className="px-3 text-sm ml-1 font-bold">新增</Button>
                    </div>
                </div>
                
                {/* Price Update Message Bar */}
                {priceUpdateMsg && (
                    <div className={`text-xs text-center py-1 mt-1 rounded ${priceUpdateMsg.includes('失敗') ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600'} animate-in slide-in-from-top-1`}>
                        {priceUpdateMsg}
                    </div>
                )}
              </header>

              <main className="max-w-5xl mx-auto p-4 space-y-6">
                
                {/* 1. 總覽卡片 */}
                {activeTab === 'overview' && (
                  <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <Card className="p-5 bg-gradient-to-br from-blue-600 to-blue-700 text-white border-none shadow-lg shadow-blue-200">
                        <div className="flex justify-between items-start mb-4">
                          <div>
                              <p className="text-blue-100 text-sm font-medium mb-1">總資產市值</p>
                              <div className="flex items-baseline gap-2">
                                  <h2 className="text-3xl font-bold tracking-tight">{formatCurrency(totalAssetValue)}</h2>
                                  <span className={`text-sm font-bold px-2 py-0.5 rounded-full ${totalProfitPercentage >= 0 ? 'bg-red-500/30 text-red-100' : 'bg-emerald-500/30 text-emerald-100'}`}>
                                      {totalProfitPercentage > 0 ? '+' : ''}{totalProfitPercentage.toFixed(2)}%
                                  </span>
                              </div>
                          </div>
                          <div className="bg-white/20 p-2 rounded-lg backdrop-blur-sm"><DollarSign size={24} className="text-white"/></div>
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-sm text-blue-100">
                           <div className="flex flex-col">
                               <span className="opacity-70 text-xs mb-1">投入成本</span> 
                               <span className="font-bold text-base">{formatNumber(Math.round(totalCost))}</span>
                           </div>
                           <div className="flex flex-col">
                               <span className="opacity-70 text-xs mb-1">未實現損益</span> 
                               <span className="font-bold text-base">{formatNumber(Math.round(totalUnrealizedProfit))}</span>
                           </div>
                           <div className="flex flex-col">
                               <span className="opacity-70 text-xs mb-1">當日損益</span> 
                               <span className={`font-bold text-base ${totalDailyProfit >= 0 ? 'text-red-300' : 'text-emerald-300'}`}>
                                   {totalDailyProfit > 0 ? '+' : ''}{formatNumber(Math.round(totalDailyProfit))}
                               </span>
                           </div>
                        </div>
                      </Card>

                      <Card className="p-5 flex flex-col justify-between">
                         <div className="flex justify-between items-start">
                            <div><p className="text-slate-500 text-sm font-medium mb-1">已實現損益 (今年)</p><h2 className={`text-2xl font-bold ${aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0) >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatCurrency(aggregatedHoldings.reduce((sum, h) => sum + h.realizedProfit, 0))}</h2></div>
                            <div className="bg-emerald-50 p-2 rounded-lg"><PieChartIcon size={24} className="text-emerald-500"/></div>
                         </div>
                         <div className="mt-2 text-xs text-slate-400">包含股利與價差</div>
                      </Card>

                      {/* 成員資產分佈 */}
                      <Card className="p-5 flex flex-col justify-between">
                         <div className="flex justify-between items-center mb-2">
                             <p className="text-slate-500 text-sm font-medium">成員資產分佈</p>
                         </div>
                         <div className="flex gap-4">
                             {/* Chart */}
                             <div className="flex-1 min-h-[100px] relative">
                                {allocationData.length > 0 ? (
                                   <ResponsiveContainer width="100%" height={120}>
                                     <PieChart>
                                       <Pie data={allocationData} innerRadius={35} outerRadius={55} paddingAngle={5} dataKey="value">
                                         {allocationData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                                       </Pie>
                                       <RechartsTooltip formatter={(val) => formatCurrency(val)} />
                                     </PieChart>
                                   </ResponsiveContainer>
                                ) : <div className="text-slate-400 text-xs flex items-center justify-center h-full">尚無資料</div>}
                             </div>
                             {/* Interactive Member List */}
                             <div className="flex flex-col justify-center gap-1.5 w-1/2">
                                {members.map((m, i) => {
                                    const mData = allocationData.find(d => d.name === m.name);
                                    const val = mData ? mData.value : 0;
                                    const percent = totalAssetValue > 0 ? ((val / totalAssetValue) * 100).toFixed(1) : "0.0";
                                    return (
                                        <button 
                                            key={m.id} 
                                            onClick={() => setSelectedMember(m)}
                                            className="flex items-center justify-between text-xs p-1.5 hover:bg-slate-50 rounded-lg group transition-colors text-left"
                                        >
                                            <div className="flex items-center gap-2">
                                                <div className="w-2 h-2 rounded-full" style={{background: COLORS[i % COLORS.length]}}></div>
                                                <span className="text-slate-700 font-medium">{m.name}</span>
                                            </div>
                                            <div className="flex items-center gap-1">
                                                <span className="text-xs text-slate-400 font-medium">{percent}%</span>
                                                <ChevronRight size={14} className="text-slate-300 group-hover:text-blue-500"/>
                                            </div>
                                        </button>
                                    );
                                })}
                             </div>
                         </div>
                      </Card>
                    </div>

                    {/* Chart Section */}
                    <Card className="p-6">
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 gap-2">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2">
                              <Activity size={20} className="text-blue-500"/>
                              資產趨勢圖 (堆疊)
                              {isFetchingHistory && <Loader2 size={14} className="animate-spin text-slate-400 ml-1" title="正在載入歷史股價..." />}
                          </h3>
                          <div className="flex gap-1 p-1 bg-slate-100 rounded-full self-start sm:self-auto">
                              {['1M', '3M', '6M', '1Y'].map(range => (
                                  <button 
                                      key={range}
                                      onClick={() => setMainTimeRange(range)}
                                      className={`px-3 py-1 text-xs font-bold rounded-full transition-all duration-300 ${
                                          mainTimeRange === range 
                                          ? 'bg-blue-500 text-white shadow-md transform scale-105' 
                                          : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200'
                                      }`}
                                  >
                                      {range === '1Y' ? '1年' : range.replace('M', '月')}
                                  </button>
                              ))}
                          </div>
                      </div>
                      <div className="h-72 w-full text-xs">
                        <ResponsiveContainer width="100%" height="100%">
                          <AreaChart data={trendData} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                            <defs>
                                <linearGradient id="colorValue" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#3B82F6" stopOpacity={0.1}/>
                                    <stop offset="95%" stopColor="#3B82F6" stopOpacity={0}/>
                                </linearGradient>
                            </defs>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#E2E8F0"/>
                            <XAxis 
                                dataKey="date" 
                                axisLine={false} 
                                tickLine={false} 
                                tick={{fill: '#64748B', fontSize: 11}} 
                                tickFormatter={formatAxisDate}
                                minTickGap={30}
                            />
                            <YAxis 
                                hide={false} 
                                axisLine={false} 
                                tickLine={false} 
                                tick={{fill: '#64748B', fontSize: 11}}
                                tickFormatter={formatAxisValue}
                                domain={['auto', 'auto']}
                                width={45}
                            />
                            <RechartsTooltip 
                                formatter={(value, name) => [formatCurrency(value), name]} 
                                labelFormatter={formatAxisDate}
                                contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                            />
                            <Legend verticalAlign="top" height={36}/>
                            <Brush 
                                dataKey="date" 
                                height={30} 
                                stroke="#cbd5e1" 
                                tickFormatter={formatAxisDate}
                                fill="#f8fafc"
                            />
                            {members.map((member, index) => (
                                <Area 
                                    key={member.id}
                                    type="monotone" 
                                    dataKey={member.id} 
                                    name={member.name} 
                                    stackId="1" 
                                    stroke={COLORS[index % COLORS.length]} 
                                    fill={COLORS[index % COLORS.length]} 
                                    fillOpacity={0.6}
                                />
                            ))}
                          </AreaChart>
                        </ResponsiveContainer>
                      </div>
                    </Card>

                    {/* Inventory List (Grouped by Member) */}
                    <Card className="overflow-hidden bg-white">
                       <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2"><Layers size={18} className="text-blue-500"/> 持股明細</h3>
                          <div className="flex bg-slate-200 p-0.5 rounded-lg">
                             <button onClick={() => { setHoldingViewMode('summary'); setListFilter({ memberId: null, symbol: null }); }} className={`px-3 py-1 text-xs font-medium rounded-md transition-all ${holdingViewMode === 'summary' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>彙整</button>
                             <button onClick={() => setHoldingViewMode('detail')} className={`px-3 py-1 text-xs font-medium rounded-md transition-all ${holdingViewMode === 'detail' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'}`}>明細</button>
                          </div>
                       </div>
                       
                       {holdingViewMode === 'summary' ? (
                         <div className="p-4 space-y-6">
                            {members.map((m, i) => {
                                const memberHoldings = aggregatedHoldings.filter(h => h.memberId === m.id);
                                if (memberHoldings.length === 0) return null;
                                
                                const mTotalValue = memberHoldings.reduce((sum, h) => sum + h.marketValue, 0);
                                const mTotalCost = memberHoldings.reduce((sum, h) => sum + h.totalCost, 0);
                                const mTotalProfit = memberHoldings.reduce((sum, h) => sum + h.unrealizedProfit, 0);
                                const mProfitPercent = mTotalCost > 0 ? (mTotalProfit / mTotalCost) * 100 : 0;

                                return (
                                    <div key={m.id} className="border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                                        <div className="bg-slate-50/80 px-4 py-3 border-b border-slate-200 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
                                            <div className="flex items-center gap-2">
                                                <div className="w-3 h-3 rounded-full shadow-sm" style={{background: COLORS[i % COLORS.length]}}></div>
                                                <h4 className="font-bold text-slate-700 text-base">{m.name}</h4>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-4 text-sm">
                                                <span className="text-slate-500">市值 <span className="font-bold text-slate-800 ml-1">{formatCurrency(mTotalValue)}</span></span>
                                                <span className="text-slate-500">未實現 
                                                    <span className={`font-bold ml-1 ${mTotalProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                                        {mTotalProfit > 0 ? '+' : ''}{formatNumber(mTotalProfit)} ({mProfitPercent.toFixed(1)}%)
                                                    </span>
                                                </span>
                                            </div>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                               <thead className="bg-white text-slate-400 font-medium border-b border-slate-100">
                                                  <tr>
                                                     <th className="p-3 pl-4">標的</th>
                                                     <th className="p-3 text-right">股數</th>
                                                     <th className="p-3 text-right">均價</th>
                                                     <th className="p-3 text-right">現價</th>
                                                     <th className="p-3 text-right">市值</th>
                                                     <th className="p-3 text-right">未實現損益</th>
                                                     <th className="p-3 text-right">已實現</th>
                                                     <th className="p-3 text-center">操作</th>
                                                  </tr>
                                               </thead>
                                               <tbody className="divide-y divide-slate-100 bg-white">
                                                  {memberHoldings.map((h, idx) => (
                                                      <tr 
                                                          key={idx} 
                                                          onClick={() => handleDrillDown(h.memberId, h.symbol)}
                                                          className="hover:bg-slate-50/80 transition-colors cursor-pointer group"
                                                      >
                                                          <td className="p-3 pl-4">
                                                              <div className="font-bold text-slate-800">{h.name}</div>
                                                              <div className="text-xs text-slate-400">{h.symbol}</div>
                                                          </td>
                                                          <td className="p-3 text-right">{formatNumber(h.shares)}</td>
                                                          <td className="p-3 text-right text-slate-500">{formatNumber(h.avgCost.toFixed(1))}</td>
                                                          <td className="p-3 text-right">
                                                              <div className="font-medium">{h.currentPrice || '-'}</div>
                                                              {h.dailyChangePercent !== 0 && (
                                                                  <div className={`text-xs ${h.dailyChangePercent > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{h.dailyChangePercent > 0 ? '+' : ''}{h.dailyChangePercent.toFixed(2)}%</div>
                                                              )}
                                                          </td>
                                                          <td className="p-3 text-right font-medium text-slate-800">{formatNumber(h.marketValue)}</td>
                                                          <td className={`p-3 text-right font-medium ${h.unrealizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>
                                                              {formatNumber(h.unrealizedProfit)}
                                                              <div className="text-xs opacity-75">{h.unrealizedProfitPercent.toFixed(1)}%</div>
                                                          </td>
                                                          <td className={`p-3 text-right ${h.realizedProfit >= 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatNumber(h.realizedProfit)}</td>
                                                          <td className="p-3 text-center">
                                                              <button 
                                                                  onClick={(e) => { e.stopPropagation(); handleAuthRequired(() => handleDrillDown(h.memberId, h.symbol)); }} 
                                                                  className="text-blue-600 hover:text-blue-800 text-xs font-bold border border-blue-200 hover:bg-blue-50 px-2 py-1 rounded transition-colors"
                                                              >
                                                                  編輯
                                                              </button>
                                                          </td>
                                                      </tr>
                                                  ))}
                                               </tbody>
                                            </table>
                                        </div>
                                    </div>
                                );
                            })}
                            {aggregatedHoldings.length === 0 && <div className="p-8 text-center text-slate-400">目前沒有持股資料</div>}
                         </div>
                       ) : (
                         <div className="p-4 space-y-6">
                            {(listFilter.memberId || listFilter.symbol) && (
                               <div className="bg-blue-50 px-4 py-3 rounded-xl flex justify-between items-center text-sm text-blue-700 border border-blue-100">
                                  <span className="flex items-center gap-2">
                                    <Filter size={16}/> 
                                    目前顯示: <b>{members.find(m => m.id === listFilter.memberId)?.name || '所有成員'}</b> 的 <b>{listFilter.symbol || '所有標的'}</b>
                                  </span>
                                  <button onClick={() => setListFilter({ memberId: null, symbol: null })} className="flex items-center gap-1 text-slate-500 hover:text-slate-800 hover:underline font-medium border border-slate-300 bg-white px-3 py-1 rounded-lg shadow-sm">
                                    <XCircle size={14}/> 顯示全部
                                  </button>
                               </div>
                            )}
                            
                            {members.map((m, i) => {
                                const mHoldings = holdings.filter(h => h.memberId === m.id);
                                if (mHoldings.length === 0) return null;
                                if (listFilter.memberId && listFilter.memberId !== m.id) return null; // 處理過濾器

                                return (
                                    <div key={m.id} className="border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                                        <div className="bg-slate-50/80 px-4 py-3 border-b border-slate-200 flex items-center gap-2">
                                            <div className="w-3 h-3 rounded-full shadow-sm" style={{background: COLORS[i % COLORS.length]}}></div>
                                            <h4 className="font-bold text-slate-700 text-base">{m.name} 的交易紀錄</h4>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                               <thead className="bg-white text-slate-400 font-medium border-b border-slate-100">
                                                  <tr>
                                                     <th className="p-3 pl-4">日期</th>
                                                     <th className="p-3">動作</th>
                                                     <th className="p-3">標的</th>
                                                     <th className="p-3 text-right">股數</th>
                                                     <th className="p-3 text-right">價格</th>
                                                     <th className="p-3 text-right">總額</th>
                                                     <th className="p-3 text-center">操作</th>
                                                  </tr>
                                               </thead>
                                               <tbody className="divide-y divide-slate-100 bg-white">
                                                  {mHoldings.map((h) => {
                                                     const isBuy = h.shares > 0;
                                                     return (
                                                         <tr 
                                                            key={h.id} 
                                                            onClick={() => handleAuthRequired(() => { 
                                                                setEditingHolding(h); 
                                                                setHoldingForm({
                                                                    ...holdingForm, 
                                                                    ...h, 
                                                                    date: h.date, 
                                                                    type: h.shares > 0 ? 'buy' : 'sell', 
                                                                    shares: Math.abs(h.shares).toString(),
                                                                    fee: h.fee ? h.fee.toString() : "1",
                                                                    note: h.note || ""
                                                                }); 
                                                                setIsAddHoldingOpen(true); 
                                                            })}
                                                            className="hover:bg-slate-50/80 transition-colors cursor-pointer group"
                                                         >
                                                            <td className="p-3 pl-4 text-slate-500 whitespace-nowrap">{h.date}</td>
                                                            <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${isBuy ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>{isBuy ? '買進' : '賣出'}</span></td>
                                                            <td className="p-3"><div className="font-bold text-slate-800">{h.name}</div><div className="text-xs text-slate-400">{h.symbol}</div></td>
                                                            <td className="p-3 text-right">{formatNumber(Math.abs(h.shares))}</td>
                                                            <td className="p-3 text-right text-slate-500">{formatNumber(h.price)}</td>
                                                            <td className="p-3 text-right font-medium text-slate-700">{formatNumber(Math.abs(h.shares * h.price))}</td>
                                                            <td className="p-3 text-center">
                                                               <button onClick={(e) => { e.stopPropagation(); handleAuthRequired(() => setDeleteConfirm({ id: h.id })); }} className="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors"><Trash2 size={16}/></button>
                                                            </td>
                                                         </tr>
                                                     )
                                                  })}
                                               </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )
                            })}
                            {holdings.length === 0 && <div className="p-8 text-center text-slate-400">目前沒有交易紀錄</div>}
                         </div>
                       )}
                    </Card>
                  </div>
                )}
                
                {/* 2. Analysis Tab (Placeholder for future expansion) */}
                {activeTab === 'analysis' && (
                  <div className="text-center p-12">
                    <p className="text-slate-400">更多圖表開發中...</p>
                  </div>
                )}

              </main>

              {/* Modals */}
              <Modal isOpen={isAddMemberOpen} onClose={() => setIsAddMemberOpen(false)} title="新增家庭成員">
                 <div className="space-y-4">
                    <Input label="成員名稱" placeholder="例如：爸爸、媽媽" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} />
                    <Button onClick={handleAddMember} className="w-full mt-2">新增成員</Button>
                    <div className="mt-4 pt-4 border-t border-slate-100">
                       <p className="text-xs text-slate-500 mb-2 font-semibold uppercase">現有成員</p>
                       <div className="flex flex-wrap gap-2">
                          {members.map(m => <span key={m.id} className="bg-slate-100 text-slate-600 px-2 py-1 rounded text-sm flex items-center gap-1">{m.name}</span>)}
                       </div>
                    </div>
                 </div>
              </Modal>
              
              {/* Member Detail Modal (New!) */}
              <MemberDetailModal 
                isOpen={!!selectedMember}
                onClose={() => setSelectedMember(null)}
                member={selectedMember}
                allHoldings={allHoldings}
                year={activeYear}
                historicalPrices={historicalPrices}
              />

              {/* Unlock Modal (New!) */}
              <Modal isOpen={showUnlockModal} onClose={() => setShowUnlockModal(false)} title="安全驗證">
                 <div className="space-y-6 flex flex-col items-center">
                    <div className="bg-blue-100 p-4 rounded-full"><Lock size={32} className="text-blue-600" /></div>
                    <div className="text-center">
                        <h3 className="font-bold text-slate-800 text-lg">請輸入密碼</h3>
                        <p className="text-slate-500 text-sm mt-1">驗證身分以進行編輯</p>
                    </div>
                    
                    {/* Custom Pin Keypad */}
                    <PinKeypad 
                        value={pinInput} 
                        onInput={handlePadInput} 
                        onDelete={handlePadDelete} 
                        onClear={handlePadClear} 
                    />
                 </div>
              </Modal>

              {/* Delete Confirmation Modal */}
              <Modal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="刪除確認">
                 <div className="space-y-4">
                    <div className="flex items-center gap-3 text-red-600 bg-red-50 p-3 rounded-lg">
                       <AlertTriangle size={24} />
                       <p className="font-medium text-sm">確定要刪除這筆交易紀錄嗎？</p>
                    </div>
                    <p className="text-slate-500 text-sm">此動作無法復原，刪除後將從總資產中移除此筆交易的計算。</p>
                    <div className="flex gap-3 pt-2">
                       <Button variant="ghost" onClick={() => setDeleteConfirm(null)} className="flex-1">取消</Button>
                       <Button variant="danger" onClick={executeDelete} className="flex-1">確認刪除</Button>
                    </div>
                 </div>
              </Modal>

              <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="系統設定">
                 <div className="space-y-6">
                    <div>
                       <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><Settings size={18} className="text-blue-500"/> 資料管理</h4>
                       <div className="grid grid-cols-2 gap-3">
                          <Button variant="secondary" onClick={handleExportData} isLoading={processingSettings} className="justify-center">
                             <Download size={16}/> 匯出備份
                          </Button>
                          <div className="relative">
                             <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={handleImportData} 
                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
                                accept=".json"
                             />
                             <Button variant="secondary" isLoading={processingSettings} className="justify-center w-full">
                                <Upload size={16}/> 匯入資料
                             </Button>
                          </div>
                          <Button variant="secondary" onClick={handleRemoveDuplicates} isLoading={processingSettings} className="justify-center text-slate-600">
                             <Copy size={16}/> 移除重複
                          </Button>
                          <Button variant="danger" onClick={handleClearData} isLoading={processingSettings} className="justify-center bg-red-50 text-red-600 hover:bg-red-100 border-red-100">
                             <Trash2 size={16}/> 清空資料
                          </Button>
                       </div>
                    </div>
                    <div className="pt-4 border-t border-slate-100">
                       <h4 className="font-bold text-slate-800 mb-2 flex items-center gap-2"><ShieldCheck size={18} className="text-blue-500"/> 安全性設定</h4>
                       <div className="bg-slate-50 p-4 rounded-lg border border-slate-100">
                          {hasPin ? (
                             <div className="text-center space-y-3">
                                <p className="text-emerald-600 font-medium flex items-center justify-center gap-2"><Lock size={16}/> 已啟用 PIN 碼保護</p>
                                <Button variant="secondary" className="w-full text-sm" onClick={() => { setHasPin(false); setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'security'), { pin: null }); }}>移除密碼</Button>
                             </div>
                          ) : (
                             <div className="space-y-3">
                                <Input label="設定新的 PIN 碼" type="password" placeholder="4 位數字" value={newPin} onChange={e => setNewPin(e.target.value)} maxLength={4} />
                                <Button onClick={handleSetPin} className="w-full">啟用保護</Button>
                             </div>
                          )}
                       </div>
                    </div>
                 </div>
              </Modal>

              <Modal isOpen={isAddHoldingOpen} onClose={() => { setIsAddHoldingOpen(false); setEditingHolding(null); resetForm(); }} title={editingHolding ? "編輯交易紀錄" : "新增交易紀錄"}>
                 <div className="space-y-4">
                  <div className="flex bg-slate-100 rounded-lg p-1"><button className={`flex-1 py-1.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${holdingForm.type === 'buy' ? 'bg-white text-red-600 shadow-sm' : 'text-slate-400'}`} onClick={() => setHoldingForm({...holdingForm, type: 'buy'})}>買進 (Buy)</button><button className={`flex-1 py-1.5 rounded-md text-sm font-bold transition-all flex items-center justify-center gap-2 ${holdingForm.type === 'sell' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`} onClick={() => setHoldingForm({...holdingForm, type: 'sell'})}>賣出 (Sell)</button></div>
                  <div className="flex flex-col gap-1"><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">持有成員</label><select value={holdingForm.memberId} onChange={e => setHoldingForm({...holdingForm, memberId: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="" disabled>選擇成員</option>{members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></div>
                  <div className="flex gap-3"><div className="flex flex-col gap-1 w-full"><label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">交易日期</label><input type="date" value={holdingForm.date} onChange={e => { const newDate = e.target.value; const newYear = newDate ? newDate.split('-')[0] : holdingForm.year; setHoldingForm({ ...holdingForm, date: newDate, year: newYear }); }} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"/></div></div>
                  
                  {/* Stock Symbol Input with Auto-fill */}
                  <div className="grid grid-cols-2 gap-3">
                     <div className="flex flex-col gap-1 relative">
                        <Input label="股票代號" placeholder="例如：2330" value={holdingForm.symbol} onChange={e => setHoldingForm({...holdingForm, symbol: e.target.value})} onBlur={handleSymbolBlur} onKeyDown={handleSymbolKeyDown} />
                        {loadingStockInfo && <div className="absolute right-3 top-8 text-slate-400 animate-spin"><Loader2 size={16}/></div>}
                     </div>
                     <Input label="股票名稱" placeholder="台積電" value={holdingForm.name} onChange={e => setHoldingForm({...holdingForm, name: e.target.value})} />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-3"><Input label="成交股數" type="number" placeholder="1000" value={holdingForm.shares} onChange={e => setHoldingForm({...holdingForm, shares: e.target.value})} /><Input label="成交單價" type="number" placeholder="500" value={holdingForm.price} onChange={e => setHoldingForm({...holdingForm, price: e.target.value})} /></div>
                  <div className="grid grid-cols-2 gap-3"><Input label="手續費" type="number" placeholder="20" value={holdingForm.fee} onChange={e => setHoldingForm({...holdingForm, fee: e.target.value})} /><div className="flex flex-col gap-1 justify-center"><span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">預估總金額</span><div className={`text-lg font-bold ${holdingForm.type === 'buy' ? 'text-red-600' : 'text-emerald-600'}`}>{formatNumber(calculateEstimate())}</div></div></div>
                  <Input label="備註" placeholder="例如：定期定額、波段..." value={holdingForm.note} onChange={e => setHoldingForm({...holdingForm, note: e.target.value})} /><Button onClick={handleSaveHolding} className="w-full mt-2" variant={holdingForm.type === 'buy' ? 'buyActive' : 'sellActive'}><Save size={18} /> {editingHolding ? "儲存修改" : "確認新增"}</Button>
                 </div>
              </Modal>

            </div>
          );
        }

        // --- 啟動 React ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
